# NodeNotAdvancing, NodeBehind and ValidatorNotSigning on the example-mainnet inventory: val-1 is the
# validator node, fibre-1 a backup node without a key. Only the node tmkms is connected to exports
# the last signed height, so the rules read which node signs from the metrics. The chain makes
# 10 blocks per minute; samples are one minute apart.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Both nodes in sync and val-1 signs; no alert
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x40'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '999+10x40'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: NodeNotAdvancing
        exp_alerts: []
      - eval_time: 40m
        alertname: NodeBehind
        exp_alerts: []
      - eval_time: 40m
        alertname: ValidatorNotSigning
        exp_alerts: []

  # val-1 goes down at 10m and its series end. fibre-1 keeps advancing, and no node exports a last
  # signed height until tmkms is pointed at fibre-1, whose first signature arrives at 20m. Prometheus
  # cannot tell a dead host from one it cannot reach, so the description names val-1 as unreachable
  # and does not claim that it signs.
  - name: Validator host down; ValidatorNotSigning pages after 2m and resolves once fibre-1 signs
    interval: 1m
    input_series:
      - series: >-
          up{job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1x9 0x30'
      - series: >-
          up{job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1x40'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x9 stale'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x9 stale'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x40'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '_x20 1199+10x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 12m
        alertname: ValidatorNotSigning
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "The validator is not signing"
              description: >-
                Check journalctl -u tmkms on the KMS host first.
                The chain moves but no node of this install has seen a signature from the validator for more than 10 blocks.
                Prometheus cannot reach the node on val-1, so signatures made through it are not seen;
                an explorer shows whether blocks are missed.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#validatornotsigning"
      - eval_time: 19m
        alertname: ValidatorNotSigning
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "The validator is not signing"
              description: >-
                Check journalctl -u tmkms on the KMS host first.
                The chain moves but no node of this install has seen a signature from the validator for more than 10 blocks.
                Prometheus cannot reach the node on val-1, so signatures made through it are not seen;
                an explorer shows whether blocks are missed.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#validatornotsigning"
      - eval_time: 20m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeNotAdvancing
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeBehind
        exp_alerts: []

  # tmkms is pointed at fibre-1 at 10m while val-1 keeps running: val-1's last signed height stays
  # at 1089 and fibre-1's first signature arrives at 11m. The highest last signed height follows
  # the node that signs, and the one-minute gap does not last 2 minutes.
  - name: tmkms pointed at the backup node while val-1 runs; no alert
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x30'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x9 1089x21'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x30'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '_x11 1109+10x19'
    alert_rule_test:
      - eval_time: 12m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 30m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeBehind
        exp_alerts: []

  # After a repoint val-1 keeps the key it last read and reports the same signatures as fibre-1,
  # the node tmkms now uses. The signer stops at 10m: both last signed heights freeze at 1099 and
  # the gap is above 10 blocks from 11m. Both nodes are reachable, so the description names none:
  # it must not name val-1, which no longer signs.
  - name: Signer stops after a repoint while both nodes report signatures; the description names no node
    interval: 1m
    input_series:
      - series: >-
          up{job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1x30'
      - series: >-
          up{job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1x30'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x30'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x10 1099x20'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x30'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x10 1099x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 13m
        alertname: ValidatorNotSigning
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "The validator is not signing"
              description: >-
                Check journalctl -u tmkms on the KMS host first.
                The chain moves but no node of this install has seen a signature from the validator for more than 10 blocks.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#validatornotsigning"

  # fibre-1 is 30 blocks behind val-1 from the start.
  - name: Backup node 30 blocks behind; NodeBehind sends a message after 10m
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x20'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x20'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '970+10x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: NodeBehind
        exp_alerts: []
      - eval_time: 10m
        alertname: NodeBehind
        exp_alerts:
          - exp_labels:
              chain_id: celestia
              job: celestia-app
              instance: 10.20.0.2:26660
              host: fibre-1
              role: backup_node
              severity: message
            exp_annotations:
              summary: "Node on fibre-1 is behind"
              description: >-
                For 10 minutes the node has been more than 20 blocks behind the highest node of this install,
                or has not advanced while another node did. A node that lags cannot take over signing.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#nodebehind"
      - eval_time: 10m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 10m
        alertname: NodeNotAdvancing
        exp_alerts: []

  # fibre-1 stops at height 1050 at 5m. From 6m its 2-minute window holds no change while val-1
  # advances (it is more than 20 blocks behind only from 8m), so the message comes at 16m.
  - name: Backup node stuck while the validator node advances; NodeBehind after 10m
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x20'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x20'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x5 1050x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeBehind
        exp_alerts: []
      - eval_time: 16m
        alertname: NodeBehind
        exp_alerts:
          - exp_labels:
              chain_id: celestia
              job: celestia-app
              instance: 10.20.0.2:26660
              host: fibre-1
              role: backup_node
              severity: message
            exp_annotations:
              summary: "Node on fibre-1 is behind"
              description: >-
                For 10 minutes the node has been more than 20 blocks behind the highest node of this install,
                or has not advanced while another node did. A node that lags cannot take over signing.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#nodebehind"

  # Both nodes stop at 10m (chain halt or upgrade height). NodeNotAdvancing pages at 12m; the
  # last signed height stays one block behind, and no node lags the other.
  - name: Whole install stuck; only NodeNotAdvancing fires
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x10 1100x30'
      - series: >-
          cometbft_consensus_validator_last_signed_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator",validator_address="0123456789ABCDEF0123456789ABCDEF01234567"}
        values: '999+10x10 1099x30'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x10 1100x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: NodeNotAdvancing
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeNotAdvancing
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "No node is advancing"
              description: >-
                No node of this install has committed a new block for 3 minutes, or Prometheus reads no node's height.
                Check status.celestia.org or an explorer first: the whole chain may have halted.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#nodenotadvancing"
      - eval_time: 30m
        alertname: ValidatorNotSigning
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeBehind
        exp_alerts: []

  # Both nodes' series end at 5m: from 6m Prometheus reads no height at all.
  - name: No node reports a height; NodeNotAdvancing pages
    interval: 1m
    input_series:
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.1:26660",host="val-1",role="validator"}
        values: '1000+10x4 stale'
      - series: >-
          cometbft_consensus_height{chain_id="celestia",job="celestia-app",instance="10.20.0.2:26660",host="fibre-1",role="backup_node"}
        values: '1000+10x4 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeNotAdvancing
        exp_alerts: []
      - eval_time: 6m
        alertname: NodeNotAdvancing
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "No node is advancing"
              description: >-
                No node of this install has committed a new block for 3 minutes, or Prometheus reads no node's height.
                Check status.celestia.org or an explorer first: the whole chain may have halted.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#nodenotadvancing"
