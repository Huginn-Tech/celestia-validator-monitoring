# FibreDown seen from outside, FibreNotServing from Tensile's blob record, and TensileUnreadable, on
# the example-mainnet inventory rendered with celestia_mon_tensile (CI passes it): celestia-mon-tensile
# on mon-1 serves Tensile's checks of the endpoint registered on chain and the blobs assigned to the
# validator. fibre-1's public endpoint is fibre.example.org:7980, val-1's (its standby)
# val.example.org:7980. In the FibreNotServing cases fibre-1's Fibre runs from 1m (start time 60 s)
# and val-1 is a stopped standby; Tensile is read every minute.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Fibre runs on fibre-1 but Tensile cannot reach it; FibreDown after 10 minutes
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x30'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x30'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x30'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0x30'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 15m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
              check: reachability
              endpoint: fibre.example.org:7980
            exp_annotations:
              summary: Fibre at fibre.example.org:7980 is unreachable from outside
              description: >-
                For 10 minutes Tensile's checks from outside have not completed a connection to the Fibre
                endpoint registered on chain (TCP and TLS), so clients cannot fetch
                from it, although its unit may run. The dashboard's Fibre from outside tile shows the outcome of
                the last check.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown
      - eval_time: 15m
        alertname: TensileUnreadable
        exp_alerts: []

  - name: Tensile's last check is old; no FibreDown from it, TensileUnreadable instead
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x60'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x60'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0x60'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 25m
        alertname: TensileUnreadable
        exp_alerts: []
      - eval_time: 26m
        alertname: TensileUnreadable
        exp_alerts:
          - exp_labels:
              severity: message
              host: mon-1
            exp_annotations:
              summary: Fibre is not checked from outside
              description: >-
                For 15 minutes celestia-mon-tensile has not read Tensile, Tensile has not checked the Fibre
                endpoint, or the service is down, so an endpoint unreachable from outside would not page, and rows Fibre
                does not serve would not be reported. Run journalctl -u celestia-mon-tensile on the monitor: it
                names the cause.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#tensileunreadable

  - name: After a failover to val-1 the chain still points to fibre-1; FibreDown for the address and the reachability
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '0x30'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '1x30'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x30'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0x30'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0+60x30'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
              check: reachability
              endpoint: fibre.example.org:7980
            exp_annotations:
              summary: Fibre at fibre.example.org:7980 is unreachable from outside
              description: >-
                For 10 minutes Tensile's checks from outside have not completed a connection to the Fibre
                endpoint registered on chain (TCP and TLS), so clients cannot fetch
                from it, although its unit may run. The dashboard's Fibre from outside tile shows the outcome of
                the last check.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown
          - exp_labels:
              severity: page
              check: registration
              reason: wrong_host
              endpoint: fibre.example.org:7980
            exp_annotations:
              summary: The chain points to fibre.example.org:7980, but Fibre runs on val-1
              description: >-
                For 10 minutes Fibre has been active on val-1, whose public endpoint is val.example.org:7980,
                while the chain registers another endpoint, so clients dial a host where this Fibre does not run
                (after a failover, set-host was not sent). Fix: celestia-appd tx valaddr set-host
                val.example.org:7980 --from <validator account key>.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown

  # val-1 starts while the chain still names fibre-1, a move done make-before-break: clients reach a
  # running Fibre. FibreBothActive reports the two, and wrong_host waits until one is left.
  - name: Two Fibres run and the chain names fibre-1; FibreBothActive, no FibreDown
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x40'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x4 1x35'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0+60x40'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreBothActive
        exp_alerts:
          - exp_labels:
              severity: message
            exp_annotations:
              summary: Fibre is active on more than one host
              description: >-
                For 5 minutes fibre.service has been active on fibre-1, val-1.
                Fibre runs on one host at a time: stop the one that should be the standby.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrebothactive

  # The same, until fibre-1 stops at 20m with the chain still on it: now clients dial a host where
  # Fibre does not run, and the 10 minutes start.
  - name: One of two Fibres stops with the chain still on it; wrong_host 10 minutes later
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x19 0x20'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x4 1x35'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '0+60x40'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
              check: registration
              reason: wrong_host
              endpoint: fibre.example.org:7980
            exp_annotations:
              summary: The chain points to fibre.example.org:7980, but Fibre runs on val-1
              description: >-
                For 10 minutes Fibre has been active on val-1, whose public endpoint is val.example.org:7980,
                while the chain registers another endpoint, so clients dial a host where this Fibre does not run
                (after a failover, set-host was not sent). Fix: celestia-appd tx valaddr set-host
                val.example.org:7980 --from <validator account key>.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown

  # set-host went out, and the old box came back with its unit enabled. The fix is to stop fibre-1,
  # not to set the host back to it.
  - name: Two Fibres run and the chain names val-1; no FibreDown
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x40'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x4 1x35'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="val.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_reachable{job="tensile",host="mon-1",endpoint="val.example.org:7980"}'
        values: '1x40'
      - series: 'celestia_mon_fibre_last_check_timestamp_seconds{job="tensile",host="mon-1",endpoint="val.example.org:7980"}'
        values: '0+60x40'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []

  # celestia-mon-tensile last read Tensile at 10m, and a correct failover to val-1 happens then:
  # set-host went out, which the frozen reading cannot show. A reading over 9 minutes old does not
  # count, so wrong_host goes pending at 10m and ends at 19m, before its 10 minutes.
  - name: Tensile is not read during a failover; no wrong_host from the old reading
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x9 0x40'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x9 1x40'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x50'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '0+60x10 600x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []

  - name: No Fibre host registered on chain; FibreDown after 10 minutes
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x30'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint=""}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 15m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
              check: registration
              reason: not_registered
            exp_annotations:
              summary: No Fibre host is registered on chain
              description: >-
                For 10 minutes the chain has had no Fibre host for the validator in x/valaddr, so no client
                finds it. Register the active Fibre host: celestia-appd tx valaddr set-host <host:port> --from
                <validator account key>.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown

  # celestia-mon-tensile last read Tensile at 1m: TensileUnreadable reports it 15 + 10 minutes on,
  # and no FibreNotServing comes from the old reading.
  - name: Tensile is not read; TensileUnreadable
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x60'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x60'
      - series: 'node_systemd_unit_start_time_seconds{job="node",host="fibre-1",name="fibre.service"}'
        values: '60x60'
      - series: 'node_systemd_unit_start_time_seconds{job="node",host="val-1",name="fibre.service"}'
        values: '0x60'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="fibre-1"}'
        values: '1000000000000x60'
      - series: 'fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",host="fibre-1"}'
        values: '600x60'
      - series: 'celestia_mon_tensile_last_success_timestamp_seconds{job="tensile",host="mon-1"}'
        values: '60x60'
    alert_rule_test:
      - eval_time: 26m
        alertname: TensileUnreadable
        exp_alerts: []
      - eval_time: 27m
        alertname: TensileUnreadable
        exp_alerts:
          - exp_labels:
              severity: message
              host: mon-1
              job: tensile
            exp_annotations:
              summary: Fibre is not checked from outside
              description: >-
                For 15 minutes celestia-mon-tensile has not read Tensile, Tensile has not checked the Fibre
                endpoint, or the service is down, so an endpoint unreachable from outside would not page, and rows Fibre
                does not serve would not be reported. Run journalctl -u celestia-mon-tensile on the monitor: it
                names the cause.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#tensileunreadable
    promql_expr_test:
      - expr: count_over_time(ALERTS{alertname="FibreNotServing"}[60m])
        eval_time: 60m
        exp_samples: []

  # At 90m Tensile reads rows of a blob the validator signed for, and Fibre does not return them: its
  # count of failed reads in the last 24 hours rises from 0 to 1. One failed read, from one place, can
  # be a blip between Tensile and the host: nothing, not even a pending alert. At 121m a second read
  # fails (1 to 2): not_served goes out at once and resolves an hour after that rise, while the count
  # stays at 2.
  - name: A second failed read of rows the validator signed for; not_served at once, for an hour
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x200'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="fibre-1"}'
        values: '1000000000000x200'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x200'
      - series: 'celestia_mon_fibre_obligations_24h{job="tensile",host="mon-1",outcome="served"}'
        values: '215x200'
      - series: 'celestia_mon_fibre_obligations_24h{job="tensile",host="mon-1",outcome="broken"}'
        values: '0x89 1x30 2x80'
    alert_rule_test:
      - eval_time: 90m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 121m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_served
              severity: message
            exp_annotations:
              summary: Fibre on fibre-1 did not serve rows the validator signed for
              description: >-
                In the last hour Tensile could not read rows of a blob the validator signed for, within the time
                Fibre must keep them, so clients could not fetch the validator's share of it; that makes 2 failed
                reads in Tensile's last 24 hours (one alone does not fire this). Fibre's log names a store error
                (failed to retrieve blob shard); check the Fibre store's disk and its failed clean-ups.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving
      - eval_time: 180m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_served
              severity: message
            exp_annotations:
              summary: Fibre on fibre-1 did not serve rows the validator signed for
              description: >-
                In the last hour Tensile could not read rows of a blob the validator signed for, within the time
                Fibre must keep them, so clients could not fetch the validator's share of it; that makes 2 failed
                reads in Tensile's last 24 hours (one alone does not fire this). Fibre's log names a store error
                (failed to retrieve blob shard); check the Fibre store's disk and its failed clean-ups.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving
      - eval_time: 181m
        alertname: FibreNotServing
        exp_alerts: []
    promql_expr_test:
      - expr: count_over_time(ALERTS{alertname="FibreNotServing"}[35m])
        eval_time: 120m
        exp_samples: []

  # The move at 30m: the chain names val-1 from then on, and fibre-1's blobs are read at val-1, which
  # does not hold them. Their failed reads rise from 61m to 70m and once more at 270m, all of them
  # held back. The old endpoint's last reading (29m) leaves the 5h15m at 344m, so the rise at 350m,
  # a read of a blob val-1 did take, sends the message for val-1.
  - name: Failed reads after the registration moved; no not_served for 5h15m
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x29 0x400'
      - series: 'node_systemd_unit_state{job="node",host="val-1",name="fibre.service",state="active"}'
        values: '0x29 1x400'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="fibre-1"}'
        values: '1000000000000x29 stale'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="val-1"}'
        values: '_x30 1000000000000x400'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="fibre.example.org:7980"}'
        values: '1x29 stale'
      - series: 'celestia_mon_fibre_registered{job="tensile",host="mon-1",endpoint="val.example.org:7980"}'
        values: '_x30 1x400'
      - series: 'celestia_mon_fibre_obligations_24h{job="tensile",host="mon-1",outcome="broken"}'
        values: '0x59 1+1x10 11x198 12x79 13x80'
    alert_rule_test:
      - eval_time: 80m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 270m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 329m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 349m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 350m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: val-1
              reason: not_served
              severity: message
            exp_annotations:
              summary: Fibre on val-1 did not serve rows the validator signed for
              description: >-
                In the last hour Tensile could not read rows of a blob the validator signed for, within the time
                Fibre must keep them, so clients could not fetch the validator's share of it; that makes 13 failed
                reads in Tensile's last 24 hours (one alone does not fire this). Fibre's log names a store error
                (failed to retrieve blob shard); check the Fibre store's disk and its failed clean-ups.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving

  # Two failed reads in the same minute (0 to 2) fire at once too.
  - name: Two failed reads at once; not_served
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x60'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="fibre-1"}'
        values: '1000000000000x60'
      - series: 'celestia_mon_fibre_obligations_24h{job="tensile",host="mon-1",outcome="broken"}'
        values: '0x19 2x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 20m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_served
              severity: message
            exp_annotations:
              summary: Fibre on fibre-1 did not serve rows the validator signed for
              description: >-
                In the last hour Tensile could not read rows of a blob the validator signed for, within the time
                Fibre must keep them, so clients could not fetch the validator's share of it; that makes 2 failed
                reads in Tensile's last 24 hours (one alone does not fire this). Fibre's log names a store error
                (failed to retrieve blob shard); check the Fibre store's disk and its failed clean-ups.
              runbook: https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving

  # Failed reads of a day ago leave Tensile's 24 hours one by one: the count falls, nothing is new.
  - name: Old failed reads leave Tensile's 24 hours; no not_served
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node",host="fibre-1",name="fibre.service",state="active"}'
        values: '1x180'
      - series: 'fibre_server_upload_shard_budget_bytes{job="otelcol",host="fibre-1"}'
        values: '1000000000000x180'
      - series: 'celestia_mon_fibre_obligations_24h{job="tensile",host="mon-1",outcome="broken"}'
        values: '2x60 1x60 0x59'
    alert_rule_test:
      - eval_time: 61m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 125m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 180m
        alertname: FibreNotServing
        exp_alerts: []
