# ClockNotSynced on the example-mainnet inventory: node_exporter's timex collector reads the kernel's
# maximum error (node_timex_maxerror_seconds), which chrony or systemd-timesyncd sets at each update
# and the kernel raises 0.5 ms a second (30 ms a minute) until the next, up to 16 s: not synchronised.
# Samples are one minute apart.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  # mon-1's time sync stopped long ago: its error sits at 16 s. The message fires after an hour, and
  # resolves 10 minutes after the first update once time sync works again (71m; keep_firing_for).
  - name: A clock not synchronised for an hour; the message, resolved after the next update
    interval: 1m
    input_series:
      - series: >-
          node_timex_maxerror_seconds{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor"}
        values: '16x70 0.012+0.03x10'
    alert_rule_test:
      - eval_time: 59m
        alertname: ClockNotSynced
        exp_alerts: []
      - eval_time: 60m
        alertname: ClockNotSynced
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.3:9910
              host: mon-1
              role: monitor
              severity: message
            exp_annotations:
              summary: "Clock not synchronised on mon-1"
              description: >-
                For an hour the kernel has reported this host's clock as not synchronised: chrony or systemd-timesyncd has
                stopped correcting it, or has not corrected it since boot. Nothing fails yet, but the clock now drifts freely:
                a Celestia node whose clock falls about 60 seconds behind rejects every block, and a Fibre server whose clock
                runs about 2 minutes ahead reports itself not ready. Run chronyc tracking or timedatectl timesync-status, and
                allow outgoing NTP (UDP 123).
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#clocknotsynced"
      - eval_time: 80m
        alertname: ClockNotSynced
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.3:9910
              host: mon-1
              role: monitor
              severity: message
            exp_annotations:
              summary: "Clock not synchronised on mon-1"
              description: >-
                For an hour the kernel has reported this host's clock as not synchronised: chrony or systemd-timesyncd has
                stopped correcting it, or has not corrected it since boot. Nothing fails yet, but the clock now drifts freely:
                a Celestia node whose clock falls about 60 seconds behind rejects every block, and a Fibre server whose clock
                runs about 2 minutes ahead reports itself not ready. Run chronyc tracking or timedatectl timesync-status, and
                allow outgoing NTP (UDP 123).
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#clocknotsynced"
      - eval_time: 81m
        alertname: ClockNotSynced
        exp_alerts: []

  # A failed scrape marks every series of the target stale. The alert keeps firing through it, so no
  # "resolved" message reads as time sync working again.
  - name: Two failed scrapes do not resolve it
    interval: 1m
    input_series:
      - series: >-
          node_timex_maxerror_seconds{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '16x62 stale stale 16x10'
    alert_rule_test:
      - eval_time: 64m
        alertname: ClockNotSynced
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.2:9910
              host: fibre-1
              role: fibre
              severity: message
            exp_annotations:
              summary: "Clock not synchronised on fibre-1"
              description: >-
                For an hour the kernel has reported this host's clock as not synchronised: chrony or systemd-timesyncd has
                stopped correcting it, or has not corrected it since boot. Nothing fails yet, but the clock now drifts freely:
                a Celestia node whose clock falls about 60 seconds behind rejects every block, and a Fibre server whose clock
                runs about 2 minutes ahead reports itself not ready. Run chronyc tracking or timedatectl timesync-status, and
                allow outgoing NTP (UDP 123).
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#clocknotsynced"

  # A step or a clocksource switch sets 16 s until the daemon's next update; on val-1 that takes 50
  # minutes, under the hour. fibre-1 runs with the daemon's usual saw tooth, up to 0.5 s between
  # updates 17 minutes apart. Neither fires.
  - name: 16 s for 50 minutes, and a working saw tooth, send nothing
    interval: 1m
    input_series:
      - series: >-
          node_timex_maxerror_seconds{job="node",instance="10.20.0.1:9910",host="val-1",role="validator"}
        values: '0.02+0.03x9 16x50 0.02+0.03x30'
      - series: >-
          node_timex_maxerror_seconds{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '0+0.03x16 0+0.03x16 0+0.03x16 0+0.03x16 0+0.03x16'
    alert_rule_test:
      - eval_time: 90m
        alertname: ClockNotSynced
        exp_alerts: []
