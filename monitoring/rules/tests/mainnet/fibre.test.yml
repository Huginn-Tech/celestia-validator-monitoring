# FibreDown, FibreBothActive and FibreNotServing on the example-mainnet inventory: Fibre is installed
# on fibre-1 (normally active) and on val-1 (a stopped standby). Which one runs is read from systemd.
# A stopped Fibre unit is no ServiceDown; FibreDown pages only when no Fibre unit is active anywhere.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: fibre-1 active and val-1 a stopped standby; no FibreDown, FibreBothActive or ServiceDown
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.20.0.1:9910",host="val-1",role="validator"}
        values: '1x30'
      - series: >-
          up{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreBothActive
        exp_alerts: []
      - eval_time: 30m
        alertname: ServiceDown
        exp_alerts: []

  # fibre-1's Fibre is stopped at 5m and val-1's standby started at 7m: two minutes with no Fibre
  # active, well inside FibreDown's 10.
  - name: Fibre failover to val-1; no FibreDown and no ServiceDown for the stopped unit
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.20.0.1:9910",host="val-1",role="validator"}
        values: '1x30'
      - series: >-
          up{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x4 0x25'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x6 1x23'
    alert_rule_test:
      - eval_time: 16m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 10m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 30m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreBothActive
        exp_alerts: []

  - name: Both Fibre units inactive; FibreDown pages after 10 minutes
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.20.0.1:9910",host="val-1",role="validator"}
        values: '1x30'
      - series: >-
          up{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x4 0x25'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: FibreDown
        exp_alerts: []
      - eval_time: 15m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Fibre is not running on any host"
              description: >-
                For 10 minutes no Fibre host (fibre-1, val-1) has reported fibre.service as active: Fibre is stopped everywhere,
                the host of the active Fibre is down, or celestia_mon_units.fibre names the wrong unit.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown"
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []

  - name: Fibre active on both hosts; FibreBothActive sends a message after 5 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x4 1x25'
    alert_rule_test:
      - eval_time: 9m
        alertname: FibreBothActive
        exp_alerts: []
      - eval_time: 10m
        alertname: FibreBothActive
        exp_alerts:
          - exp_labels:
              severity: message
            exp_annotations:
              summary: "Fibre is active on more than one host"
              description: >-
                For 5 minutes fibre.service has been active on fibre-1, val-1.
                Fibre runs on one host at a time: stop the one that should be the standby.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrebothactive"
      - eval_time: 10m
        alertname: FibreDown
        exp_alerts: []

  # A disabled standby drops out of the units node_exporter lists: still no alert.
  - name: Standby stopped and disabled on val-1; no ServiceDown and no FibreDown
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.20.0.1:9910",host="val-1",role="validator"}
        values: '1x30'
      - series: >-
          up{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="celestia-appd.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []

  # After a failover val-1's Fibre runs (from 1m) but sends no metrics; fibre-1's unit is stopped.
  # Only the active host can raise FibreNotServing.
  - name: Fibre active on val-1 without metrics; no_telemetry for val-1 only
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0 1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service"}
        values: '0 60x40'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 31m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: val-1
              reason: no_telemetry
              severity: message
            exp_annotations:
              summary: "Fibre on val-1 sends no metrics"
              description: "The Fibre unit is active but no Fibre metrics have arrived for 30 minutes; set its OTLP endpoint."
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # val-1 is lost at 10m and tmkms is pointed at fibre-1's node. fibre-1's Fibre still signs through
  # val-1 (its signer_grpc_address), so from 11m every upload fails. Its unit stays active and its
  # port answers, so FibreDown stays quiet; uploads_failing goes out at 24m.
  - name: Fibre still signs through the lost validator node after a repoint; uploads_failing on fibre-1
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload while uploads kept failing, so it signs nothing.
                Check the signer first: Fibre signs through the node at its signer_grpc_address,
                so after tmkms is pointed at another node, point Fibre at that node too. Fibre's log names the error.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"
      - eval_time: 24m
        alertname: FibreDown
        exp_alerts: []

  # The health check (job fibre_health) asks both Fibre hosts. fibre-1's Fibre answers SERVING; the
  # stopped standby on val-1 does not answer (status code 14, every serving_status 0): no alert.
  - name: fibre-1 ready and val-1 a stopped standby; no not_ready
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x60'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x60'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '1x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre"}
        values: '0x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre",serving_status="SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre"}
        values: '14x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: FibreNotServing
        exp_alerts: []

  # Failover: fibre-1's Fibre answers NOT_SERVING while it shuts down (4m) and no longer answers
  # from 5m. val-1's standby starts at 7m and answers NOT_SERVING from then on (one of its checks
  # fails): the message names val-1 at 10m; fibre-1, stopped, raises nothing.
  - name: Standby started on val-1 stays NOT_SERVING; not_ready names val-1 only
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x4 0x16'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x6 1x14'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x4 stale'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.20.0.1:9911",host="val-1",role="fibre"}
        values: '_x7 1000000000000x13'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '1x3 0x17'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x3 1 0x16'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.20.0.2:7980",host="fibre-1",role="fibre"}
        values: '0x4 14x16'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre",serving_status="SERVING"}
        values: '0x20'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x6 1x14'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.20.0.1:7980",host="val-1",role="fibre"}
        values: '14x6 0x14'
    alert_rule_test:
      - eval_time: 9m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 10m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: val-1
              reason: not_ready
              severity: message
            exp_annotations:
              summary: "Fibre on val-1 is not ready for uploads"
              description: >-
                For 3 minutes Fibre's own health check has answered NOT_SERVING, so at least one of its six checks fails:
                app (the app node answers on the right chain, synced, with a recent block), fibre_module,
                signer (answers with the key Fibre started with), validator (in the active set),
                registration (a valid provider host on chain) or store (a small write and read).
                Uploads to it may fail. Fibre's log names the check and what to do:
                journalctl -u fibre.service | grep 'health check failed'.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"
