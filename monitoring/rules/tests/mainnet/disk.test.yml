# DiskLow on the example-mainnet inventory: data mounts val-1 / and fibre-1 / (the backup node's
# data) and mon-1 / (Prometheus's data); Fibre stores val-1 / (the standby's store shares the node
# disk) and fibre-1 /var/lib/fibre. Data mounts page on val-1 and fibre-1, as both run
# celestia-appd; mon-1's disk and the Fibre store send messages.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Backup node data disk under 5%; a page at once, and a message after 10m
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_size_bytes{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}
        values: '2000000000000x15'
      # 4% free.
      - series: >-
          node_filesystem_avail_bytes{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}
        values: '80000000000x15'
      - series: >-
          node_filesystem_readonly{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.2:9910
              host: fibre-1
              role: fibre
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
              severity: page
            exp_annotations:
              summary: "/ on fibre-1 is read-only or almost full"
              description: "The filesystem is read-only or has less than 5% free space."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"
      - eval_time: 10m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.2:9910
              host: fibre-1
              role: fibre
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
              severity: page
            exp_annotations:
              summary: "/ on fibre-1 is read-only or almost full"
              description: "The filesystem is read-only or has less than 5% free space."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"
          - exp_labels:
              job: node
              instance: 10.20.0.2:9910
              host: fibre-1
              role: fibre
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
              severity: message
            exp_annotations:
              summary: "/ on fibre-1 has little free space"
              description: "Free space has been below 10% for 10 minutes."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"

  # val-1's disk also holds the standby Fibre's store: it gets the node data rules only.
  - name: Validator node disk turns read-only; one page at once
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_size_bytes{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",device="/dev/md0",fstype="ext4",mountpoint="/"}
        values: '2000000000000x10'
      - series: >-
          node_filesystem_avail_bytes{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",device="/dev/md0",fstype="ext4",mountpoint="/"}
        values: '1000000000000x10'
      - series: >-
          node_filesystem_readonly{job="node",instance="10.20.0.1:9910",host="val-1",role="validator",device="/dev/md0",fstype="ext4",mountpoint="/"}
        values: '0x4 1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskLow
        exp_alerts: []
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.1:9910
              host: val-1
              role: validator
              device: /dev/md0
              fstype: ext4
              mountpoint: /
              severity: page
            exp_annotations:
              summary: "/ on val-1 is read-only or almost full"
              description: "The filesystem is read-only or has less than 5% free space."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"

  - name: Fibre store on fibre-1 turns read-only; a message, never a page
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_size_bytes{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme1n1",fstype="ext4",mountpoint="/var/lib/fibre"}
        values: '2000000000000x10'
      - series: >-
          node_filesystem_avail_bytes{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme1n1",fstype="ext4",mountpoint="/var/lib/fibre"}
        values: '1000000000000x10'
      - series: >-
          node_filesystem_readonly{job="node",instance="10.20.0.2:9910",host="fibre-1",role="fibre",device="/dev/nvme1n1",fstype="ext4",mountpoint="/var/lib/fibre"}
        values: '0x4 1x5'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x10'
      - series: >-
          fibre_server_upload_shard_occupancy_bytes{job="otelcol",instance="10.20.0.2:9911",host="fibre-1",role="fibre"}
        values: '500000000000x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskLow
        exp_alerts: []
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.2:9910
              host: fibre-1
              role: fibre
              device: /dev/nvme1n1
              fstype: ext4
              mountpoint: /var/lib/fibre
              severity: message
            exp_annotations:
              summary: "Fibre store /var/lib/fibre on fibre-1 is read-only"
              description: "Fibre cannot store new shards on a read-only filesystem."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"

  # mon-1 runs no Celestia service: the disk of Prometheus's data sends messages, never a page.
  - name: The monitor's disk on mon-1 under 5%; a message after 10m and no page
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_size_bytes{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '100000000000x15'
      # 4% free.
      - series: >-
          node_filesystem_avail_bytes{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '4000000000x15'
      - series: >-
          node_filesystem_readonly{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: DiskLow
        exp_alerts: []
      - eval_time: 10m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.3:9910
              host: mon-1
              role: monitor
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
              severity: message
            exp_annotations:
              summary: "/ on mon-1 has little free space"
              description: "Free space has been below 10% for 10 minutes."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"

  - name: The monitor's disk on mon-1 turns read-only; a message at once
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_size_bytes{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '100000000000x10'
      - series: >-
          node_filesystem_avail_bytes{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '50000000000x10'
      - series: >-
          node_filesystem_readonly{job="node",instance="10.20.0.3:9910",host="mon-1",role="monitor",device="/dev/sda1",fstype="ext4",mountpoint="/"}
        values: '0x4 1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskLow
        exp_alerts: []
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.20.0.3:9910
              host: mon-1
              role: monitor
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
              severity: message
            exp_annotations:
              summary: "/ on mon-1 is read-only"
              description: "The filesystem is read-only."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#disklow"
