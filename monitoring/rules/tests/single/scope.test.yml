# What the example-single switches leave out: with a local key there is no RemoteSignerProblem or
# ValidatorSigningTwice, with Fibre off there is no FibreDown or FibreNotServing. Watchdog fires
# without Alertmanager metrics.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Local key renders no RemoteSignerProblem, even if signer metrics showed up
    interval: 1m
    input_series:
      - series: >-
          cometbft_privval_signing_latency_median_seconds{chain_id="celestia",job="celestia-app",instance="10.10.0.11:26660",host="node-1",role="validator"}
        values: '0.05x40'
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.11:26660",host="node-1",role="validator",message_type="proposal",reason="remote_error"}
        values: '1+1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: RemoteSignerProblem
        exp_alerts: []

  - name: Local key renders no ValidatorSigningTwice, even if two nodes reported remote signatures
    interval: 1m
    input_series:
      - series: >-
          cometbft_privval_signing_latency_seconds_count{chain_id="celestia",job="celestia-app",instance="10.10.0.11:26660",host="node-1",role="validator",message_type="prevote"}
        values: '0+40x40'
      - series: >-
          cometbft_privval_signing_latency_seconds_count{chain_id="celestia",job="celestia-app",instance="10.10.0.12:26660",host="node-2",role="validator",message_type="prevote"}
        values: '0+40x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ValidatorSigningTwice
        exp_alerts: []

  - name: Fibre off renders no FibreNotServing, even with an active Fibre unit, no metrics and a NOT_SERVING answer
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.11:9910",host="node-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '1x200'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.11:9910",host="node-1",role="validator",name="fibre.service"}
        values: '60x200'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.11:7980",host="node-1",role="fibre",serving_status="NOT_SERVING"}
        values: '1x200'
    alert_rule_test:
      - eval_time: 200m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre off renders no FibreDown, even with an inactive Fibre unit
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.10.0.11:9910",host="node-1",role="validator"}
        values: '1x30'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.11:9910",host="node-1",role="validator",name="fibre.service",state="active",type="simple"}
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreDown
        exp_alerts: []

  - name: Watchdog fires before any Alertmanager metrics arrive
    interval: 1m
    input_series:
      - series: >-
          up{job="celestia-app",instance="10.10.0.11:26660",host="node-1",role="validator"}
        values: '1x10'
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "celestia-mon heartbeat"
              description: >-
                Fires while monitoring runs and no page or message notification failed in the last hour.
                Only the dead-man service receives it, and it alerts when the heartbeats stop.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#watchdog"
      - eval_time: 10m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "celestia-mon heartbeat"
              description: >-
                Fires while monitoring runs and no page or message notification failed in the last hour.
                Only the dead-man service receives it, and it alerts when the heartbeats stop.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#watchdog"
