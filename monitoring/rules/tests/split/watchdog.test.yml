# Watchdog fires from the first evaluation on, whatever the other series say.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Watchdog is always firing
    interval: 1m
    input_series:
      - series: >-
          up{job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator"}
        values: '1x60'
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "celestia-mon heartbeat"
              description: "Always firing. Only the dead-man service receives it, and it alerts when the heartbeats stop."
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#watchdog"
      - eval_time: 60m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "celestia-mon heartbeat"
              description: "Always firing. Only the dead-man service receives it, and it alerts when the heartbeats stop."
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#watchdog"
