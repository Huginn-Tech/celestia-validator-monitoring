# RemoteSignerProblem on the example-split inventory (remote signer, validator val-1). The slow rule
# counts only a node that got signatures from the signer in the last 5 minutes (the count series).
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  - name: Median signing latency above 10 ms for 15 minutes
    interval: 1m
    input_series:
      - series: >-
          cometbft_privval_signing_latency_median_seconds{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator"}
        values: '0.004x10 0.012x30'
      - series: >-
          cometbft_privval_signing_latency_seconds_count{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="prevote"}
        values: '0+40x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: RemoteSignerProblem
        exp_alerts: []
      - eval_time: 26m
        alertname: RemoteSignerProblem
        exp_alerts:
          - exp_labels:
              chain_id: celestia
              job: celestia-app
              instance: 10.10.0.1:26660
              host: val-1
              role: validator
              severity: message
            exp_annotations:
              summary: "Remote signer on val-1 is slower than 10 ms"
              description: "The median of the last 50 signatures has been above 10 ms for 15 minutes."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#remotesignerproblem"

  - name: Median signing latency at exactly 10 ms stays quiet
    interval: 1m
    input_series:
      - series: >-
          cometbft_privval_signing_latency_median_seconds{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator"}
        values: '0.01x40'
      - series: >-
          cometbft_privval_signing_latency_seconds_count{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="prevote"}
        values: '0+40x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: RemoteSignerProblem
        exp_alerts: []

  # A failure series appears at 1 on its first failure, which increase() does not
  # count. Prometheus has no reading of the node 6 hours before (no up series here,
  # as on a new install), so the second failed proposal fires. Timeouts and lost
  # connections are retried and counted per attempt, so they are left out, and so
  # are vote failures.
  - name: KMS cannot sign proposals, node not read 6 hours before; fires on the second failed proposal
    interval: 1m
    input_series:
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="proposal",reason="remote_error"}
        values: '_x10 1x30 2x10'
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="proposal",reason="timeout"}
        values: '_x5 1 25 50x40'
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="prevote",reason="remote_error"}
        values: '_x5 1+1x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: RemoteSignerProblem
        exp_alerts: []
      - eval_time: 41m
        alertname: RemoteSignerProblem
        exp_alerts:
          - exp_labels:
              chain_id: celestia
              job: celestia-app
              instance: 10.10.0.1:26660
              host: val-1
              role: validator
              message_type: proposal
              reason: remote_error
              severity: message
            exp_annotations:
              summary: "Remote signer on val-1 fails to sign proposals"
              description: "Proposal signing failed with reason remote_error in the last 6 hours; votes may still succeed."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#remotesignerproblem"

  # Prometheus reads the node all along. A refusal at the start, then the node restarts at 11m and
  # the series goes with it; the first refusal after the restart, at 391m, creates it again at 1. At
  # 6 hours before (31m) the node had no such series while Prometheus read it, so that refusal fires
  # at once. A counter the node already had 6 hours before (unexpected_response, flat) does not.
  - name: Node read 6 hours before; the first refused proposal after a node restart fires
    interval: 1m
    input_series:
      - series: >-
          up{job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator"}
        values: '1x431'
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="proposal",reason="remote_error"}
        values: '1x10 _x380 1x40'
      - series: >-
          cometbft_privval_signing_failures_total{chain_id="celestia",job="celestia-app",instance="10.10.0.1:26660",host="val-1",role="validator",message_type="proposal",reason="unexpected_response"}
        values: '1x431'
    alert_rule_test:
      - eval_time: 390m
        alertname: RemoteSignerProblem
        exp_alerts: []
      - eval_time: 391m
        alertname: RemoteSignerProblem
        exp_alerts:
          - exp_labels:
              chain_id: celestia
              job: celestia-app
              instance: 10.10.0.1:26660
              host: val-1
              role: validator
              message_type: proposal
              reason: remote_error
              severity: message
            exp_annotations:
              summary: "Remote signer on val-1 fails to sign proposals"
              description: "Proposal signing failed with reason remote_error in the last 6 hours; votes may still succeed."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#remotesignerproblem"
