# FibreNotServing on the example-split inventory (Fibre on fibre-1). Fibre starts at
# 1m (start time 60 s) and gets its first upload at 2m. The last-success gauge holds
# the Unix time of the last successful upload; at 30 uploads a minute the 7-day
# average puts the stale threshold at its 1 h floor.
rule_files:
  - taut.rules.yml
evaluation_interval: 1m

tests:
  - name: Uploads stop; stale after the 1 h floor plus 10 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x140'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x140'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 3600x80'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 1770x80'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x140'
      - series: >-
          fibre_server_upload_shard_occupancy_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 400000000000x140'
    alert_rule_test:
      - eval_time: 60m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 130m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 131m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: stale
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 has no recent successful upload"
              description: "No upload has succeeded for longer than 10 uploads take at the 7-day average rate, and for over 60 minutes."
              runbook: "https://github.com/s0urledd/taut/blob/main/docs/alerts.md#fibrenotserving"

  - name: Fibre restarts and gets no upload since; time counts from the new start
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x179'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x98 6000x81'
      # The last-success gauge lives in Fibre's memory: gone after the restart at 100m.
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_x2 120+60x97 stale'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x97 stale'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x179'
    alert_rule_test:
      - eval_time: 160m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 170m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 171m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: stale
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 has no recent successful upload"
              description: "No upload has succeeded for longer than 10 uploads take at the 7-day average rate, and for over 60 minutes."
              runbook: "https://github.com/s0urledd/taut/blob/main/docs/alerts.md#fibrenotserving"

  - name: Fibre restarts and uploads resume; no alert
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x179'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x98 6000x81'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_x2 120+60x97 stale _x4 6300+60x75'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x97 stale _x4 30+30x75'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x179'
    alert_rule_test:
      - eval_time: 180m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre unit stopped; start time 0 and no last success keep FibreNotServing quiet
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x59 0x100'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x59 0x100'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 stale'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 stale'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x59 stale'
    alert_rule_test:
      - eval_time: 160m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 160m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              job: node
              instance: 10.10.0.3:9100
              host: fibre-1
              role: fibre
              name: fibre.service
              state: active
              type: simple
              severity: message
              unit: fibre
            exp_annotations:
              summary: "fibre.service is not active on fibre-1"
              description: "systemd has not reported the unit as active for 2 minutes."
              runbook: "https://github.com/s0urledd/taut/blob/main/docs/alerts.md#servicedown"

  - name: Idle network; Fibre runs for hours without any upload and stays quiet
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x200'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x200'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x200'
      - series: >-
          fibre_server_upload_shard_occupancy_bytes{job="otelcol",instance="10.10.0.3:8889",host="fibre-1",role="fibre"}
        values: '_ 0x200'
    alert_rule_test:
      - eval_time: 200m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre active but its metrics never arrive; no_telemetry after 30 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9100",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 31m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: no_telemetry
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 sends no metrics"
              description: "The Fibre unit is active but no Fibre metrics have arrived for 30 minutes; set its OTLP endpoint."
              runbook: "https://github.com/s0urledd/taut/blob/main/docs/alerts.md#fibrenotserving"
