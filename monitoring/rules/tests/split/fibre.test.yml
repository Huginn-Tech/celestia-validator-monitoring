# FibreNotServing on the example-split inventory (Fibre on fibre-1). This inventory has no outside
# check, so missed_uploads and not_served are not rendered: from the hosts alone, a network that
# sends no blobs and a Fibre that receives none look alike. Fibre starts at 1m (start time 60 s)
# and gets its first upload at 2m. The last-success gauge holds the Unix time of the last accepted
# upload.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  # Without the outside check a quiet network and a Fibre that receives nothing look alike: no alert.
  - name: Uploads stop for hours without the outside check; no FibreNotServing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x300'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x300'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 3600x240'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 1770x240'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x300'
    alert_rule_test:
      - eval_time: 300m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre restarts and uploads resume; no alert
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x179'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x98 6000x81'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x97 stale _x4 6300+60x75'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x97 stale _x4 30+30x75'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x179'
    alert_rule_test:
      - eval_time: 180m
        alertname: FibreNotServing
        exp_alerts: []

  # FibreDown, not FibreNotServing, reports the stopped unit (and holds FibreNotServing back).
  - name: Fibre unit stopped; start time 0 and no last success keep FibreNotServing quiet
    interval: 1m
    input_series:
      - series: >-
          up{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre"}
        values: '1x160'
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x59 0x100'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x59 0x100'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 stale'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 stale'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x59 stale'
    alert_rule_test:
      - eval_time: 160m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 160m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Fibre is not running on any host"
              description: >-
                For 10 minutes no Fibre host (fibre-1) has kept fibre.service active for a whole minute: Fibre is stopped or
                crash looping everywhere, the host of the active Fibre is down, or celestia_mon_units.fibre names the wrong unit.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown"

  - name: Idle network; Fibre runs for hours without any upload and stays quiet
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x200'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x200'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x200'
      - series: >-
          fibre_server_upload_shard_occupancy_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 0x200'
    alert_rule_test:
      - eval_time: 200m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre active but its metrics never arrive; no_telemetry after 30 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 31m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: no_telemetry
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 sends no metrics"
              description: "The Fibre unit is active but no Fibre metrics have arrived for 30 minutes; set its OTLP endpoint."
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # From 11m every signature fails (the signer behind signer_grpc_address gives the key but does
  # not sign) and no upload is accepted. The last accepted uploads leave the 5-minute window at 14m;
  # 10 minutes later, at 24m, the message goes out.
  - name: Every signature fails and no upload is accepted; uploads_failing after 10 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_sign_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload, so it signs nothing: every signature it tried failed,
                its storage budget was full, or it could not store them. Failed signatures: Fibre's log says failed to sign payment promise;
                the signer behind its signer_grpc_address gives the validator's key but does not sign,
                so check tmkms's log and that it signs raw bytes. A full budget: the dashboard's Storage budget used and Failed clean-ups.
                Failed stores: Fibre's log says failed to store upload data; check the store's inodes, and the owner and permissions of its directories.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # From 11m the storage budget is full: Fibre refuses every upload that passes its checks before
  # it signs (the refused ones also end as failed uploads) and accepts none. The message goes out at
  # 24m, as for failed signatures.
  - name: The storage budget is full and no upload is accepted; uploads_failing after 10 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_rejected_total{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",reason="budget_exceeded"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload, so it signs nothing: every signature it tried failed,
                its storage budget was full, or it could not store them. Failed signatures: Fibre's log says failed to sign payment promise;
                the signer behind its signer_grpc_address gives the validator's key but does not sign,
                so check tmkms's log and that it signs raw bytes. A full budget: the dashboard's Storage budget used and Failed clean-ups.
                Failed stores: Fibre's log says failed to store upload data; check the store's inodes, and the owner and permissions of its directories.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # From 11m the store fails (its inodes ran out, or its directories lost their owner after a
  # restore): every upload fails at the store, after the budget and before any signature, so no
  # failed signature and no refusal is counted. Only fibre.server.store.put.duration{success=false}
  # moves, and its series stands beside the sum in the rule. The message goes out at 24m, as above.
  - name: The store fails and no upload is accepted; uploads_failing after 10 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_store_put_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload, so it signs nothing: every signature it tried failed,
                its storage budget was full, or it could not store them. Failed signatures: Fibre's log says failed to sign payment promise;
                the signer behind its signer_grpc_address gives the validator's key but does not sign,
                so check tmkms's log and that it signs raw bytes. A full budget: the dashboard's Storage budget used and Failed clean-ups.
                Failed stores: Fibre's log says failed to store upload data; check the store's inodes, and the owner and permissions of its directories.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # A failed sign series that stands still sits beside the rising failed stores: after increase()
  # the two have the same labels, so an or inside the sum would drop the stores and stay silent.
  - name: Failed stores beside an old failed signature; uploads_failing still fires
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_sign_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '1x40'
      - series: >-
          fibre_server_store_put_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload, so it signs nothing: every signature it tried failed,
                its storage budget was full, or it could not store them. Failed signatures: Fibre's log says failed to sign payment promise;
                the signer behind its signer_grpc_address gives the validator's key but does not sign,
                so check tmkms's log and that it signs raw bytes. A full budget: the dashboard's Storage budget used and Failed clean-ups.
                Failed stores: Fibre's log says failed to store upload data; check the store's inodes, and the owner and permissions of its directories.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # Stores fail for some uploads, others are accepted: the failed stores are one client that gave
  # up, or a passing fault, and Fibre takes uploads.
  - name: Some stores fail while others are accepted; no uploads_failing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x40'
      - series: >-
          fibre_server_store_put_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []

  # From 11m a client whose escrow is too low sends its blob again every few seconds and no other
  # client sends one: every upload fails at its payment promise, before any signature, so nothing
  # fires. On a quiet network such a client can be all of Fibre's traffic.
  - name: Only a client's refused uploads arrive; no uploads_failing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 40m
        alertname: FibreNotServing
        exp_alerts: []

  # Some clients send uploads that fail their checks, while the others are accepted: no message.
  - name: Some uploads fail while others are accepted; no uploads_failing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x39'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x40'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '1+1x40'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FibreNotServing
        exp_alerts: []

  # Fibre's own health check, read by the blackbox exporter's grpc prober (job fibre_health): each
  # answer sets one serving_status series to 1 and the others to 0, with the gRPC status code. From
  # 5m Fibre answers NOT_SERVING (one of its six checks fails): the message goes out at 8m, the page
  # at 15m, and the message stays out next to it.
  - name: Fibre answers NOT_SERVING; not_ready message after 3 minutes and page after 10
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x30'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '1x4 0x26'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x4 1x26'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="UNKNOWN"}
        values: '0x30'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="SERVICE_UNKNOWN"}
        values: '0x30'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre"}
        values: '0x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 8m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_ready
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 is not ready for uploads"
              description: >-
                For 3 minutes Fibre's own health check has answered NOT_SERVING, so at least one of its six checks fails:
                app (the app node answers on the right chain, synced, with a recent block), fibre_module,
                signer (answers with the key Fibre started with), validator (in the active set),
                registration (a valid provider host on chain) or store (a small write and read).
                Uploads to it may fail. Fibre's log names the check and what to do:
                journalctl -u fibre.service | grep 'health check failed'.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"
      - eval_time: 14m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_ready
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 is not ready for uploads"
              description: >-
                For 3 minutes Fibre's own health check has answered NOT_SERVING, so at least one of its six checks fails:
                app (the app node answers on the right chain, synced, with a recent block), fibre_module,
                signer (answers with the key Fibre started with), validator (in the active set),
                registration (a valid provider host on chain) or store (a small write and read).
                Uploads to it may fail. Fibre's log names the check and what to do:
                journalctl -u fibre.service | grep 'health check failed'.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"
      - eval_time: 15m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: not_ready
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 is not ready for uploads"
              description: >-
                For 3 minutes Fibre's own health check has answered NOT_SERVING, so at least one of its six checks fails:
                app (the app node answers on the right chain, synced, with a recent block), fibre_module,
                signer (answers with the key Fibre started with), validator (in the active set),
                registration (a valid provider host on chain) or store (a small write and read).
                Uploads to it may fail. Fibre's log names the check and what to do:
                journalctl -u fibre.service | grep 'health check failed'.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"
          - exp_labels:
              host: fibre-1
              reason: not_ready
              severity: page
            exp_annotations:
              summary: "Fibre on fibre-1 is not ready for uploads"
              description: >-
                For 10 minutes Fibre's own health check has answered NOT_SERVING, so at least one of its six checks fails:
                app (the app node answers on the right chain, synced, with a recent block), fibre_module,
                signer (answers with the key Fibre started with), validator (in the active set),
                registration (a valid provider host on chain) or store (a small write and read).
                Uploads to it may fail. Fibre's log names the check and what to do:
                journalctl -u fibre.service | grep 'health check failed'.
              runbook: "https://github.com/Huginn-Tech/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  - name: Fibre answers SERVING; no not_ready
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x60'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '1x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: FibreNotServing
        exp_alerts: []

  # A Fibre older than v10.5.0 has no health service: the probe gets Unimplemented (status code 12)
  # and every serving_status series stays 0. The dashboard says Not reported; no alert.
  - name: Fibre without the health check answers Unimplemented; no not_ready
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x60'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x60'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre"}
        values: '12x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: FibreNotServing
        exp_alerts: []

  # A restart: Fibre answers NOT_SERVING while it shuts down (10m), does not answer for a minute
  # (status code 14, every serving_status 0), then answers NOT_SERVING from its start until its
  # checks have passed (12m to 14m) and SERVING from 15m. Each stretch is under 3 minutes: no alert.
  - name: Fibre restarts; NOT_SERVING for under 3 minutes raises no not_ready
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x30'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x30'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="SERVING"}
        values: '1x9 0x4 1x16'
      - series: >-
          probe_grpc_healthcheck_response{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre",serving_status="NOT_SERVING"}
        values: '0x9 1 0 1 1 1 0x15'
      - series: >-
          probe_grpc_status_code{job="fibre_health",instance="10.10.0.3:7980",host="fibre-1",role="fibre"}
        values: '0x10 14 0x19'
    alert_rule_test:
      - eval_time: 15m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []
