# FibreNotServing on the example-split inventory (Fibre on fibre-1). This inventory has no outside
# check, so missed_uploads and not_served are not rendered: from the hosts alone, a network that
# sends no blobs and a Fibre that receives none look alike. Fibre starts at 1m (start time 60 s)
# and gets its first upload at 2m. The last-success gauge holds the Unix time of the last accepted
# upload.
rule_files:
  - celestia-mon.rules.yml
evaluation_interval: 1m

tests:
  # Without the outside check a quiet network and a Fibre that receives nothing look alike: no alert.
  - name: Uploads stop for hours without the outside check; no FibreNotServing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x300'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x300'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 3600x240'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 1770x240'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x300'
    alert_rule_test:
      - eval_time: 300m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre restarts and uploads resume; no alert
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x179'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x98 6000x81'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x97 stale _x4 6300+60x75'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x97 stale _x4 30+30x75'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x179'
    alert_rule_test:
      - eval_time: 180m
        alertname: FibreNotServing
        exp_alerts: []

  # FibreDown, not FibreNotServing, reports the stopped unit (and holds FibreNotServing back).
  - name: Fibre unit stopped; start time 0 and no last success keep FibreNotServing quiet
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x59 0x100'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x59 0x100'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_x2 120+60x58 stale'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '_x2 30+30x58 stale'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x59 stale'
    alert_rule_test:
      - eval_time: 160m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 160m
        alertname: FibreDown
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Fibre is not running on any host"
              description: >-
                For 10 minutes no Fibre host (fibre-1) has reported fibre.service as active: Fibre is stopped everywhere,
                the host of the active Fibre is down, or celestia_mon_units.fibre names the wrong unit.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibredown"

  - name: Idle network; Fibre runs for hours without any upload and stays quiet
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x200'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x200'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 1000000000000x200'
      - series: >-
          fibre_server_upload_shard_occupancy_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 0x200'
    alert_rule_test:
      - eval_time: 200m
        alertname: FibreNotServing
        exp_alerts: []

  - name: Fibre active but its metrics never arrive; no_telemetry after 30 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '0 1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '0 60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 31m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: no_telemetry
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 sends no metrics"
              description: "The Fibre unit is active but no Fibre metrics have arrived for 30 minutes; set its OTLP endpoint."
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # From 11m every upload fails (the signer behind signer_grpc_address cannot be reached) and none
  # is accepted. The last accepted uploads leave the 5-minute window at 14m; 10 minutes later, at
  # 24m, the message goes out.
  - name: Every upload fails and none is accepted; uploads_failing after 10 minutes
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x9 600x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x10 330x30'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '_x11 30+30x29'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 23m
        alertname: FibreNotServing
        exp_alerts: []
      - eval_time: 24m
        alertname: FibreNotServing
        exp_alerts:
          - exp_labels:
              host: fibre-1
              reason: uploads_failing
              severity: message
            exp_annotations:
              summary: "Fibre on fibre-1 fails every upload"
              description: >-
                For 15 minutes Fibre has accepted no upload while uploads kept failing, so it signs nothing.
                Check the signer first: Fibre signs through the node at its signer_grpc_address,
                so after tmkms is pointed at another node, point Fibre at that node too. Fibre's log names the error.
              runbook: "https://github.com/s0urledd/celestia-validator-monitoring/blob/main/docs/alerts.md#fibrenotserving"

  # Some clients send uploads that fail their checks, while the others are accepted: no message.
  - name: Some uploads fail while others are accepted; no uploads_failing
    interval: 1m
    input_series:
      - series: >-
          node_systemd_unit_state{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service",state="active",type="simple"}
        values: '1x40'
      - series: >-
          node_systemd_unit_start_time_seconds{job="node",instance="10.10.0.3:9910",host="fibre-1",role="fibre",name="fibre.service"}
        values: '60x40'
      - series: >-
          fibre_server_upload_shard_last_success_timestamp_seconds{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '_ 60+60x39'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="true"}
        values: '30+30x40'
      - series: >-
          fibre_server_upload_shard_duration_seconds_count{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre",success="false"}
        values: '1+1x40'
      - series: >-
          fibre_server_upload_shard_budget_bytes{job="otelcol",instance="10.10.0.3:9911",host="fibre-1",role="fibre"}
        values: '1000000000000x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FibreNotServing
        exp_alerts: []
