name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: ansible/ansible.cfg
  ANSIBLE_ROLES_PATH: ansible/roles

# Jobs that need Ansible install the ansible-core pinned in versions.yml, the one install.sh
# uses on the hosts. tools/ci/pins.py writes that pin and the release versions and amd64
# sha256 values of versions.yml to $GITHUB_ENV (ANSIBLE_CORE_VERSION, PROMETHEUS_VERSION,
# PROMETHEUS_SHA256, ...).
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      - name: Install linters
        run: pip install "ansible-core==$ANSIBLE_CORE_VERSION" "ansible-lint>=25,<26" "yamllint>=1.35,<2"
      - name: yamllint
        run: yamllint --strict .
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck install.sh tools/*.sh
      # The docs run it as ./install.sh, and git archive keeps the mode git records.
      - name: install.sh is executable
        run: |
          mode=$(git ls-files --stage install.sh | cut -d ' ' -f 1)
          if [ "$mode" != 100755 ]; then
            echo "install.sh has mode $mode in git; set it with: git update-index --chmod=+x install.sh"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Owner-only files are ignored and absent
        run: |
          git check-ignore -q --no-index reference/any-file || { echo "reference/ is not in .gitignore"; exit 1; }
          git check-ignore -q --no-index CLAUDE.local.md || { echo "CLAUDE.local.md is not in .gitignore"; exit 1; }
          if [ -n "$(git ls-files reference CLAUDE.local.md)" ]; then
            echo "owner-only files are tracked"; exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collectors:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      - name: Install Ansible
        run: pip install "ansible-core==$ANSIBLE_CORE_VERSION"
      - name: Write a one-host inventory and playbook
        run: |
          CI_DIR="$RUNNER_TEMP/collectors"
          echo "CI_DIR=$CI_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_DIR"
          cat > "$CI_DIR/hosts.yml" <<'EOF'
          all:
            hosts:
              ci:
                ansible_connection: local
                ansible_python_interpreter: /usr/bin/python3
                celestia_mon_private_ip: 127.0.0.1
            children:
              validator:
                hosts:
                  ci:
              fibre:
                hosts:
                  ci:
              monitor:
                hosts:
                  ci:
            vars:
              celestia_mon_signer: local
              celestia_mon_fibre_enabled: true
              celestia_mon_units:
                appd: systemd-journald
                fibre: systemd-logind
                tmkms: tmkms
          EOF
          cat > "$CI_DIR/site.yml" <<'EOF'
          - name: Collectors
            hosts: all
            become: true
            tasks:
              - name: Load the shared settings
                ansible.builtin.include_role:
                  name: celestia_mon
                  public: true
              - name: Install node_exporter
                ansible.builtin.include_role:
                  name: celestia_mon_node_exporter
              - name: Install the OpenTelemetry collector
                ansible.builtin.include_role:
                  name: celestia_mon_otelcol
          - name: Bind check
            hosts: all
            become: true
            gather_facts: false
            tasks:
              - name: Run the bind check
                ansible.builtin.include_role:
                  name: celestia_mon
                  tasks_from: bind_check
          EOF
      - name: Dry run on a fresh host
        run: ansible-playbook -i "$CI_DIR/hosts.yml" -e @versions.yml --check --diff "$CI_DIR/site.yml"
      - name: Install
        run: ansible-playbook -i "$CI_DIR/hosts.yml" -e @versions.yml "$CI_DIR/site.yml"
      - name: Second run changes nothing
        run: |
          ansible-playbook -i "$CI_DIR/hosts.yml" -e @versions.yml "$CI_DIR/site.yml" | tee "$CI_DIR/second.log"
          grep -Eq '^ci +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0' "$CI_DIR/second.log"
      - name: node_exporter lists only the configured units
        run: |
          sudo systemctl is-active celestia-mon-node-exporter
          node=$(curl -sf http://127.0.0.1:9910/metrics)
          grep -q '^node_systemd_unit_state{name="systemd-journald.service",state="active"' <<<"$node"
          grep -q '^node_systemd_unit_start_time_seconds{name="systemd-logind.service"}' <<<"$node"
          grep -q '^node_systemd_service_restart_total{name="systemd-logind.service"}' <<<"$node"
          units=$(grep '^node_systemd_unit_state{' <<<"$node" | grep -o 'name="[^"]*"' | sort -u | wc -l)
          if [ "$units" -ne 2 ]; then echo "systemd collector lists $units units, expected 2"; exit 1; fi
          # The unit's sandbox (seccomp filter, address families, no devices) must not break a
          # collector that the panels and rules read. Others (zfs, nfs, bonding) fail on any host
          # without that kernel feature.
          for c in cpu diskstats filesystem meminfo netclass netdev systemd vmstat; do
            grep -qx "node_scrape_collector_success{collector=\"$c\"} 1" <<<"$node" ||
              { echo "node_exporter's $c collector fails under the unit sandbox"; exit 1; }
          done
      - name: The collector sums Fibre's size attributes away and drops traces
        run: |
          sudo systemctl is-active celestia-mon-otelcol
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:9911/metrics && break; sleep 1; done
          now=$(date +%s%N)
          start=$((now - 1000000000))
          cat > "$CI_DIR/otlp.json" <<EOF
          {"resourceMetrics": [{
            "resource": {"attributes": [{"key": "service.name", "value": {"stringValue": "fibre"}}]},
            "scopeMetrics": [{"scope": {"name": "ci"}, "metrics": [{
              "name": "fibre.server.upload_shard.duration", "unit": "s",
              "histogram": {"aggregationTemporality": 2, "dataPoints": [
                {"attributes": [{"key": "success", "value": {"boolValue": true}}, {"key": "upload_size", "value": {"intValue": "1024"}}],
                 "startTimeUnixNano": "$start", "timeUnixNano": "$now", "count": "1", "sum": 0.5, "bucketCounts": ["1", "0"], "explicitBounds": [1]},
                {"attributes": [{"key": "success", "value": {"boolValue": true}}, {"key": "upload_size", "value": {"intValue": "2048"}}],
                 "startTimeUnixNano": "$start", "timeUnixNano": "$now", "count": "1", "sum": 0.5, "bucketCounts": ["1", "0"], "explicitBounds": [1]}
              ]}}]}]}]}
          EOF
          curl -sf -H 'Content-Type: application/json' --data @"$CI_DIR/otlp.json" http://127.0.0.1:9915/v1/metrics
          curl -sf -H 'Content-Type: application/json' --data '{"resourceSpans":[]}' http://127.0.0.1:9915/v1/traces
          sleep 1
          otel=$(curl -sf http://127.0.0.1:9911/metrics)
          printf '%s\n' "$otel"
          grep -Eq '^fibre_server_upload_shard_duration_seconds_count\{[^}]*success="true"[^}]*\} 2$' <<<"$otel"
          if grep -q upload_size <<<"$otel"; then echo "upload_size was not summed away"; exit 1; fi
          if sudo ss -Htln | grep -Eq ':8888[[:space:]]'; then echo "the collector opened its own telemetry port"; exit 1; fi
      # Each collector unit runs under the default caps (celestia_mon_nice, celestia_mon_cpu_weight,
      # celestia_mon_io_weight, celestia_mon_memory), and its peak memory stays below MemoryHigh, so
      # a new otelcol-contrib release that needs more memory shows up here. The units restart with a
      # cold page cache first, as after a reboot: pages of each binary that Ansible's copy and
      # `validate` loaded stay charged to the runner's cgroup, so only a cold start counts them
      # against the unit's own cgroup (cgroup v2; memory.peak exists from kernel 5.19).
      - name: The collector units run under the resource caps
        run: |
          sudo systemctl stop celestia-mon-otelcol celestia-mon-node-exporter
          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          sudo systemctl start celestia-mon-node-exporter celestia-mon-otelcol
          # Any HTTP answer means the port is open. The collector opens its OTLP receiver
          # last, after its Prometheus exporter.
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:9910/ && curl -s -o /dev/null http://127.0.0.1:9915/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9910/metrics
          curl -sf -H 'Content-Type: application/json' --data @"$CI_DIR/otlp.json" http://127.0.0.1:9915/v1/metrics
          curl -sf -o /dev/null http://127.0.0.1:9911/metrics
          check() {
            local unit=$1 high=$2 max=$3 peak
            for p in Nice CPUWeight IOWeight MemoryHigh MemoryMax; do
              printf '%s %s=%s\n' "$unit" "$p" "$(systemctl show -P "$p" "$unit")"
            done
            test "$(systemctl show -P Nice "$unit")" = 10
            test "$(systemctl show -P CPUWeight "$unit")" = 20
            test "$(systemctl show -P IOWeight "$unit")" = 20
            test "$(systemctl show -P MemoryHigh "$unit")" = "$high"
            test "$(systemctl show -P MemoryMax "$unit")" = "$max"
            peak=$(cat "/sys/fs/cgroup/system.slice/$unit.service/memory.peak")
            printf '%s peak memory %d MiB (MemoryHigh %d MiB)\n' "$unit" $((peak / 1048576)) $((high / 1048576))
            if [ "$peak" -ge "$high" ]; then echo "$unit reached its MemoryHigh"; exit 1; fi
          }
          check celestia-mon-node-exporter $((128 * 1048576)) $((256 * 1048576))
          check celestia-mon-otelcol $((384 * 1048576)) $((1024 * 1048576))
      - name: doctor finds celestia-mon's units on private addresses
        run: |
          out=$(sudo bash tools/doctor.sh --config /dev/null --roles kms --data-mounts / --head-wait 2 || true)
          printf '%s\n' "$out"
          grep -Eq '^OK +8 +private binds +.*celestia-mon-node-exporter 127\.0\.0\.1:9910' <<<"$out"
          grep -Eq '^OK +8 .*celestia-mon-otelcol 127\.0\.0\.1:9915' <<<"$out"
      - name: The playbook stops when another process holds a celestia-mon port
        run: |
          python3 -m http.server 9920 --bind 127.0.0.1 >/dev/null 2>&1 &
          server=$!
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:9920/ && break; sleep 1; done
          cat > "$CI_DIR/taken.json" <<'EOF'
          {"celestia_mon_ports": {"node_exporter": 9920, "otelcol_prometheus": 9911, "prometheus": 9912,
                          "alertmanager": 9913, "grafana": 9914, "otelcol_otlp": 9915}}
          EOF
          if ansible-playbook -i "$CI_DIR/hosts.yml" -e @versions.yml -e @"$CI_DIR/taken.json" "$CI_DIR/site.yml" >"$CI_DIR/taken.log"; then
            cat "$CI_DIR/taken.log"
            echo "the playbook ran although another process listens on node_exporter's port"
            exit 1
          fi
          kill "$server"
          cat "$CI_DIR/taken.log"
          grep -Eq 'port 9920 is used by python[0-9.]* \([0-9]+\); set celestia_mon_ports\.node_exporter to a free port' "$CI_DIR/taken.log"
      - name: Show the collector logs
        if: failure()
        run: sudo journalctl -u celestia-mon-node-exporter -u celestia-mon-otelcol --no-pager -n 200

  # Renders the rules, Alertmanager, Prometheus and dashboard settings for the three example
  # inventories (single, split, and mainnet with a backup node and a standby Fibre) and checks
  # them with promtool and amtool from the pinned releases, whose tarballs are checked against
  # the sha256 in versions.yml (no checksum file is fetched).
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      - name: Install Ansible
        run: pip install "ansible-core==$ANSIBLE_CORE_VERSION"
      # The mainnet example also reads one announcement channel, has the outside check of its
      # Fibre endpoint and reads upgrade signalling, so its rules and scrape jobs include
      # AnnouncementsUnreadable, FibreDown's outside branches, TensileUnreadable, the upgrade alerts
      # and the announcements, tensile and signal jobs.
      - name: Render the example inventories
        run: |
          for s in single split mainnet; do
            extra=()
            if [ "$s" = mainnet ]; then
              extra=(-e '{"celestia_mon_announcements": [{"channel_id": "111111111111111111", "severity": "page"}],
                          "celestia_mon_tensile": {"api": "https://tensile.example.org/api/v1", "validator": "celestiavalcons1ci"},
                          "celestia_mon_signal": {"chain_id": "celestia", "rpc": ["http://127.0.0.1:26657"], "validator": "celestiavaloper1ci"}}')
            fi
            ansible-playbook -i "ansible/inventory/example-$s" tools/ci/render.yml -e "celestia_mon_ci_scenario=$s" "${extra[@]}"
          done
      # The dashboard's descriptions print the hold times in monitoring/rules/holds.json
      # (gen_dashboard.py reads them); each must be the for: of every rule it names.
      - name: The hold times the dashboard prints match the rules
        run: |
          python - monitoring/rules/holds.json monitoring/rules/tests/{single,split,mainnet}/celestia-mon.rules.yml <<'EOF'
          import json
          import re
          import sys

          import yaml


          def seconds(text):
              return sum(int(n) * {"h": 3600, "m": 60, "s": 1}[u] for n, u in re.findall(r"(\d+)([hms])", text))


          holds = json.load(open(sys.argv[1]))["holds"]
          rules = [r for path in sys.argv[2:] for g in yaml.safe_load(open(path))["groups"] for r in g["rules"] if "alert" in r]
          failed = False
          for name, h in sorted(holds.items()):
              found = [r for r in rules if r["alert"] == h["alert"] and h.get("expr", "") in r["expr"]
                       and all(re.fullmatch(v, str(r.get("labels", {}).get(k, ""))) for k, v in h.get("labels", {}).items())]
              wrong = sorted({str(r.get("for", "0s")) for r in found if seconds(str(r.get("for", "0s"))) != seconds(h["for"])})
              if not found:
                  failed = True
                  print("%s: the dashboard prints %s, but no rule matches" % (name, h["for"]))
              elif wrong:
                  failed = True
                  print("%s: the dashboard prints %s, but the rules hold for %s" % (name, h["for"], ", ".join(wrong)))
              else:
                  print("%s: %s in %d rules" % (name, h["for"], len(found)))
          sys.exit(1 if failed else 0)
          EOF
      - name: Install promtool and amtool at the pinned versions
        run: |
          set -euo pipefail
          prom="prometheus-$PROMETHEUS_VERSION.linux-amd64"
          am="alertmanager-$ALERTMANAGER_VERSION.linux-amd64"
          mkdir -p "$RUNNER_TEMP/celestia-mon-bin"
          cd "$RUNNER_TEMP"
          base="https://github.com/prometheus"
          curl -fsSLO "$base/prometheus/releases/download/v$PROMETHEUS_VERSION/$prom.tar.gz"
          echo "$PROMETHEUS_SHA256  $prom.tar.gz" | sha256sum -c -
          curl -fsSLO "$base/alertmanager/releases/download/v$ALERTMANAGER_VERSION/$am.tar.gz"
          echo "$ALERTMANAGER_SHA256  $am.tar.gz" | sha256sum -c -
          tar -xzf "$prom.tar.gz" -C celestia-mon-bin --strip-components=1 "$prom/promtool"
          tar -xzf "$am.tar.gz" -C celestia-mon-bin --strip-components=1 "$am/amtool"
          echo "$RUNNER_TEMP/celestia-mon-bin" >> "$GITHUB_PATH"
      - name: promtool check rules
        # Several rules share an alert name and severity on purpose (one per branch,
        # host or mount), which the duplicate-rules lint would report.
        run: |
          for s in single split mainnet; do
            promtool check rules --lint=none "monitoring/rules/tests/$s/celestia-mon.rules.yml"
          done
      - name: promtool test rules
        run: |
          for s in single split mainnet; do
            promtool test rules monitoring/rules/tests/"$s"/*.test.yml
          done
      - name: promtool check config
        run: |
          for s in single split mainnet; do
            promtool check config --lint=none "build/$s/prometheus.yml"
          done
      - name: amtool check-config
        run: |
          for s in single split mainnet; do
            amtool check-config "build/$s/alertmanager.yml"
          done
      # Telegram (parse mode HTML) and Discord get celestia-mon's text: an announcement as its own
      # text under the channel it came from, an alert as one line with its summary and description;
      # never the list of labels, never the link.
      - name: Telegram and Discord messages read as text
        run: |
          set -euo pipefail
          t=monitoring/alertmanager-templates.tmpl
          render() { amtool template render --template.glob="$t" --template.data="$1" --template.type="$2" --template.text="$3"; }
          cat >"$RUNNER_TEMP/announcement.json" <<'EOF'
          {"receiver": "announcement-page", "status": "firing", "alerts": [{"status": "firing",
            "labels": {"alertname": "CelestiaAnnouncement", "severity": "page", "host": "mon-1",
                       "source": "Celestia #mainnet-announcements", "announcement": "1"},
            "annotations": {"summary": "Celestia announcement from Celestia #mainnet-announcements",
                            "description": "Mainnet upgrades at height 100 <b>&", "link": "https://discord.com/channels/1/2/3"}}],
           "groupLabels": {}, "commonLabels": {}, "commonAnnotations": {}, "externalURL": ""}
          EOF
          out=$(render "$RUNNER_TEMP/announcement.json" html '{{ template "celestia.telegram.message" . }}')
          printf '%s\n---\n' "$out"
          test "$out" = "$(printf '📣 <b>Celestia #mainnet-announcements</b>\n\nMainnet upgrades at height 100 &lt;b&gt;&amp;')"
          test "$(render "$RUNNER_TEMP/announcement.json" text '{{ template "celestia.discord.title" . }}')" = "📣 Celestia #mainnet-announcements"
          test "$(render "$RUNNER_TEMP/announcement.json" text '{{ template "celestia.discord.message" . }}')" = "Mainnet upgrades at height 100 <b>&"
          cat >"$RUNNER_TEMP/alerts.json" <<'EOF'
          {"receiver": "page", "status": "firing", "alerts": [
            {"status": "firing", "labels": {"alertname": "DiskLow", "severity": "page", "host": "val-1", "mountpoint": "/"},
             "annotations": {"summary": "Disk / on val-1 is almost full", "description": "Less than 5% free."}},
            {"status": "resolved", "labels": {"alertname": "DiskLow", "severity": "page", "host": "val-1", "mountpoint": "/data"},
             "annotations": {"summary": "Disk /data on val-1 is almost full"}}],
           "groupLabels": {}, "commonLabels": {}, "commonAnnotations": {}, "externalURL": ""}
          EOF
          out=$(render "$RUNNER_TEMP/alerts.json" html '{{ template "celestia.telegram.message" . }}')
          printf '%s\n---\n' "$out"
          want='🔴 PAGE · <b>DiskLow</b> · val-1\nDisk / on val-1 is almost full\nLess than 5%% free.\n\n'
          want+='✅ RESOLVED · <b>DiskLow</b> · val-1\nDisk /data on val-1 is almost full'
          test "$out" = "$(printf "$want")"
          test "$(render "$RUNNER_TEMP/alerts.json" text '{{ template "celestia.discord.title" . }}')" = "🔴 PAGE · DiskLow · val-1"
          out=$(render "$RUNNER_TEMP/alerts.json" text '{{ template "celestia.discord.message" . }}')
          printf '%s\n' "$out"
          grep -qx '\*\*Disk / on val-1 is almost full\*\*' <<<"$out"
          grep -qx '✅ RESOLVED · DiskLow · val-1' <<<"$out"
          # An alert that names no host, as the upgrade alerts: nothing after its name.
          cat >"$RUNNER_TEMP/upgrade.json" <<'EOF'
          {"receiver": "message", "status": "resolved", "alerts": [{"status": "resolved",
            "labels": {"alertname": "UpgradeScheduled", "severity": "message"},
            "annotations": {"summary": "Network upgrade to v11 scheduled",
                            "description": "This alert resolves when the chain has switched to v11."}}],
           "groupLabels": {}, "commonLabels": {}, "commonAnnotations": {}, "externalURL": ""}
          EOF
          out=$(render "$RUNNER_TEMP/upgrade.json" html '{{ template "celestia.telegram.message" . }}')
          printf '%s\n---\n' "$out"
          want='✅ RESOLVED · <b>UpgradeScheduled</b>\nNetwork upgrade to v11 scheduled\nThis alert resolves when the chain has switched to v11.'
          test "$out" = "$(printf "$want")"
          test "$(render "$RUNNER_TEMP/upgrade.json" text '{{ template "celestia.discord.title" . }}')" = "✅ RESOLVED · UpgradeScheduled"
      # The mainnet example scrapes its backup node in the celestia-app job and every Fibre host,
      # active or standby, in the otelcol job.
      - name: The mainnet scrape targets follow the inventory groups
        run: |
          set -euo pipefail
          python - build/mainnet/prometheus.yml <<'EOF'
          import sys
          import yaml
          jobs = {j["job_name"]: j for j in yaml.safe_load(open(sys.argv[1]))["scrape_configs"]}
          def hosts(job):
              return sorted((c["labels"]["host"], c["labels"]["role"]) for c in jobs[job]["static_configs"])
          assert hosts("celestia-app") == [("fibre-1", "backup_node"), ("val-1", "validator")], hosts("celestia-app")
          assert hosts("node") == [("fibre-1", "fibre"), ("val-1", "validator")], hosts("node")
          assert hosts("otelcol") == [("fibre-1", "fibre"), ("val-1", "fibre")], hosts("otelcol")
          assert hosts("announcements") == [("fibre-1", "monitor")], hosts("announcements")
          assert hosts("tensile") == [("fibre-1", "monitor")], hosts("tensile")
          assert hosts("signal") == [("fibre-1", "monitor")], hosts("signal")
          assert [c["targets"] for c in jobs["signal"]["static_configs"]] == [["127.0.0.1:9918"]], jobs["signal"]
          print({j: hosts(j) for j in ("celestia-app", "node", "otelcol", "announcements", "signal")})
          EOF
      # celestia_mon_receivers is one list; routing follows the type. This renders the split
      # example again with every receiver type (it overwrites build/split, so it runs last), checks
      # it with amtool, checks the routing (page -> PagerDuty and every other receiver, message ->
      # every receiver but PagerDuty, DeadmanFailing and SignaturesMissed -> message, Watchdog ->
      # deadman, UpgradeScheduled and UpgradeSoon -> message on a route of their own that sends each
      # once, UpgradeSignalMissing -> page), and checks that the receiver check refuses a
      # PagerDuty-only list and the old page/message lists.
      - name: amtool accepts every receiver type, and routing follows the type
        run: |
          set -euo pipefail
          render() {
            ansible-playbook -i ansible/inventory/example-split tools/ci/render.yml -e celestia_mon_ci_scenario=split -e @"$1"
          }
          cat > "$RUNNER_TEMP/receivers.yml" <<'EOF'
          celestia_mon_receivers:
            - {type: pagerduty, routing_key: ci-only}
            - {type: telegram, bot_token: "000000000:ci-only", chat_id: -1000000000000}
            - {type: discord, webhook_url: "https://discord.example.invalid/api/webhooks/0/ci-only"}
            - {type: slack, api_url: "https://slack.example.invalid/one"}
            - {type: slack, api_url: "https://slack.example.invalid/two", channel: "#validator"}
            - {type: webhook, url: "https://webhook.example.invalid/hook"}
          EOF
          render "$RUNNER_TEMP/receivers.yml"
          am=build/split/alertmanager.yml
          amtool check-config "$am"
          amtool config routes test --config.file="$am" --verify.receivers=page alertname=FibreDown severity=page
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=ServiceDown severity=message unit=appd host=val-1
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=NotificationsFailing severity=message host=mon-1
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=DeadmanFailing severity=message host=mon-1
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=SignaturesMissed severity=message
          amtool config routes test --config.file="$am" --verify.receivers=deadman alertname=Watchdog severity=heartbeat
          amtool config routes test --config.file="$am" --verify.receivers=announcement-page \
            alertname=CelestiaAnnouncement severity=page host=mon-1 source=ci announcement=1
          amtool config routes test --config.file="$am" --verify.receivers=announcement-message \
            alertname=CelestiaAnnouncement severity=message host=mon-1 source=ci announcement=1
          amtool config routes test --config.file="$am" --verify.receivers=page alertname=UpgradeSignalMissing severity=page
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=UpgradeScheduled severity=message
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=UpgradeSoon severity=message
          amtool config routes test --config.file="$am" --verify.receivers=message alertname=SignalUnreadable severity=message host=mon-1
          python - "$am" <<'EOF'
          import sys
          import yaml
          config = yaml.safe_load(open(sys.argv[1]))
          # UpgradeScheduled and UpgradeSoon: their own route, each alert sent once, before the message route.
          routes = config["route"]["routes"]
          upgrade = [i for i, r in enumerate(routes) if r.get("matchers") == ['alertname=~"UpgradeScheduled|UpgradeSoon"']]
          assert len(upgrade) == 1, routes
          r = routes[upgrade[0]]
          assert (r["receiver"], r["group_by"], r["group_wait"], r["repeat_interval"]) == ("message", ["..."], "0s", "96h"), r
          assert "routes" not in r and not r.get("continue", False), r
          assert upgrade[0] < [i for i, r in enumerate(routes) if r.get("receiver") == "message" and i != upgrade[0]][0], routes
          receivers = {r["name"]: r for r in config["receivers"]}
          def count(name):
              return {k: len(v) for k, v in receivers[name].items() if k.endswith("_configs")}
          chat = {"telegram_configs": 1, "discord_configs": 1, "slack_configs": 2, "webhook_configs": 1}
          assert count("page") == {"pagerduty_configs": 1, **chat}, count("page")
          assert count("message") == chat, count("message")
          # Announcements go to the same receivers, without a "resolved" message.
          assert count("announcement-page") == count("page"), count("announcement-page")
          assert count("announcement-message") == chat, count("announcement-message")
          def resolved(name):
              return {c["send_resolved"] for k, v in receivers[name].items() if k.endswith("_configs") for c in v}
          assert resolved("page") == resolved("message") == {True}, (resolved("page"), resolved("message"))
          assert resolved("announcement-message") == {False}, resolved("announcement-message")
          # PagerDuty closes its incident when the announcement ends; the chats get no "resolved".
          ann = receivers["announcement-page"]
          assert {c["send_resolved"] for c in ann["pagerduty_configs"]} == {True}, ann
          assert {c["send_resolved"] for k, v in ann.items() if k.endswith("_configs") and k != "pagerduty_configs" for c in v} == {False}
          print("page:", count("page"), "message:", count("message"))
          EOF
          cat > "$RUNNER_TEMP/pagerduty-only.yml" <<'EOF'
          celestia_mon_receivers:
            - {type: pagerduty, routing_key: ci-only}
          EOF
          if render "$RUNNER_TEMP/pagerduty-only.yml"; then
            echo "a PagerDuty-only receiver list was accepted: message alerts would go nowhere"
            exit 1
          fi
          cat > "$RUNNER_TEMP/old-shape.yml" <<'EOF'
          celestia_mon_receivers:
            page:
              - {type: pagerduty, routing_key: ci-only}
            message:
              - {type: webhook, url: "https://webhook.example.invalid/hook"}
          EOF
          if render "$RUNNER_TEMP/old-shape.yml"; then
            echo "the old page/message receiver lists were accepted"
            exit 1
          fi

  # celestia-mon-announcements against tools/ci/discord_stub.py, which stands in for Discord and
  # for Alertmanager's alerts API: the first read only notes the newest message, the next posts
  # the two new announcements as one request with clean text and links to the originals, a third
  # posts nothing; a channel the bot may not read and a wrong token are reported, not fatal; and
  # the metrics Prometheus scrapes are served.
  announcements:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: celestia-mon-announcements reads, posts once and reports errors
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ann"
          mkdir -p "$d/cred"
          token=ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          printf '%s' "$token" >"$d/cred/discord-token"
          printf 'ci-api-login' >"$d/cred/api-password"
          STUB_TOKEN=$token python3 tools/ci/discord_stub.py 8765 "$d/posts.jsonl" &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/health
          cat >"$d/config.json" <<EOF
          {"host": "mon-1", "alertmanager_url": "http://127.0.0.1:8765", "api_user": "celestia-mon",
           "listen": "127.0.0.1:9916", "discord_api": "http://127.0.0.1:8765/api/v10", "interval_seconds": 1,
           "active_minutes": 30, "state_file": "$d/state.json",
           "channels": [{"id": "111111111111111111", "severity": "page"}, {"id": "222222222222222222", "severity": "message"}]}
          EOF
          once() { CREDENTIALS_DIRECTORY="$d/cred" python3 -I tools/celestia-mon-announcements --config "$d/config.json" --once 2>>"$d/log"; }
          once
          cat "$d/log"
          test ! -e "$d/posts.jsonl"
          grep -q '^channel 111111111111111111: reading from now on' "$d/log"
          grep -q '^channel 222222222222222222: Discord answered 403 Missing Access' "$d/log"
          once
          once
          test "$(wc -l <"$d/posts.jsonl")" = 1
          # ...103 is an alert a webhook posted into the channel, not an announcement.
          grep -q '^channel 111111111111111111: passed over 1 message(s) not posted by a followed channel' "$d/log"
          python3 - "$d/posts.jsonl" <<'EOF'
          import json, re, sys
          alerts = json.loads(open(sys.argv[1]).readline())
          assert [a["labels"]["announcement"] for a in alerts] == ["1300000000000000101", "1300000000000000102"], alerts
          first, second = alerts
          assert first["labels"] == {"alertname": "CelestiaAnnouncement", "severity": "page", "host": "mon-1",
                                     "source": "Celestia #mocha-announcements", "announcement": "1300000000000000101"}, first
          text = first["annotations"]["description"]
          assert re.fullmatch(r"Mocha upgrades to v10\.5\.0 at \d{4}-\d\d-\d\d \d\d:\d\d UTC\. "
                              r"Details: https://docs\.celestia\.org/upgrade\?network=mocha&v=10\.5\.0", text), text
          link = "https://discord.com/channels/638338779505229824/333333333333333333/5101"
          assert first["annotations"]["link"] == first["generatorURL"] == link, first
          assert second["labels"]["source"] == "Celestia #mainnet-announcements", second
          assert second["annotations"]["description"] == "Mainnet notice\n\nRead #channel before the upgrade", second
          print("posted:", json.dumps(alerts, indent=1))
          EOF
          CREDENTIALS_DIRECTORY="$d/cred" python3 -I tools/celestia-mon-announcements --config "$d/config.json" 2>>"$d/log" &
          pid=$!
          for _ in $(seq 30); do
            m=$(curl -fsS http://127.0.0.1:9916/metrics || true)
            if grep -q '^celestia_mon_announcements_errors_total{channel="222222222222222222",reason="forbidden"}' <<<"$m"; then break; fi
            sleep 1
          done
          kill "$pid"
          printf '%s\n' "$m"
          grep -Eq '^celestia_mon_announcements_last_success_timestamp_seconds\{channel="111111111111111111"\} [1-9]' <<<"$m"
          grep -Eq '^celestia_mon_announcements_last_success_timestamp_seconds\{channel="222222222222222222"\} 0' <<<"$m"
          printf 'not-the-token' >"$d/cred/discord-token"
          once
          grep -q 'Discord refused the bot token (401)' "$d/log"
          if grep -qF "$token" "$d/log"; then echo "the log holds the token"; exit 1; fi

  # celestia-mon-tensile against a stand-in of Tensile's API (python's http.server on static
  # files): a reachable endpoint with its blob record, a validator with no Fibre host registered,
  # an unknown validator (404), an unreachable API, and a Tensile without signing.last_assigned_at,
  # whose time the running service derives from its own reads.
  tensile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: celestia-mon-tensile serves Tensile's verdict as metrics
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tensile"
          v="$d/api/api/v1/validators"
          mkdir -p "$v/celestiavalcons1ok" "$v/celestiavalcons1none" "$v/celestiavalcons1old"
          cat >"$v/celestiavalcons1ok/status" <<'EOF'
          {"host": "203.0.113.7:7980", "jailed": false, "bond_status": "BOND_STATUS_BONDED", "endpoint_state": "reachable",
           "reachable": true, "identity_status": "verified", "last_reachable_at": "2026-10-18T06:25:11.680342473Z",
           "last_endpoint_check": {"at": "2026-10-18T06:25:11.680342473Z", "outcome": "REACHABLE"},
           "obligations": {"served": 215, "broken": 0, "rate": {"num": 215, "den": 215, "value": 1}},
           "signing": {"assigned": 216, "signed": 215, "last_endorsed_at": "2026-10-18T06:20:27.865311985Z",
                       "last_assigned_at": "2026-10-18T06:24:27.865311985Z"}}
          EOF
          cat >"$v/celestiavalcons1none/status" <<'EOF'
          {"host": "", "jailed": false, "reachable": null, "identity_status": "", "last_endpoint_check": null}
          EOF
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$d/api" >/dev/null 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null \
            http://127.0.0.1:8766/api/v1/validators/celestiavalcons1ok/status
          run() {
            printf '{"api": "%s", "validator": "%s", "listen": "127.0.0.1:9917", "interval_seconds": 60}' "$1" "$2" >"$d/config.json"
            python3 -I tools/celestia-mon-tensile --config "$d/config.json" --once 2>"$d/err"
          }
          m=$(run http://127.0.0.1:8766/api/v1 celestiavalcons1ok)
          printf '%s\n' "$m"
          grep -qx 'celestia_mon_fibre_registered{endpoint="203.0.113.7:7980"} 1' <<<"$m"
          grep -qx 'celestia_mon_fibre_reachable{endpoint="203.0.113.7:7980"} 1' <<<"$m"
          grep -qx 'celestia_mon_fibre_identity_verified{endpoint="203.0.113.7:7980"} 1' <<<"$m"
          grep -Eq '^celestia_mon_fibre_last_check_timestamp_seconds\{endpoint="203\.0\.113\.7:7980"\} 1792304711\.68' <<<"$m"
          grep -qx 'celestia_mon_fibre_last_check_info{endpoint="203.0.113.7:7980",outcome="REACHABLE"} 1' <<<"$m"
          grep -Eq '^celestia_mon_tensile_last_success_timestamp_seconds [1-9]' <<<"$m"
          grep -Eq '^celestia_mon_fibre_last_assigned_timestamp_seconds 1792304667\.86' <<<"$m"
          grep -Eq '^celestia_mon_fibre_last_endorsed_timestamp_seconds 1792304427\.86' <<<"$m"
          grep -qx 'celestia_mon_fibre_blobs_assigned_24h 216' <<<"$m"
          grep -qx 'celestia_mon_fibre_blobs_endorsed_24h 215' <<<"$m"
          grep -qx 'celestia_mon_fibre_obligations_24h{outcome="served"} 215' <<<"$m"
          grep -qx 'celestia_mon_fibre_obligations_24h{outcome="broken"} 0' <<<"$m"
          if grep -q 'jailed\|bonded' <<<"$m"; then echo "Tensile is used for the outside check and the blob record only"; exit 1; fi
          m=$(run http://127.0.0.1:8766/api/v1 celestiavalcons1none)
          grep -qx 'celestia_mon_fibre_registered{endpoint=""} 0' <<<"$m"
          if grep -q '^celestia_mon_fibre_reachable' <<<"$m"; then echo "reachability without a registered host"; exit 1; fi
          if grep -Eq '^celestia_mon_fibre_(last_assigned|last_endorsed|blobs|obligations)' <<<"$m"; then
            echo "a blob record without Tensile's signing object"; exit 1
          fi
          m=$(run http://127.0.0.1:8766/api/v1 celestiavalcons1unknown)
          grep -qx 'celestia_mon_tensile_last_success_timestamp_seconds 0.0' <<<"$m"
          grep -qx 'celestia_mon_tensile_errors_total{reason="not_found"} 1' <<<"$m"
          grep -q 'check celestia_mon_tensile.validator' "$d/err"
          m=$(run http://127.0.0.1:9/api/v1 celestiavalcons1ok)
          grep -qx 'celestia_mon_tensile_errors_total{reason="network"} 1' <<<"$m"
          # Without last_assigned_at, the time of the newest assigned blob is the read at which the
          # number of assigned blobs rose, only while Tensile's newest block (/tip) is under 2 minutes
          # older than its clock at that read and the one before. The service reads every second here.
          tip() {
            printf '{"height": 100, "block_time": "%s", "server_time": "2026-10-18T06:25:20Z"}' "$1" >"$d/api/api/v1/tip"
          }
          old() {
            printf '{"host": "203.0.113.7:7980", "reachable": true, "identity_status": "verified", "signing": {"assigned": %s, "signed": 0}}' \
              "$1" >"$v/celestiavalcons1old/status"
          }
          tip 2026-10-18T06:25:15Z
          old 216
          printf '{"api": "http://127.0.0.1:8766/api/v1", "validator": "celestiavalcons1old", "listen": "127.0.0.1:9917", "interval_seconds": 1}' \
            >"$d/config.json"
          python3 -I tools/celestia-mon-tensile --config "$d/config.json" 2>"$d/err" &
          svc=$!
          scrape() { curl -fsS http://127.0.0.1:9917/metrics 2>/dev/null || true; }
          wait_for() {
            for _ in $(seq 30); do grep -Eq "$1" <<<"$(scrape)" && return 0; sleep 1; done
            scrape; echo "no line matching $1"; return 1
          }
          wait_for '^celestia_mon_fibre_blobs_assigned_24h 216$'
          sleep 3
          if grep -q '^celestia_mon_fibre_last_assigned' <<<"$(scrape)"; then echo "a blob time without a rise"; exit 1; fi
          # Tensile catches up after its own outage (its newest block 10 minutes old): the blobs it
          # finds meanwhile are not new, and the first read in step again only notes the number.
          tip 2026-10-18T06:15:20Z
          sleep 3
          old 230
          wait_for '^celestia_mon_fibre_blobs_assigned_24h 230$'
          tip 2026-10-18T06:25:15Z
          sleep 3
          if grep -q '^celestia_mon_fibre_last_assigned' <<<"$(scrape)"; then echo "a Tensile catch-up taken for new blobs"; exit 1; fi
          # A rise between two reads in step sets the time.
          old 231
          wait_for '^celestia_mon_fibre_last_assigned_timestamp_seconds [1-9]'
          kill "$svc"

  # celestia-mon-signal against tools/ci/rpc_stub.py, which stands in for a node's CometBFT RPC with
  # mainnet's x/signal answers of 19 October 2026 (app v9; v10 signalled by 396393243 of 463776854
  # and scheduled at height 15116658) and a synthetic operator address: an upgrade pending that the
  # validator signalled, an open round it has not signalled, a version nobody signalled, an RPC of
  # another network, one that is behind and an unreachable one before the right one, a store that
  # lacks the height read, a pruned node and one that refuses the block time, a key in the RPC URL
  # that must not show, URLs and addresses that do not decode, and the service keeping its last
  # reading while reads fail.
  signal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: celestia-mon-signal serves x/signal as metrics
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/signal"
          mkdir -p "$d"
          op=1111111111111111111111111111111111111111
          addr=$(python3 tools/ci/rpc_stub.py address "$op")
          echo "operator address: $addr"
          # file, network, GetUpgrade answer, VersionTally answer for v10, the validator's version (null:
          # none), lowest block[, more fields]. Written aside and moved, so the stand-in never reads half a file.
          state() {
            cat >"$1.new" <<EOF
          {"network": "$2", "version": "9.0.4", "app_version": 9, "height": 15000000, "lowest": $6,
           "tally": {"10": "$4"}, "upgrade": "$3", "signals": {"$op": $5}${7:+, $7}}
          EOF
            mv "$1.new" "$1"
          }
          state "$d/rpc.json" celestia CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 1
          state "$d/other.json" mocha-5 "" EMj0pLgBGNbYkt0B null 1
          python3 tools/ci/rpc_stub.py 8767 "$d/rpc.json" &
          python3 tools/ci/rpc_stub.py 8768 "$d/other.json" &
          for p in 8767 8768; do curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null "http://127.0.0.1:$p/health"; done
          run() { # validator, RPC URLs...
            local v=$1
            shift
            printf '{"chain_id": "celestia", "rpc": %s, "validator": "%s", "listen": "127.0.0.1:9918", "interval_seconds": 60}' \
              "$(printf '%s\n' "$@" | jq -R . | jq -sc .)" "$v" >"$d/config.json"
            python3 -I tools/celestia-mon-signal --config "$d/config.json" --once 2>"$d/err"
          }

          # The upgrade to v10 is pending and the validator signalled it. The RPC URL carries a key.
          # The stand-in answers queries at its last height only, so the reading is of one height.
          m=$(run "$addr" http://127.0.0.1:8767/ci-secret-key)
          printf '%s\n' "$m"
          for want in 'celestia_mon_app_version 9' 'celestia_mon_node_version_info{version="9.0.4"} 1' \
                      'celestia_mon_chain_height 15000000' 'celestia_mon_signal_next_version 10' \
                      'celestia_mon_signal_tally_power 396393243' 'celestia_mon_signal_threshold_power 386480712' \
                      'celestia_mon_signal_total_power 463776854' 'celestia_mon_signal_validator_version 10' \
                      'celestia_mon_upgrade_pending 1' 'celestia_mon_upgrade_version 10' 'celestia_mon_upgrade_height 15116658' \
                      'celestia_mon_chain_block_time_seconds 2.87' 'celestia_mon_upgrade_eta_seconds 334808' \
                      'celestia_mon_signal_rpc_info{rpc="http://127.0.0.1:8767"} 1'; do
            grep -qxF "$want" <<<"$m" || { echo "missing: $want"; exit 1; }
          done
          grep -Eq '^celestia_mon_signal_last_success_timestamp_seconds [1-9]' <<<"$m"
          if grep -q ci-secret-key - "$d/err" <<<"$m"; then echo "the key in the RPC URL shows"; exit 1; fi

          # The round for v10 is open, nothing is scheduled, and the validator has not signalled.
          state "$d/rpc.json" celestia "" CJv2gb0BEMj0pLgBGNbYkt0B null 1
          m=$(run "$addr" http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_signal_tally_power 396393243' <<<"$m"
          grep -qxF 'celestia_mon_signal_validator_version 0' <<<"$m"
          grep -qxF 'celestia_mon_upgrade_pending 0' <<<"$m"
          if grep -q '^celestia_mon_upgrade_\(version\|height\|eta_seconds\)' <<<"$m"; then echo "upgrade details without an upgrade"; exit 1; fi

          # Nobody signalled v10: the answer has no voting_power field.
          state "$d/rpc.json" celestia "" EMj0pLgBGNbYkt0B null 1
          m=$(run "$addr" http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_signal_tally_power 0' <<<"$m"
          grep -qxF 'celestia_mon_signal_threshold_power 386480712' <<<"$m"

          # A Mocha RPC and an unreachable one come first: both are skipped, the third is read.
          m=$(run "$addr" http://127.0.0.1:8768 http://127.0.0.1:9 http://127.0.0.1:8767)
          cat "$d/err"
          grep -qxF 'celestia_mon_signal_errors_total{reason="wrong_network"} 1' <<<"$m"
          grep -qxF 'celestia_mon_signal_errors_total{reason="network"} 1' <<<"$m"
          grep -qxF 'celestia_mon_signal_rpc_info{rpc="http://127.0.0.1:8767"} 1' <<<"$m"
          grep -qF "http://127.0.0.1:8768 serves 'mocha-5', not 'celestia'" "$d/err"
          m=$(run "$addr" http://127.0.0.1:8768)
          grep -qx 'celestia_mon_signal_last_success_timestamp_seconds 0.0' <<<"$m"
          if grep -q '^celestia_mon_app_version' <<<"$m"; then echo "a reading from another network"; exit 1; fi

          # A node that is catching up, then one whose last block is 10 minutes old, comes first: it
          # serves an old state, so it is skipped as behind and the next RPC is read.
          state "$d/other.json" celestia "" CJv2gb0BEMj0pLgBGNbYkt0B null 1 '"catching_up": true'
          m=$(run "$addr" http://127.0.0.1:8768 http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_signal_errors_total{reason="behind"} 1' <<<"$m"
          grep -qxF 'celestia_mon_signal_rpc_info{rpc="http://127.0.0.1:8767"} 1' <<<"$m"
          grep -qF 'http://127.0.0.1:8768 is catching up' "$d/err"
          state "$d/other.json" celestia "" CJv2gb0BEMj0pLgBGNbYkt0B null 1 '"age": 600'
          m=$(run "$addr" http://127.0.0.1:8768 http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_signal_errors_total{reason="behind"} 1' <<<"$m"
          grep -qxF 'celestia_mon_signal_rpc_info{rpc="http://127.0.0.1:8767"} 1' <<<"$m"
          grep -qE "http://127\.0\.0\.1:8768's last block is [0-9]+ s old" "$d/err"
          # Behind a provider's URL, the calls of one read can reach different nodes: /abci_info from
          # one 100 blocks behind the one that answered /status serves an old state, so it is skipped.
          state "$d/other.json" celestia "" CJv2gb0BEMj0pLgBGNbYkt0B null 1 '"abci_behind": 100'
          m=$(run "$addr" http://127.0.0.1:8768 http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_signal_errors_total{reason="behind"} 1' <<<"$m"
          grep -qxF 'celestia_mon_signal_rpc_info{rpc="http://127.0.0.1:8767"} 1' <<<"$m"
          grep -qF 'http://127.0.0.1:8768 answered /abci_info at height 14999900, 15000000 in /status' "$d/err"
          # A signal store that does not hold the height /abci_info gave (on a node one block behind,
          # or one that pruned it) answers with code 0, no value and a log: a failed read, never a
          # validator that has not signalled.
          state "$d/other.json" celestia "" CJv2gb0BEMj0pLgBGNbYkt0B 10 1 '"no_version": true'
          m=$(run "$addr" http://127.0.0.1:8768)
          cat "$d/err"
          grep -qxF 'celestia_mon_signal_errors_total{reason="query"} 1' <<<"$m"
          grep -qx 'celestia_mon_signal_last_success_timestamp_seconds 0.0' <<<"$m"
          grep -qF 'version does not exist' "$d/err"
          if grep -q '^celestia_mon_signal_validator_version' <<<"$m"; then echo "a store without the height read as no signal"; exit 1; fi

          # A node that keeps only its last 500 blocks: the block time is measured over those.
          state "$d/rpc.json" celestia CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 14999500
          m=$(run "$addr" http://127.0.0.1:8767)
          grep -qxF 'celestia_mon_chain_block_time_seconds 2.87' <<<"$m"
          grep -qxF 'celestia_mon_upgrade_eta_seconds 334808' <<<"$m"
          # A node that refuses /blockchain: the reading stands, without a block time and so without an ETA.
          state "$d/rpc.json" celestia CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 1 '"refuse": ["blockchain"]'
          m=$(run "$addr" http://127.0.0.1:8767)
          grep -Eq '^celestia_mon_signal_last_success_timestamp_seconds [1-9]' <<<"$m"
          grep -qxF 'celestia_mon_upgrade_height 15116658' <<<"$m"
          grep -qxF 'celestia_mon_signal_errors_total{reason="block_time"} 1' <<<"$m"
          if grep -q '^celestia_mon_\(chain_block_time_seconds\|upgrade_eta_seconds\)' <<<"$m"; then echo "a block time from a node that refused it"; exit 1; fi

          # Only unreachable RPCs, one with a key in its URL: no reading, and the key does not show.
          m=$(run "$addr" http://127.0.0.1:9/ci-secret-key http://127.0.0.1:10)
          grep -qxF 'celestia_mon_signal_errors_total{reason="network"} 2' <<<"$m"
          grep -qx 'celestia_mon_signal_last_success_timestamp_seconds 0.0' <<<"$m"
          if grep -q ci-secret-key - "$d/err" <<<"$m"; then echo "the key in the RPC URL shows"; exit 1; fi

          # URLs the service refuses at start, without printing them: a login, a query string, no host.
          for u in http://ci:ci-secret-key@127.0.0.1:8767 'http://127.0.0.1:8767/?key=ci-secret-key' http://:26657; do
            if run "$addr" "$u" >/dev/null; then echo "rpc $u was accepted"; exit 1; fi
            grep -q 'rpc 1 of 1 is not an http or https URL' "$d/err"
            if grep -q ci-secret-key "$d/err"; then echo "a refused URL shows its key"; exit 1; fi
          done

          # Addresses that do not decode: the service and the install's check refuse them.
          last=${addr: -1}
          bad=${addr%?}$([ "$last" = q ] && echo p || echo q)
          if run "$bad" http://127.0.0.1:8767 >/dev/null; then echo "an address with a wrong checksum was accepted"; exit 1; fi
          grep -q 'wrong checksum' "$d/err"
          python3 -I tools/celestia-mon-signal --check-address "$addr"
          for a in "$bad" "${addr/celestiavaloper/celestiavalcons}" celestiavaloper1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq; do
            if python3 -I tools/celestia-mon-signal --check-address "$a" 2>>"$d/err"; then echo "--check-address accepted $a"; exit 1; fi
          done
          cat "$d/err"
          # A checksum that holds over 32 bytes: the length is checked too.
          long=$(python3 tools/ci/rpc_stub.py address "$(printf '22%.0s' $(seq 32))")
          if python3 -I tools/celestia-mon-signal --check-address "$long" 2>"$d/err"; then echo "a 32-byte address was accepted"; exit 1; fi
          grep -q 'holds 32 bytes' "$d/err"
          # The decoder against BIP 173's own vectors, so that a mistake the stand-in's encoder shares
          # cannot pass: valid and broken checksums, and a segwit address whose program BIP 173 gives.
          python3 -I - tools/celestia-mon-signal <<'EOF'
          import importlib.machinery
          import importlib.util
          import sys

          loader = importlib.machinery.SourceFileLoader("collector", sys.argv[1])
          collector = importlib.util.module_from_spec(importlib.util.spec_from_loader("collector", loader))
          loader.exec_module(collector)
          for s in ["A12UEL5L", "a12uel5l", "abcdef1qpzry9x8gf2tvdw0s3jn54khce6mua7lmqqqxw",
                    "split1checkupstagehandshakeupstreamerranterredcaperred2y9e3w", "?1ezyfcl",
                    "an83characterlonghumanreadablepartthatcontainsthenumber1andtheexcludedcharactersbio1tt5tgs"]:
              collector.bech32_decode(s)
          for s in ["A1G7SGD8", "a12UEL5L", "x1b4n0q5v", "li1dgmt3"]:
              try:
                  collector.bech32_decode(s)
              except ValueError:
                  continue
              sys.exit(f"{s} was accepted")
          prefix, values = collector.bech32_decode("BC1QW508D6QEJXTDG4Y5R3ZARVARY0C5XW7KV8F3T4")
          assert prefix == "bc" and values[0] == 0, (prefix, values)
          assert collector.from5(values[1:]) == bytes.fromhex("751e76e8199196d454941c45d1b3a323f1433bd6")
          EOF

          # As a service: while the block time cannot be measured, the one measured last stays; while
          # no RPC can be read, the whole last reading stays and only its time ages.
          state "$d/rpc.json" celestia CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 1
          printf '{"chain_id": "celestia", "rpc": ["http://127.0.0.1:8767"], "validator": "%s", "listen": "127.0.0.1:9918", "interval_seconds": 1}' \
            "$addr" >"$d/service.json"
          python3 -I tools/celestia-mon-signal --config "$d/service.json" 2>"$d/service.err" &
          service=$!
          metrics() { curl -fsS http://127.0.0.1:9918/metrics; }
          reading() { metrics | grep -Ev '^(#|celestia_mon_signal_(last_success_timestamp_seconds|errors_total))'; }
          wait_for() { # an extended regular expression that a whole metrics line must match
            for _ in $(seq 30); do
              if grep -Eqx "$1" <<<"$(metrics 2>/dev/null)"; then return 0; fi
              sleep 1
            done
            echo "no metrics line matches $1"; cat "$d/service.err"; exit 1
          }
          wait_for 'celestia_mon_upgrade_eta_seconds 334808'
          before=$(reading)
          # One thing changes at a time, so a read that began before the change gives the same reading.
          state "$d/rpc.json" celestia CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 1 '"refuse": ["blockchain"]'
          wait_for 'celestia_mon_signal_errors_total\{reason="block_time"\} ([2-9]|[1-9][0-9]+)'
          test "$(reading)" = "$before" || { echo "the block time measured last did not stay"; reading; exit 1; }
          state "$d/rpc.json" mocha-5 CgcIChDy0poH CJv2gb0BEMj0pLgBGNbYkt0B 10 1 '"refuse": ["blockchain"]'
          wait_for 'celestia_mon_signal_errors_total\{reason="wrong_network"\} [1-9][0-9]*'
          at=$(metrics | grep '^celestia_mon_signal_last_success_timestamp_seconds ')
          wait_for 'celestia_mon_signal_errors_total\{reason="wrong_network"\} ([3-9]|[1-9][0-9]+)'
          test "$(reading)" = "$before" || { echo "a failed read changed the reading"; reading; exit 1; }
          test "$(metrics | grep '^celestia_mon_signal_last_success_timestamp_seconds ')" = "$at" ||
            { echo "the last read time moved without a read"; exit 1; }
          kill "$service"

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      - name: Install Ansible
        run: pip install "ansible-core==$ANSIBLE_CORE_VERSION"
      # A throwaway Prometheus container that only parses the panel queries; it is not celestia-mon's.
      - name: Start a throwaway Prometheus at the version in versions.yml
        run: docker run -d --name prometheus -p 127.0.0.1:9090:9090 "prom/prometheus:v$PROMETHEUS_VERSION"
      # mainnet gets the same outside check, upgrade signalling and announcements as in the rules
      # job, and a validator name, so every optional panel and query is generated and checked.
      - name: Render the dashboard settings for the example inventories
        run: |
          for s in single split mainnet; do
            extra=()
            if [ "$s" = mainnet ]; then
              extra=(-e '{"celestia_mon_announcements": [{"channel_id": "111111111111111111", "severity": "page"}],
                          "celestia_mon_tensile": {"api": "https://tensile.example.org/api/v1", "validator": "celestiavalcons1ci"},
                          "celestia_mon_signal": {"chain_id": "celestia", "rpc": ["http://127.0.0.1:26657"], "validator": "celestiavaloper1ci"},
                          "celestia_mon_validator_name": "CI validator"}')
            fi
            ansible-playbook -i "ansible/inventory/example-$s/hosts.yml" tools/ci/render.yml -e "celestia_mon_ci_scenario=$s" "${extra[@]}"
          done
      - name: Generate the dashboards
        run: |
          for s in single split mainnet; do
            python monitoring/dashboards/gen_dashboard.py --config "build/$s/dashboard-config.json" --out "build/$s/dashboard.json"
            python monitoring/dashboards/gen_dashboard.py --config "build/$s/dashboard-config.json" --out "build/$s/dashboard.again.json"
            cmp "build/$s/dashboard.json" "build/$s/dashboard.again.json"
            python -m json.tool "build/$s/dashboard.json" > /dev/null
          done
          # mainnet without upgrade signalling has five answers, which the Servers tile makes six.
          mkdir -p build/five
          jq '.signal_enabled = false' build/mainnet/dashboard-config.json > build/five/dashboard-config.json
          python monitoring/dashboards/gen_dashboard.py --config build/five/dashboard-config.json --out build/five/dashboard.json
      # single: local key, one node, Fibre off (two answer tiles). split: remote signer and Fibre (the
      # Fibre row). mainnet: a backup node, a standby Fibre, the outside check and upgrade signalling
      # on top (six answer tiles, the Network upgrade row). five:
      # mainnet without signalling (the Servers tile). Panels of collapsed rows count too; the first
      # screen ends where the Validator row starts; the top strip's six cells and the answer tiles
      # below them share their column edges. The Servers rows (open, then closed) hold eight charts per
      # server (single: one server, mainnet and five: two, split: three, its KMS host scraped): each
      # line one kind of chart, at one width and height, filling the 24 columns; each server's charts
      # in one column, titled with its name first; its out-of-memory marker on its own memory chart.
      - name: Panels match the switches
        run: |
          count() { jq '[.panels[] | ., (.panels // [])[] | select(.type != "row")] | length' "build/$1/dashboard.json"; }
          tiles() { jq -c '[.panels[] | select(.gridPos.y == 3 and .type == "stat") | .id]' "build/$1/dashboard.json"; }
          test "$(count single)" = 33
          test "$(count split)" = 61
          test "$(count mainnet)" = 61
          test "$(count five)" = 56
          test "$(tiles single)" = '[11,12]'
          test "$(tiles split)" = '[11,12,14]'
          test "$(tiles mainnet)" = '[11,12,13,14,15,16]'
          test "$(tiles five)" = '[11,12,17,13,14,15]'
          charts() { jq -c '[.panels[] | select(.id > 100 and .id < 200 and .type == "timeseries") | .id]' "build/$1/dashboard.json"; }
          test "$(charts single)" = '[111,116,115]'
          test "$(charts split)" = '[111,112,116,115]'
          test "$(charts mainnet)" = '[111,112,116,115]'
          for s in single split mainnet five; do
            jq -e '.uid == "celestia-mon-validator" and .title == "Celestia validator" and .templating.list == []' "build/$s/dashboard.json"
            jq -e '([.panels[] | select(.type != "row" and .id < 100) | .gridPos.y + .gridPos.h] | max)
                   == (.panels[] | select(.id == 100) | .gridPos.y)' "build/$s/dashboard.json"
            jq -e '[.panels[] | select(.gridPos.y == 0) | [.gridPos.x, .gridPos.w, .gridPos.h]]
                   == [[0,4,3],[4,4,3],[8,4,3],[12,4,3],[16,4,3],[20,4,3]]' "build/$s/dashboard.json"
            jq -e '[.panels[] | select(.gridPos.y == 3 and .type == "stat") | .gridPos] as $t
                   | ($t | map(.w) | unique | length) == 1 and ($t | map(.h) | unique) == [3]
                   and ($t | map(.w) | add) == 24' "build/$s/dashboard.json"
            jq -e --slurpfile cfg "build/$s/dashboard-config.json" '
                   ($cfg[0].nodes + ([$cfg[0].links[].host] - $cfg[0].nodes)) as $servers | ($servers | length) as $n
                   | [.panels[] | ., (.panels // [])[] | select(.type != "row" and .id >= 410 and .id < 500)] as $p
                   | ($p | length) == 8 * $n
                   and ([.panels[] | select(.id == 400 or .id == 450) | .collapsed] == [false, true])
                   and ($p | group_by(.gridPos.y) | all((map(.gridPos.h) | unique | length) == 1
                                                        and (map(.gridPos.w) | unique | length) == 1
                                                        and (map(.gridPos.w) | add) == 24))
                   and ($n == 1 or ($p | group_by(.id % 10) | all(map(.gridPos.x) | unique | length == 1)))
                   and ($p | all(. as $c | $c.title | startswith($servers[$c.id % 10] + " · ")))
                   and ([.annotations.list[] | select(.name | startswith("Out of memory on ")) | .filter.ids]
                        == [range(0; $n) | [420 + .]])' "build/$s/dashboard.json"
            # The Validator row: six facts on the top strip's column edges, tall enough for their
            # sparklines, then charts of one height, of one width on each line and filling it.
            jq -e '(.panels[] | select(.id == 100) | .gridPos.y) as $y
                   | [.panels[] | select(.id > 100 and .id < 200)] as $v
                   | ($v | map(select(.type == "stat"))) as $f | ($v | map(select(.type == "timeseries"))) as $c
                   | ($f | map(.id)) == [109,117,118,101,102,103]
                   and ($f | map([.gridPos.x, .gridPos.y, .gridPos.w, .gridPos.h]))
                       == [[0,$y+1,4,4],[4,$y+1,4,4],[8,$y+1,4,4],[12,$y+1,4,4],[16,$y+1,4,4],[20,$y+1,4,4]]
                   and ($c | map(.gridPos.h) | unique) == [7]
                   and ($c | group_by(.gridPos.y) | all(map(.gridPos.w) | (unique | length) == 1 and add == 24))
                   and ($v | length) == ($f | length) + ($c | length)' "build/$s/dashboard.json"
          done
          jq -e '.tensile_enabled and .signal_enabled and .announcements_enabled and .kms_hosts == []
                 and .monitor_host == "fibre-1" and .name == "CI validator"' build/mainnet/dashboard-config.json
          jq -e '.kms_hosts == ["kms-1"] and (.tensile_enabled | not) and (.signal_enabled | not) and .name == ""' \
            build/split/dashboard-config.json
          jq -e '.nodes == ["val-1", "fibre-1"]' build/mainnet/dashboard-config.json
          jq -e '[.fibre_mounts[].host] | sort == ["fibre-1", "val-1"]' build/mainnet/dashboard-config.json
          want='[["fibre-1", "fibre.example.org:7980"], ["val-1", "val.example.org:7980"]]'
          jq -e --argjson want "$want" '[.fibre_endpoints[] | [.host, .endpoint]] | sort == $want' build/mainnet/dashboard-config.json
      - name: Wait for Prometheus
        run: curl -fsS --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:9090/-/ready
      - name: Every panel query parses in Prometheus
        run: >-
          python tools/ci/check_queries.py --prometheus http://127.0.0.1:9090
          build/single/dashboard.json build/split/dashboard.json build/mainnet/dashboard.json build/five/dashboard.json

  doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run doctor for each role
        run: |
          bash tools/doctor.sh --help >/dev/null
          run() {
            rc=0
            "$@" 2>stderr.txt || rc=$?
            cat stderr.txt
            if [ "$rc" -gt 1 ] || [ -s stderr.txt ]; then
              echo "doctor exited $rc or wrote to stderr: $*"
              exit 1
            fi
          }
          for roles in validator backup_node fibre kms monitor validator,fibre backup_node,fibre,monitor; do
            echo "::group::roles=$roles (root)"
            run sudo bash tools/doctor.sh --config /dev/null --roles "$roles" --fibre-enabled true \
              --signer remote --data-mounts / --fibre-mount / --head-wait 2
            echo "::endgroup::"
          done
          echo "::group::no config, not root"
          run bash tools/doctor.sh --data-mounts /,/does-not-exist
          echo "::endgroup::"
          echo "::group::every key in doctor.conf.j2"
          sed -n 's/^\([a-z_]\{1,\}\)=.*/\1=/p' ansible/roles/celestia_mon/templates/doctor.conf.j2 >"$RUNNER_TEMP/doctor.conf"
          echo 'roles=validator,fibre' >>"$RUNNER_TEMP/doctor.conf"
          cat "$RUNNER_TEMP/doctor.conf"
          run sudo bash tools/doctor.sh --config "$RUNNER_TEMP/doctor.conf" --head-wait 2
          echo "::endgroup::"

  # doctor on the mainnet roles, on the runner: a stopped stand-in for a standby Fibre unit
  # (loaded, inactive, signer named by host name) and a backup node's config.toml. With two
  # fibre_hosts the stopped unit is a standby (OK 6), its signer must be an IP (FAIL 17) and
  # the fix never starts it; with one it is down (FAIL 6). On a backup node check 2 is INFO.
  doctor-standby:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: doctor on a standby Fibre host and a backup node
        run: |
          set -euo pipefail
          run() {
            rc=0
            out=$("$@" 2>stderr.txt) || rc=$?
            printf '%s\n' "$out"
            cat stderr.txt
            if [ "$rc" -gt 1 ] || [ -s stderr.txt ]; then
              echo "doctor exited $rc or wrote to stderr: $*"
              exit 1
            fi
          }
          printf '%s\n' '[Service]' 'ExecStart=/bin/true --signer-grpc-address localhost:26669 --otel-endpoint http://127.0.0.1:9915' \
            | sudo tee /etc/systemd/system/ci-fibre.service >/dev/null
          sudo systemctl daemon-reload

          run sudo bash tools/doctor.sh --config /dev/null --roles fibre --fibre-enabled true --fibre-unit ci-fibre \
            --fibre-hosts fibre-a,fibre-b --data-mounts / --head-wait 2
          grep -Eq '^OK +6 +fibre service +standby: ci-fibre\.service is inactive and port 7980 is closed' <<<"$out"
          grep -Eq '^FAIL +17 +fibre signer +--signer-grpc-address in ExecStart is localhost:26669, not an IP address' <<<"$out"
          grep -Eq '^FAIL +17 .*leave the unit stopped' <<<"$out"

          run sudo bash tools/doctor.sh --config /dev/null --roles fibre --fibre-enabled true --fibre-unit ci-fibre \
            --fibre-hosts fibre-a --data-mounts / --head-wait 2
          grep -Eq '^FAIL +6 +fibre service +ci-fibre\.service is inactive\.' <<<"$out"

          home="$RUNNER_TEMP/backup-node"
          mkdir -p "$home/config"
          echo 'priv_validator_laddr = ""' >"$home/config/config.toml"
          run sudo bash tools/doctor.sh --config /dev/null --roles backup_node --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^INFO +2 +remote signer +backup node: priv_validator_laddr is empty' <<<"$out"
          echo 'priv_validator_laddr = "tcp://127.0.0.1:26658"' >"$home/config/config.toml"
          run sudo bash tools/doctor.sh --config /dev/null --roles backup_node --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^INFO +2 +remote signer +backup node: priv_validator_laddr = tcp://127\.0\.0\.1:26658' <<<"$out"
          if grep -Eq '^FAIL +2 ' <<<"$out"; then echo "check 2 failed on a backup node"; exit 1; fi

  # doctor's signing-path checks on the runner, with stand-ins: an enabled standby Fibre unit
  # (WARN 6), a standby whose plaintext loopback signer cannot reach the validator node's mTLS
  # privval gRPC on a private address (WARN 17) next to a privval port on every interface
  # (WARN 20), and a backup node whose /status (a static file served on 127.0.0.1:26657) gives
  # its local key voting power (FAIL 2) or none (INFO 2), read where its [rpc] laddr points.
  doctor-signer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: doctor on the signing path
        run: |
          set -euo pipefail
          run() {
            rc=0
            out=$("$@" 2>stderr.txt) || rc=$?
            printf '%s\n' "$out"
            cat stderr.txt
            if [ "$rc" -gt 1 ] || [ -s stderr.txt ]; then
              echo "doctor exited $rc or wrote to stderr: $*"
              exit 1
            fi
          }
          printf '%s\n' '[Service]' 'ExecStart=/bin/true --signer-grpc-address 127.0.0.1:26669 --otel-endpoint http://127.0.0.1:9915' \
            '[Install]' 'WantedBy=multi-user.target' | sudo tee /etc/systemd/system/ci-standby.service >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable ci-standby

          run sudo bash tools/doctor.sh --config /dev/null --roles fibre --fibre-enabled true --fibre-unit ci-standby \
            --fibre-hosts fibre-a,fibre-b --data-mounts / --head-wait 2
          grep -Eq '^WARN +6 +fibre service +standby: ci-standby\.service is inactive, but its unit file is enabled' <<<"$out"
          grep -Eq '^OK +17 +fibre signer +.* is 127\.0\.0\.1:26669, the loopback signer on this host' <<<"$out"

          sudo systemctl disable ci-standby
          home="$RUNNER_TEMP/val"
          mkdir -p "$home/config"
          cat >"$home/config/config.toml" <<'EOF'
          priv_validator_laddr = "tcp://0.0.0.0:26658"
          priv_validator_grpc_laddr = "10.255.0.1:26669"
          priv_validator_grpc_cert_file = "config/grpc.crt"
          priv_validator_grpc_key_file = "config/grpc.key"
          priv_validator_grpc_client_ca_file = "config/ca.crt"
          EOF
          run sudo bash tools/doctor.sh --config /dev/null --roles validator,fibre --signer remote --fibre-enabled true \
            --fibre-unit ci-standby --fibre-hosts fibre-a,fibre-b --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^OK +6 +fibre service +standby: ci-standby\.service is inactive' <<<"$out"
          grep -Eq '^WARN +17 +fibre signer +standby: .*, a plaintext loopback signer, but .* listens on 10\.255\.0\.1:26669 only' <<<"$out"
          grep -Eq '^WARN +20 +signer binds +priv_validator_laddr = tcp://0\.0\.0\.0:26658 .* is on every interface' <<<"$out"

          home="$RUNNER_TEMP/backup"
          mkdir -p "$home/config" "$RUNNER_TEMP/rpc"
          echo 'priv_validator_laddr = ""' >"$home/config/config.toml"
          cat >"$RUNNER_TEMP/rpc/status" <<'EOF'
          {"jsonrpc": "2.0", "id": -1, "result": {"sync_info": {"latest_block_height": "100", "catching_up": false},
            "validator_info": {"address": "0123456789ABCDEF0123456789ABCDEF01234567", "voting_power": "10"}}}
          EOF
          python3 -m http.server 26657 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rpc" >/dev/null 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:26657/status
          run sudo bash tools/doctor.sh --config /dev/null --roles backup_node --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^FAIL +2 +remote signer +backup node: .*/config/priv_validator_key\.json, which has voting power 10' <<<"$out"
          sed -i 's/"voting_power": "10"/"voting_power": "0"/' "$RUNNER_TEMP/rpc/status"
          run sudo bash tools/doctor.sh --config /dev/null --roles backup_node --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^INFO +2 +remote signer +backup node: .* is not in the validator set \(voting power 0\)' <<<"$out"
          grep -Eq '^OK +20 +signer binds +no signer port' <<<"$out"
          # The same node with its RPC on a private address only ([rpc] laddr, for celestia-mon-signal
          # on another host): doctor reads /status there, where its key has voting power 10, and not
          # the stand-in still answering on 127.0.0.1.
          sudo ip addr add 10.255.0.2/32 dev lo
          mkdir -p "$RUNNER_TEMP/rpc-private"
          sed 's/"voting_power": "0"/"voting_power": "10"/' "$RUNNER_TEMP/rpc/status" >"$RUNNER_TEMP/rpc-private/status"
          python3 -m http.server 26657 --bind 10.255.0.2 --directory "$RUNNER_TEMP/rpc-private" >/dev/null 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://10.255.0.2:26657/status
          printf '%s\n' 'priv_validator_laddr = ""' '[rpc]' 'laddr = "tcp://10.255.0.2:26657"' >"$home/config/config.toml"
          run sudo bash tools/doctor.sh --config /dev/null --roles backup_node --node-home "$home" --data-mounts / --head-wait 2
          grep -Eq '^FAIL +2 +remote signer +backup node: .*/config/priv_validator_key\.json, which has voting power 10' <<<"$out"

          # An mTLS standby Fibre on a host whose node serves its privval gRPC in plaintext on loopback.
          exec_mtls='ExecStart=/bin/true --signer-grpc-address 127.0.0.1:26669 --signer-grpc-ca-file /ci/ca.crt'
          exec_mtls+=' --signer-grpc-cert-file /ci/c.crt --signer-grpc-key-file /ci/c.key --otel-endpoint http://127.0.0.1:9915'
          printf '%s\n' '[Service]' "$exec_mtls" | sudo tee /etc/systemd/system/ci-mtls.service >/dev/null
          sudo systemctl daemon-reload
          home="$RUNNER_TEMP/val-plain"
          mkdir -p "$home/config"
          echo 'priv_validator_grpc_laddr = "127.0.0.1:26669"' >"$home/config/config.toml"
          run sudo bash tools/doctor.sh --config /dev/null --roles validator,fibre --signer remote --fibre-enabled true \
            --fibre-unit ci-mtls --fibre-hosts fibre-a,fibre-b --node-home "$home" --data-mounts / --head-wait 2
          line=$(grep -E '^WARN +17 +fibre signer +standby: ' <<<"$out")
          grep -qF 'an mTLS signer on this host, but the node serves its privval gRPC on 127.0.0.1:26669 in plaintext' <<<"$line"

  # Runs doctor's monitor checks (11 and 12) against a real Prometheus at the pinned version,
  # loaded with rules that use every PromQL form the metric parser has to handle (strings
  # with escaped quotes and braces, on/ignoring/group_left/by/without lists, bool, offset,
  # @ start(), subqueries, recording-rule names with colons, +Inf, 1e6). A python
  # http.server stands in for Alertmanager's /-/ready on 127.0.0.1:9913. The parser must
  # find exactly 8 names: up, prometheus_ready and prometheus_build_info have series; the
  # 5 ci_* names do not. A second scrape job points at a closed port, so check 11 must
  # report it down with its error. This Prometheus asks for no login, and the runner has no
  # /etc/celestia-mon/api-password, so doctor sends none (the install job covers the login).
  doctor-monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      - name: doctor checks 11 and 12 against Prometheus on loopback
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/monitor"
          mkdir -p "$dir/data" "$dir/am/-"
          cd "$dir"
          rel="prometheus-$PROMETHEUS_VERSION.linux-amd64"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$rel.tar.gz"
          echo "$PROMETHEUS_SHA256  $rel.tar.gz" | sha256sum -c -
          tar -xzf "$rel.tar.gz" --strip-components=1 "$rel/prometheus"
          cat > prometheus.yml <<'EOF'
          global:
            scrape_interval: 5s
            evaluation_interval: 5s
          rule_files:
            - rules.yml
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["127.0.0.1:9912"]
            - job_name: closed
              static_configs:
                - targets: ["127.0.0.1:9"]
          EOF
          cat > rules.yml <<'EOF'
          groups:
            - name: ci
              rules:
                - alert: CiPresent
                  expr: 'up{job="prometheus"} == 1 and on (instance) prometheus_ready > bool 0'
                - alert: CiMissing
                  expr: >-
                    sum by (host) (rate(ci_missing_total{reason!~"a\"b|}"}[5m] offset 1h))
                    > on (host) group_left (role) max by (host, role) (ci_missing_info) * 1e6
                - alert: CiOther
                  expr: >-
                    label_replace(vector(1), "dst", "$1", "src", "(.*)") unless on () absent(prometheus_build_info)
                    or ci_missing_gauge @ start() < +Inf or count(ci:missing:rate5m) > 0
                    or quantile_over_time(0.5, ci_missing_q[10m:1m]) > 0
          EOF
          ./prometheus --config.file=prometheus.yml --storage.tsdb.path=data \
            --web.listen-address=127.0.0.1:9912 >prometheus.log 2>&1 &
          touch am/-/ready
          python3 -m http.server 9913 --bind 127.0.0.1 --directory am >/dev/null 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:9912/-/ready
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:9913/-/ready
          # /-/ready answers before the first scrape: wait until both targets have been scraped once.
          for _ in $(seq 60); do
            if curl -fsS 'http://127.0.0.1:9912/api/v1/query?query=count(up)' | grep -q '"value":[[0-9.]*,"2"]'; then break; fi
            sleep 1
          done
          # Check 21 reads these through doctor's JSON reader: escaped quotes and braces, a regex
          # matcher that admits the pages, a host silence that does not, and an expired silence.
          mkdir -p am/api/v2
          soon=$(date -u -d '+30 min' +%Y-%m-%dT%H:%M:%S.000Z)
          cat > am/api/v2/silences <<EOF
          [{"id":"00000000-0000-0000-0000-000000000001","status":{"state":"active"},"updatedAt":"2026-10-17T10:00:00.000Z",
            "comment":"ci","createdBy":"ci \"quoted\" {x}","endsAt":"2099-01-01T00:00:00.000Z",
            "matchers":[{"isEqual":true,"isRegex":true,"name":"severity","value":"page|message"}],"startsAt":"2026-10-17T10:00:00.000Z"},
           {"id":"00000000-0000-0000-0000-000000000002","status":{"state":"active"},"updatedAt":"2026-10-17T10:00:00.000Z",
            "comment":"planned","createdBy":"op","endsAt":"$soon",
            "matchers":[{"isEqual":true,"isRegex":false,"name":"host","value":"val-1"}],"startsAt":"2026-10-17T10:00:00.000Z"},
           {"id":"00000000-0000-0000-0000-000000000003","status":{"state":"expired"},"updatedAt":"2026-10-17T10:00:00.000Z",
            "comment":"old","createdBy":"op","endsAt":"2026-10-17T11:00:00.000Z",
            "matchers":[{"isEqual":true,"isRegex":false,"name":"alertname","value":"FibreDown"}],"startsAt":"2026-10-17T10:00:00.000Z"}]
          EOF

          rc=0
          out=$(bash "$GITHUB_WORKSPACE/tools/doctor.sh" --config /dev/null --roles monitor 2>stderr.txt) || rc=$?
          printf '%s\n' "$out"
          cat stderr.txt
          if [ "$rc" -ne 1 ] || [ -s stderr.txt ]; then
            echo "doctor exited $rc (expected 1: the closed target is down) or wrote to stderr"
            exit 1
          fi
          if ! grep -Eq '^FAIL +11 +monitor stack +1 of 2 scrape targets down: closed http://127\.0\.0\.1:9/metrics \(connection refused\)\.' <<<"$out"; then
            echo "check 11 did not report the closed target"
            exit 1
          fi
          line=$(grep -E '^WARN +12 +rule metrics +5 of 8 metrics ' <<<"$out" || true)
          if [ -z "$line" ]; then
            echo "check 12 did not find exactly 8 metric names with 5 of them missing"
            exit 1
          fi
          for m in ci_missing_total ci_missing_info ci_missing_gauge ci:missing:rate5m ci_missing_q; do
            if ! grep -qF " $m (" <<<"$line"; then echo "check 12 does not list $m"; exit 1; fi
          done
          grep -qF ' ci_missing_total (CiMissing)' <<<"$line" || { echo "check 12 names the wrong rule for ci_missing_total"; exit 1; }
          line=$(grep -E '^WARN +21 +silences +1 of 2 active silences ' <<<"$out" || true)
          for want in '{severity=~"page|message"} by ci "quoted" {x} until 2099-01-01T00:00:00.000Z' \
                      '(ID 00000000-0000-0000-0000-000000000001: holds back NodeNotAdvancing, ValidatorNotSigning, FibreDown, DiskLow; ends in ' \
                      ' hours); the others: {host="val-1"} by op'; do
            grep -qF -- "$want" <<<"$line" || { echo "check 21 did not report the page silence: $want"; exit 1; }
          done
          if grep -q '000000000003' <<<"$out"; then echo "check 21 listed an expired silence"; exit 1; fi
          grep -Eq '^SKIP +22 +dead-man ' <<<"$out" || { echo "check 22 did not skip without an alertmanager job"; exit 1; }
      - name: Show the Prometheus log
        if: failure()
        run: cat "$RUNNER_TEMP/monitor/prometheus.log" || true

  # install.sh end to end on the runner, as an operator runs it on a host: a dry run that
  # changes nothing, the install, a second run that changes nothing, root-owned binaries that
  # match their recorded sha256, Prometheus and Alertmanager behind the API password, doctor on
  # the result, the units' memory against their MemoryHigh, then --uninstall, which must remove
  # the units, binaries, secrets files and recorded ufw rules and keep the data, settings and users, and
  # --uninstall --purge, which must leave no celestia-mon unit, user, group, directory or ufw
  # rule; a second run of each changes nothing. ufw is enabled first with a rule of the
  # operator's (it even carries the comment celestia-mon) that must survive both, and the
  # inventory names monitor addresses other than this host's (celestia_mon_firewall_sources),
  # so rules are added, recorded and removed. No setup-python: install.sh brings its own Ansible.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # install.sh installs Ansible only from ansible/requirements.lock, and refuses the
      # placeholder that is committed until the lock workflow (.github/workflows/lock.yml) has
      # made the first lock. While it is the placeholder, this makes a lock in the runner's
      # checkout the way that workflow does (pinned uv, checked against versions.yml; hashes of
      # every file), so install.sh runs with --require-hashes as on a host. A committed lock is
      # used as it is.
      - name: Use the committed Ansible lock, or make one while it is the placeholder
        run: |
          set -euo pipefail
          if grep -q '^ansible-core==' ansible/requirements.lock; then
            echo "Using the committed ansible/requirements.lock."
            exit 0
          fi
          echo "::warning::ansible/requirements.lock is the placeholder: run the lock workflow and commit its lock. This job makes one meanwhile."
          pins=.celestia_mon_versions
          uv_version=$(yq "$pins.uv.version" versions.yml)
          uv_sha256=$(yq "$pins.uv.sha256.x86_64" versions.yml)
          ansible_core=$(yq "$pins.ansible_core" versions.yml)
          deps_before=$(yq "$pins.python_deps_before" versions.yml)
          tarball=uv-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$RUNNER_TEMP/uv" "$RUNNER_TEMP/lock"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/astral-sh/uv/releases/download/$uv_version/$tarball"
          echo "$uv_sha256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/uv" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "ansible-core==$ansible_core" >"$RUNNER_TEMP/lock/requirements.in"
          UV_NO_CONFIG=1 UV_NO_PROGRESS=1 UV_PYTHON_DOWNLOADS=never "$RUNNER_TEMP/uv/uv" pip compile "$RUNNER_TEMP/lock/requirements.in" \
            --universal --python-version 3.12 --generate-hashes --only-binary :all: --exclude-newer "$deps_before" \
            --no-header --output-file "$RUNNER_TEMP/lock/requirements.lock"
          cp "$RUNNER_TEMP/lock/requirements.lock" ansible/requirements.lock
          cat ansible/requirements.lock
      - name: Write a one-host inventory
        run: |
          inv="$RUNNER_TEMP/install"
          mkdir -p "$inv"
          chmod 0755 "$inv"
          echo "INV=$inv/hosts.yml" >> "$GITHUB_ENV"
          cat > "$inv/hosts.yml" <<'EOF'
          all:
            hosts:
              ci:
                celestia_mon_private_ip: 127.0.0.1
                celestia_mon_data_mounts: [/]
                celestia_mon_fibre_mount: /
                celestia_mon_firewall_sources: [10.255.255.1, 10.255.255.2]
            children:
              validator:
                hosts:
                  ci:
              fibre:
                hosts:
                  ci:
              monitor:
                hosts:
                  ci:
            vars:
              celestia_mon_signer: local
              celestia_mon_fibre_enabled: true
              celestia_mon_units:
                appd: systemd-journald
                fibre: systemd-logind
                tmkms: tmkms
              celestia_mon_prometheus_retention_size: 1GB
              celestia_mon_receivers:
                - {type: webhook, url: "http://127.0.0.1:9/message"}
              celestia_mon_deadman_webhook_url: http://127.0.0.1:9/deadman
              celestia_mon_grafana_admin_password: ci-test-only-not-a-secret
              celestia_mon_announcements:
                - {channel_id: "111111111111111111", severity: page}
              celestia_mon_announcements_discord_api: http://127.0.0.1:8765/api/v10
              celestia_mon_announcements_interval_seconds: 5
              celestia_mon_discord_bot_token: ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
              celestia_mon_tensile: {api: "http://127.0.0.1:8766/api/v1", validator: "celestiavalcons1ci"}
          EOF
          # tools/ci/rpc_stub.py stands in for a node's RPC for celestia-mon-signal: the upgrade to v10
          # is pending, and the validator (a synthetic operator address) signalled it.
          op=1111111111111111111111111111111111111111
          addr=$(python3 tools/ci/rpc_stub.py address "$op")
          printf '    celestia_mon_signal: {chain_id: celestia, rpc: ["http://127.0.0.1:8767"], validator: %s}\n' "$addr" >>"$inv/hosts.yml"
          cat >"$RUNNER_TEMP/rpc.json" <<EOF
          {"network": "celestia", "version": "9.0.4", "app_version": 9, "height": 15000000, "lowest": 1,
           "tally": {"10": "CJv2gb0BEMj0pLgBGNbYkt0B"}, "upgrade": "CgcIChDy0poH", "signals": {"$op": 10}}
          EOF
          nohup python3 tools/ci/rpc_stub.py 8767 "$RUNNER_TEMP/rpc.json" >"$RUNNER_TEMP/rpc-stub.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8767/health
          # A stand-in of Tensile's API for celestia-mon-tensile.
          v="$RUNNER_TEMP/tensile-api/api/v1/validators/celestiavalcons1ci"
          mkdir -p "$v"
          printf '{"host": "203.0.113.7:7980", "reachable": true, "identity_status": "verified", %s}' \
            "\"last_endpoint_check\": {\"at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"outcome\": \"REACHABLE\"}" >"$v/status"
          nohup python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tensile-api" >/dev/null 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8766/api/v1/validators/celestiavalcons1ci/status
          # tools/ci/discord_stub.py stands in for Discord for celestia-mon-announcements.
          STUB_TOKEN=ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            nohup python3 tools/ci/discord_stub.py 8765 "$RUNNER_TEMP/stub-posts.jsonl" >"$RUNNER_TEMP/stub.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/health
      # The rule for 10.255.255.2 is there before the install, even with celestia-mon's comment:
      # the install must not record it, and no uninstall may remove it.
      - name: Enable ufw, as on a hardened host, with a rule of the operator's
        run: |
          sudo ufw allow 22/tcp
          sudo ufw allow from 10.255.255.2 to any port 9910 proto tcp comment celestia-mon
          sudo ufw --force enable
          sudo ufw status verbose
      # Each gate stops install.sh before any change: a placeholder dead-man URL, a firewall
      # source wider than its private block, a vault.yml in plain text or readable by others.
      - name: The install refuses unsafe settings
        run: |
          set -euo pipefail
          refused() {
            local inv=$1 want=$2 rc=0
            sudo bash ./install.sh --inventory "$inv" --host ci --check >"$RUNNER_TEMP/gate.log" 2>&1 || rc=$?
            if [ "$rc" = 0 ] || ! grep -qF -- "$want" "$RUNNER_TEMP/gate.log"; then
              cat "$RUNNER_TEMP/gate.log"; echo "install.sh did not stop with: $want"; exit 1
            fi
          }
          gate() {
            mkdir -p "$RUNNER_TEMP/gate-$1"
            chmod 0755 "$RUNNER_TEMP/gate-$1"
            sed -E "$2" "$INV" >"$RUNNER_TEMP/gate-$1/hosts.yml"
            echo "$RUNNER_TEMP/gate-$1/hosts.yml"
          }
          placeholder=https://deadman.example.invalid/ping/REPLACE_ME
          refused "$(gate deadman "s#celestia_mon_deadman_webhook_url: .*#celestia_mon_deadman_webhook_url: $placeholder#")" \
            'Set celestia_mon_deadman_webhook_url'
          refused "$(gate sources 's#celestia_mon_firewall_sources: .*#celestia_mon_firewall_sources: [192.168.0.0/8]#')" \
            'must be a list of private addresses'
          vault="$(dirname "$INV")/host_vars/ci/vault.yml"
          mkdir -p "$(dirname "$vault")"
          echo 'celestia_mon_grafana_admin_password: ci-test-only-not-a-secret' >"$vault"
          refused "$INV" 'is not encrypted'
          printf '%s\n' '$ANSIBLE_VAULT;1.1;AES256' '00' >"$vault"
          chmod 0644 "$vault"
          refused "$INV" 'is readable by group or other'
          # An encrypted vault.yml that only its owner reads passes the gate, and the dry run runs the
          # install playbook (it stops there because no vault password was given), never the removal.
          chmod 0600 "$vault"
          sudo bash ./install.sh --inventory "$INV" --host ci --check --verbose >"$RUNNER_TEMP/gate.log" 2>&1 || true
          if grep -qF 'PLAY [Remove celestia-mon]' "$RUNNER_TEMP/gate.log" ||
             ! grep -qF 'PLAY [Check the inventory and this host]' "$RUNNER_TEMP/gate.log"; then
            cat "$RUNNER_TEMP/gate.log"; echo "with a vault.yml in the inventory, the dry run did not run the install playbook"; exit 1
          fi
          rm -r "$(dirname "$INV")/host_vars"
          test ! -e /var/tmp/celestia-mon-install
      - name: The dry run changes nothing and lists the ufw rules
        run: |
          sudo bash ./install.sh --inventory "$INV" --host ci --check | tee "$RUNNER_TEMP/check.log"
          grep -q 'ufw rule:  allow from 10.255.255.1 to port 9910/tcp' "$RUNNER_TEMP/check.log"
          if grep -q 'ufw rule:  allow from 10.255.255.2 to port 9910/tcp' "$RUNNER_TEMP/check.log"; then
            echo "the plan adds a rule that exists already"; exit 1
          fi
          if systemctl list-unit-files 'celestia-mon-*' --no-legend | grep -q .; then echo "the dry run created units"; exit 1; fi
          if sudo ufw show added | grep -q 'from 10\.255\.255\.1 '; then echo "the dry run added ufw rules"; exit 1; fi
          test ! -e /var/tmp/celestia-mon-install
      # --edit-vault on a terminal (expect gives it one and types the password at each prompt): it
      # creates an encrypted vault.yml that only its owner reads, and opens it again decrypted. The
      # editor is a script: it writes the file the first time and copies what it is shown the second.
      - name: --edit-vault creates and edits an encrypted vault.yml
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq expect >/dev/null
          dir="$RUNNER_TEMP/editvault/host_vars/mon"
          mkdir -p "$dir"
          printf '%s\n' '#!/bin/sh' \
            'if grep -q celestia_mon_ci "$1"; then cp "$1" /tmp/ed-out; else echo "celestia_mon_ci: 1" >"$1"; fi' >/tmp/ed.sh
          chmod 755 /tmp/ed.sh
          cat >/tmp/ev.exp <<'EOF'
          set timeout 300
          spawn sudo EDITOR=/tmp/ed.sh bash ./install.sh --edit-vault [lindex $argv 0]
          expect {
            -re {Confirm New Vault password: ?$} { send "ci-vault-pw\r"; exp_continue }
            -re {New Vault password: ?$} { send "ci-vault-pw\r"; exp_continue }
            -re {Vault password[^:]*: ?$} { send "ci-vault-pw\r"; exp_continue }
            eof
          }
          exit [lindex [wait] 3]
          EOF
          expect /tmp/ev.exp "$dir/vault.yml"
          sudo head -c 15 "$dir/vault.yml" | grep -qF '$ANSIBLE_VAULT;'
          test "$(sudo stat -c %a "$dir/vault.yml")" = 600
          expect /tmp/ev.exp "$dir/vault.yml"
          sudo grep -qx 'celestia_mon_ci: 1' /tmp/ed-out
          test ! -e /var/tmp/celestia-mon-install
          if sudo bash ./install.sh --edit-vault "$dir/hosts.yml" </dev/null 2>/dev/null; then
            echo "--edit-vault accepted a file that is not a vault.yml"; exit 1
          fi
      # A first install sends one test message to the chat receivers; a run that changes nothing does not.
      - name: Install
        run: |
          sudo bash ./install.sh --inventory "$INV" --host ci --yes | tee "$RUNNER_TEMP/install.log"
          grep -q '^A test message went to the chat receivers' "$RUNNER_TEMP/install.log"
          # One line per part on the terminal; Ansible's whole output in the log, root's only.
          grep -Eq '^  Prometheus +[0-9]+ changes?$' "$RUNNER_TEMP/install.log"
          if grep -q '^TASK \[' "$RUNNER_TEMP/install.log"; then echo "the progress view shows Ansible's tasks"; exit 1; fi
          sudo grep -q '^TASK \[celestia_mon_prometheus' /var/log/celestia-mon/install.log
          test "$(sudo stat -c '%U %a' /var/log/celestia-mon) $(sudo stat -c '%a' /var/log/celestia-mon/install.log)" = "root 700 600"
      - name: A second run changes nothing
        run: |
          sudo bash ./install.sh --inventory "$INV" --host ci --yes | tee "$RUNNER_TEMP/second.log"
          grep -q '^The dry run finds nothing to change\.' "$RUNNER_TEMP/second.log"
          grep -q '^No changes: ci already matches the inventory\.' "$RUNNER_TEMP/second.log"
          grep -Eq '^  Prometheus +no change$' "$RUNNER_TEMP/second.log"
          if grep -q '^A test message went' "$RUNNER_TEMP/second.log"; then echo "a run that changed nothing sent a test message"; exit 1; fi
          test ! -e /var/tmp/celestia-mon-install
      # The releases store their files as uid 1001 (Prometheus, Alertmanager, node_exporter, the
      # collector) or 1000 (Grafana), and root runs some of them (promtool, amtool, the collector's
      # validate): everything under /opt/celestia-mon must belong to root, and nothing there may be
      # writable by every user. Each binary matches the sha256 the install recorded next to it, and
      # no staging directory is left.
      - name: Every file under /opt/celestia-mon belongs to root and matches its recorded sha256
        run: |
          set -euo pipefail
          bad=$(sudo find /opt/celestia-mon \( ! -user 0 -o ! -group 0 -o \( ! -type l -perm -0002 \) \) -printf '%u:%g %m %p\n')
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | head -n 20
            echo "files under /opt/celestia-mon that root does not own, or that every user can write"
            exit 1
          fi
          sums=0
          for d in /opt/celestia-mon/node_exporter-* /opt/celestia-mon/otelcol-contrib-* /opt/celestia-mon/prometheus-* /opt/celestia-mon/alertmanager-*; do
            (cd "$d" && sudo sha256sum --check --strict SHA256SUMS)
            sums=$((sums + 1))
          done
          test "$sums" = 4
          if sudo find /var/cache/celestia-mon /opt/celestia-mon -maxdepth 1 -name '*staging*' 2>/dev/null | grep .; then
            echo "a staging directory was left behind"
            exit 1
          fi
      # Every request to Prometheus and Alertmanager, /-/ready and /metrics included, needs the
      # password the install generated (readable by root and the celestia-mon-prometheus group);
      # amtool, as root, reads it through its --http.config.file.
      - name: Prometheus and Alertmanager answer only with the API password
        run: |
          set -euo pipefail
          test "$(sudo stat -c '%U:%G %a' /etc/celestia-mon/api-password)" = "root:celestia-mon-prometheus 640"
          test "$(sudo stat -c '%U:%G %a' /etc/celestia-mon/alertmanager/amtool-http.yml)" = "root:root 600"
          for url in http://127.0.0.1:9912/-/ready http://127.0.0.1:9912/metrics http://127.0.0.1:9912/api/v1/rules \
                     http://127.0.0.1:9913/-/ready http://127.0.0.1:9913/metrics http://127.0.0.1:9913/api/v2/silences; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" != 401 ]; then echo "$url answered $code without the password, expected 401"; exit 1; fi
            # curl reads the login from stdin (-K -), so the password never shows in its arguments.
            sudo sh -c 'printf "user = \"celestia-mon:%s\"\n" "$(cat /etc/celestia-mon/api-password)"' | curl -fsS -o /dev/null -K - "$url"
          done
          amtool=$(ls /opt/celestia-mon/alertmanager-*/amtool)
          sudo "$amtool" --alertmanager.url=http://127.0.0.1:9913 --http.config.file=/etc/celestia-mon/alertmanager/amtool-http.yml silence query
          # Grafana's own login is root-only; Prometheus takes it, Alertmanager refuses it.
          test "$(sudo stat -c '%U:%G %a' /etc/celestia-mon/grafana-api-password)" = "root:root 600"
          grafana_login() { sudo sh -c 'printf "user = \"grafana:%s\"\n" "$(cat /etc/celestia-mon/grafana-api-password)"'; }
          test "$(grafana_login | curl -s -o /dev/null -w '%{http_code}' -K - http://127.0.0.1:9912/api/v1/status/buildinfo)" = 200
          test "$(grafana_login | curl -s -o /dev/null -w '%{http_code}' -K - http://127.0.0.1:9913/api/v2/silences)" = 401
      # The rules for 10.255.255.2 on the other scraped ports (the collector's, celestia-appd's)
      # are added and recorded; only its rule for 9910, there before the install, is not.
      # The first read only notes the newest message; the stand-in then shows two new ones, which
      # reach Alertmanager as two CelestiaAnnouncement alerts. Prometheus scrapes the reader.
      # celestia-mon-tensile reads the stand-in and Prometheus scrapes it.
      - name: The outside check of the Fibre endpoint is read
        run: |
          set -euo pipefail
          systemctl is-active celestia-mon-tensile
          curl -fsS http://127.0.0.1:9917/metrics | grep -qx 'celestia_mon_fibre_reachable{endpoint="203.0.113.7:7980"} 1'
          login() { sudo sh -c 'printf "user = \"celestia-mon:%s\"\n" "$(cat /etc/celestia-mon/api-password)"'; }
          for _ in $(seq 30); do
            if login | curl -fsS -g -K - 'http://127.0.0.1:9912/api/v1/query?query=up{job="tensile"}' |
              jq -e '.data.result[0].value[1] == "1"' >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Prometheus does not scrape celestia-mon-tensile"; exit 1
      # celestia-mon-signal reads the stand-in of a node's RPC, Prometheus scrapes it, and the rules
      # rendered on this host act on it: the stand-in's upgrade is pending and the validator signalled
      # it, so UpgradeScheduled fires and UpgradeSignalMissing does not.
      - name: Upgrade signalling is read
        run: |
          set -euo pipefail
          systemctl is-active celestia-mon-signal
          test "$(sudo stat -c '%U:%G %a' /etc/celestia-mon/signal/config.json)" = "root:celestia-mon-signal 640"
          m=$(curl -fsS http://127.0.0.1:9918/metrics)
          grep -qx 'celestia_mon_signal_validator_version 10' <<<"$m"
          grep -qx 'celestia_mon_upgrade_height 15116658' <<<"$m"
          login() { sudo sh -c 'printf "user = \"celestia-mon:%s\"\n" "$(cat /etc/celestia-mon/api-password)"'; }
          query() { login | curl -fsS -K - -G --data-urlencode "query=$1" http://127.0.0.1:9912/api/v1/query; }
          poll() { # PromQL, jq test its reply must pass
            for _ in $(seq 60); do
              if jq -e "$2" >/dev/null <<<"$(query "$1")"; then return 0; fi
              sleep 2
            done
            echo "Prometheus never answered $1 as expected"; exit 1
          }
          poll 'up{job="signal"}' '.data.result[0].value[1] == "1"'
          poll 'ALERTS{alertname="UpgradeScheduled",alertstate="firing"}' '.data.result | length == 1'
          jq -e '.data.result | length == 0' <<<"$(query 'ALERTS{alertname="UpgradeSignalMissing"}')"
      - name: Celestia announcements reach Alertmanager
        run: |
          set -euo pipefail
          systemctl is-active celestia-mon-announcements
          test "$(sudo stat -c '%U:%G %a' /etc/celestia-mon/announcements/discord-token)" = "root:root 600"
          login() { sudo sh -c 'printf "user = \"celestia-mon:%s\"\n" "$(cat /etc/celestia-mon/api-password)"'; }
          n=0
          for _ in $(seq 60); do
            n=$(login | curl -fsS -g -K - 'http://127.0.0.1:9913/api/v2/alerts?filter=alertname="CelestiaAnnouncement"' | jq length)
            if [ "$n" = 2 ]; then break; fi
            sleep 2
          done
          if [ "$n" != 2 ]; then sudo journalctl -u celestia-mon-announcements --no-pager | tail -n 30; exit 1; fi
          curl -fsS http://127.0.0.1:9916/metrics |
            grep -Eq '^celestia_mon_announcements_last_success_timestamp_seconds\{channel="111111111111111111"\} [1-9]'
          login | curl -fsS -g -K - 'http://127.0.0.1:9912/api/v1/query?query=up{job="announcements"}' | jq -e '.data.result[0].value[1] == "1"'
      - name: The units run with the resource caps, and the ufw rules carry the comment and are recorded
        run: |
          for u in node-exporter otelcol prometheus alertmanager grafana; do
            systemctl is-active "celestia-mon-$u"
            systemctl show "celestia-mon-$u" -p Nice -p CPUWeight -p IOWeight -p MemoryHigh -p MemoryMax
          done
          test "$(systemctl show celestia-mon-prometheus -p MemoryHigh --value)" = "$((2 * 1024 * 1024 * 1024))"
          test "$(systemctl show celestia-mon-prometheus -p MemoryMax --value)" = "$((4 * 1024 * 1024 * 1024))"
          test "$(systemctl show celestia-mon-node-exporter -p Nice --value)" = 10
          sudo ufw show added | grep -q "allow from 10.255.255.1 to any port 9910 proto tcp comment 'celestia-mon'"
          rec=/var/lib/celestia-mon/firewall-added.json
          sudo cat "$rec"
          sudo jq -e 'any(.[]; .source == "10.255.255.1" and .port == 9910 and .proto == "tcp" and .comment == "celestia-mon")' "$rec"
          sudo jq -e 'all(.[]; .source != "10.255.255.2" or .port != 9910)' "$rec"
      # The runner has no celestia-appd, so its metrics target is the one target down. The
      # stack's own jobs (prometheus, alertmanager), node and otelcol must be up, and the rule
      # metrics they export must have series. systemd-logind stands in for Fibre and pushes
      # nothing, so check 12 names the broken sources and check 13 reports that Fibre does not push.
      - name: doctor reads Prometheus and Alertmanager on loopback
        run: |
          out=$(sudo celestia-mon-doctor || true)
          printf '%s\n' "$out"
          grep -Eq '^FAIL +11 +monitor stack +1 of 8 scrape targets down: celestia-app ' <<<"$out"
          line=$(grep -E '^(OK|WARN) +12 +rule metrics ' <<<"$out")
          for m in up node_filesystem_avail_bytes alertmanager_notifications_failed_total prometheus_rule_evaluation_failures_total; do
            # Names in the list follow ": " or ", "; the Fix text also says "is up (check 11)".
            if grep -qE "[:,] ${m//./\.} \(" <<<"$line"; then echo "check 12 lists $m, which has series here"; exit 1; fi
          done
          grep -Eq '^FAIL +12 +rule metrics .*cometbft_consensus_height \(celestia-app target not up: check 11\)' <<<"$out"
          grep -Eq '^FAIL +12 +rule metrics .*fibre_server_upload_shard_budget_bytes \(Fibre is not pushing metrics: check 13\)' <<<"$out"
          grep -Eq '^FAIL +13 +fibre pipeline +ci: Fibre is not pushing metrics ' <<<"$out"
          grep -Eq '^(OK|WARN) +14 +unit memory +.*celestia-mon-prometheus [0-9]+ MiB' <<<"$out"
          grep -Eq '^OK +8 +private binds +.*celestia-mon-announcements 127\.0\.0\.1:9916' <<<"$out"
          grep -Eq '^(OK|WARN) +14 +unit memory +.*celestia-mon-announcements [0-9]+ MiB' <<<"$out"
          grep -Eq '^OK +15 +monitor disk +Prometheus holds .*room for retention_size 1GB x 1\.5 \+ 2 GiB = 3\.5 GiB' <<<"$out"
          grep -Eq '^OK +21 +silences +no active silence' <<<"$out"
          grep -Eq '^OK +8 +private binds +.*celestia-mon-signal 127\.0\.0\.1:9918' <<<"$out"
          line=$(grep -E '^OK +23 +upgrade signal +read through http://127\.0\.0\.1:8767 ' <<<"$out")
          grep -qF 'v10 signalled by 85.5% of the voting power, an upgrade needs 83.3%; your validator signalled v10;' <<<"$line"
          grep -qF 'upgrade to v10 scheduled at height 15116658, in about 3.9 days' <<<"$line"
          # The CI dead-man URL is a closed port, and the Watchdog stops after the first failed message.
          grep -Eq '^(OK|NOT YET|WARN|FAIL) +22 +dead-man ' <<<"$out"
      # The defaults must leave headroom: each unit's peak memory since it started (memory.peak
      # of its cgroup, cgroup v2, kernel 5.19 or later) must stay at or below half its MemoryHigh.
      # Pages of the binaries that the install read stay charged to the installer; the
      # collectors job measures node_exporter and the collector after a cold start.
      - name: Every unit's peak memory stays at or below half its MemoryHigh
        run: |
          fail=0
          for u in node-exporter otelcol prometheus alertmanager grafana; do
            unit=celestia-mon-$u
            high=$(systemctl show -P MemoryHigh "$unit")
            current=$(systemctl show -P MemoryCurrent "$unit")
            peak=$(cat "/sys/fs/cgroup$(systemctl show -P ControlGroup "$unit")/memory.peak")
            printf '%-27s current %5d MiB, peak %5d MiB, MemoryHigh %5d MiB\n' "$unit" \
              $((current / 1048576)) $((peak / 1048576)) $((high / 1048576))
            if ((peak * 2 > high)); then echo "$unit peaked above half of its MemoryHigh: raise its default in celestia_mon_memory"; fail=1; fi
          done
          exit "$fail"
      - name: Uninstall removes the services and the recorded rules, and keeps data, settings and users
        run: |
          sudo bash ./install.sh --uninstall --inventory "$INV" --host ci --yes | tee "$RUNNER_TEMP/uninstall.log"
          left=0
          if systemctl list-unit-files 'celestia-mon-*' --no-legend | grep -q .; then echo "unit files left"; left=1; fi
          if systemctl list-units --all 'celestia-mon-*' --no-legend | grep -q .; then echo "units left"; left=1; fi
          # The settings files that hold secrets go on every uninstall; a reinstall writes them again.
          for p in /opt/celestia-mon /var/cache/celestia-mon /usr/local/bin/celestia-mon-doctor \
                   /var/lib/celestia-mon/firewall-added.json /var/tmp/celestia-mon-install \
                   /etc/celestia-mon/alertmanager/alertmanager.yml /etc/celestia-mon/grafana/admin-password \
                   /etc/celestia-mon/grafana/provisioning/datasources/celestia-mon.yml /etc/celestia-mon/api-password \
                   /etc/celestia-mon/grafana-api-password /etc/celestia-mon/announcements/discord-token \
                   /etc/celestia-mon/signal/config.json; do
            if sudo test -e "$p"; then echo "$p left"; left=1; fi
          done
          for p in /var/lib/celestia-mon/prometheus /var/lib/celestia-mon/grafana /etc/celestia-mon; do
            sudo test -e "$p" || { echo "$p removed without --purge"; left=1; }
          done
          getent passwd celestia-mon-prometheus >/dev/null || { echo "users removed without --purge"; left=1; }
          added=$(sudo ufw show added)
          printf '%s\n' "$added"
          # Only the operator's rule for 10.255.255.2 to 9910 may carry the comment now.
          if [ "$(grep -c "comment 'celestia-mon'" <<<"$added")" != 1 ]; then echo "recorded ufw rules left"; left=1; fi
          grep -qx "ufw allow from 10.255.255.2 to any port 9910 proto tcp comment 'celestia-mon'" <<<"$added" ||
            { echo "uninstall removed a rule that was there before the install"; left=1; }
          grep -qx 'ufw allow 22/tcp' <<<"$added" || { echo "uninstall touched another ufw rule"; left=1; }
          grep -qF -- '--uninstall --purge --host ci' "$RUNNER_TEMP/uninstall.log" || { echo "no --purge hint"; left=1; }
          exit "$left"
      - name: A second uninstall changes nothing
        run: |
          sudo bash ./install.sh --uninstall --inventory "$INV" --host ci --yes | tee "$RUNNER_TEMP/again.log"
          grep -qF 'celestia-mon is removed from ci (0 change(s)).' "$RUNNER_TEMP/again.log"
      - name: Uninstall --purge leaves nothing behind
        run: |
          sudo bash ./install.sh --uninstall --purge --host ci --check | tee "$RUNNER_TEMP/purge-plan.log"
          grep -q '^Purge: .*/var/lib/celestia-mon' "$RUNNER_TEMP/purge-plan.log"
          sudo bash ./install.sh --uninstall --purge --host ci --yes
          left=0
          if systemctl list-unit-files 'celestia-mon-*' --no-legend | grep -q .; then echo "unit files left"; left=1; fi
          if getent passwd | grep -q '^celestia-mon-'; then echo "users left"; left=1; fi
          if getent group | grep -q '^celestia-mon-'; then echo "groups left"; left=1; fi
          for p in /opt/celestia-mon /etc/celestia-mon /var/lib/celestia-mon /var/cache/celestia-mon /var/log/celestia-mon \
                   /usr/local/bin/celestia-mon-doctor /var/tmp/celestia-mon-install; do
            if sudo test -e "$p"; then echo "$p left"; left=1; fi
          done
          added=$(sudo ufw show added)
          if [ "$(grep -c "comment 'celestia-mon'" <<<"$added")" != 1 ]; then echo "ufw rules with the comment celestia-mon changed"; left=1; fi
          grep -qx "ufw allow from 10.255.255.2 to any port 9910 proto tcp comment 'celestia-mon'" <<<"$added" ||
            { echo "purge removed a rule that was there before the install"; left=1; }
          grep -qx 'ufw allow 22/tcp' <<<"$added" || { echo "purge touched another ufw rule"; left=1; }
          exit "$left"
      - name: A second purge changes nothing
        run: |
          sudo bash ./install.sh --uninstall --purge --host ci --yes | tee "$RUNNER_TEMP/again-purge.log"
          grep -qF 'celestia-mon is removed from ci (0 change(s)).' "$RUNNER_TEMP/again-purge.log"
      - name: Show the service logs
        if: failure()
        run: sudo journalctl -u 'celestia-mon-*' --no-pager -n 200

  molecule:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/ci/pins.py >> "$GITHUB_ENV"
      # community.docker and ansible.posix are for molecule's docker driver only; the roles use ansible.builtin.
      - name: Install molecule
        run: |
          pip install "ansible-core==$ANSIBLE_CORE_VERSION" "molecule>=26.8,<27" "molecule-plugins[docker]>=26.7,<27"
          ansible-galaxy collection install "community.docker:>=4.0.0,<6.0.0" "ansible.posix:>=1.6.0,<3.0.0"
      - name: molecule test
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
