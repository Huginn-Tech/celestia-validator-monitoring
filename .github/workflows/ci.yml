name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: ansible/ansible.cfg
  ANSIBLE_ROLES_PATH: ansible/roles

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18,<2.19" "ansible-lint>=25,<26" "yamllint>=1.35,<2"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint --strict .
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(tools/*.sh)
          if [ ${#files[@]} -gt 0 ]; then shellcheck "${files[@]}"; fi

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Owner-only files are ignored and absent
        run: |
          git check-ignore -q --no-index reference/any-file || { echo "reference/ is not in .gitignore"; exit 1; }
          git check-ignore -q --no-index CLAUDE.local.md || { echo "CLAUDE.local.md is not in .gitignore"; exit 1; }
          if [ -n "$(git ls-files reference CLAUDE.local.md)" ]; then
            echo "owner-only files are tracked"; exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
