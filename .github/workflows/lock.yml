name: lock

# Generates ansible/requirements.lock, the only source install.sh installs Ansible from:
# ansible-core at the ansible_core pin in versions.yml and every package it needs, resolved
# with the pinned uv for Python 3.12 and later on every platform (--universal), from PyPI
# files uploaded before python_deps_before (so the same pins always give the same lock), with
# the sha256 of each file (--generate-hashes). It checks that the lock installs with
# --require-hashes on x86_64 and holds the aarch64 wheels, and uploads it as the artifact
# requirements-lock. It changes nothing in the repository: commit that file as
# ansible/requirements.lock.
# Run it by hand (Actions > lock > Run workflow) after changing ansible_core,
# python_deps_before or uv in versions.yml. It also runs on pull requests that change
# versions.yml or this file, so a lock can be made before the workflow is on main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - versions.yml
      - .github/workflows/lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      UV_NO_CONFIG: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the pins
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - >>"$GITHUB_ENV" <<'EOF'
          import yaml
          with open("versions.yml", encoding="utf-8") as f:
              pins = yaml.safe_load(f)["celestia_mon_versions"]
          print("UV_VERSION=" + pins["uv"]["version"])
          print("UV_SHA256=" + pins["uv"]["sha256"]["x86_64"])
          print("ANSIBLE_CORE=" + pins["ansible_core"])
          print("DEPS_BEFORE=" + pins["python_deps_before"])
          EOF
      - name: Install the pinned uv, checked against its sha256 in versions.yml
        run: |
          tarball=uv-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$RUNNER_TEMP/uv"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/$tarball"
          echo "$UV_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/uv" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "$RUNNER_TEMP/uv" >>"$GITHUB_PATH"
      - name: Resolve ansible-core and every package it needs
        run: |
          mkdir -p "$RUNNER_TEMP/lock"
          cd "$RUNNER_TEMP/lock"
          echo "ansible-core==$ANSIBLE_CORE" >requirements.in
          uv pip compile requirements.in --universal --python-version 3.12 --generate-hashes --only-binary :all: \
            --exclude-newer "$DEPS_BEFORE" --no-header --output-file compiled.txt
          {
            echo "# ansible-core and every package it needs, for install.sh. Generated by the lock workflow"
            echo "# (.github/workflows/lock.yml) from ansible_core and python_deps_before in versions.yml,"
            echo "# resolved for Python 3.12 and later on every platform, with the sha256 of each file PyPI has"
            echo "# for every pinned version (the cp312 manylinux wheels for x86_64 and aarch64 among them)."
            echo "# install.sh installs from it with --require-hashes and wheels only. Do not edit it by hand:"
            echo "# run the workflow (GitHub Actions > lock > Run workflow) and commit the requirements.lock"
            echo "# it uploads."
            echo "#"
            echo "# ansible-core $ANSIBLE_CORE; PyPI files uploaded before $DEPS_BEFORE; uv $UV_VERSION."
            echo
            cat compiled.txt
          } >requirements.lock
          cat requirements.lock
      - name: Upload the lock
        uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: ${{ runner.temp }}/lock/requirements.lock
          if-no-files-found: error
      - name: The lock installs on x86_64 with hashes required and wheels only
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --require-hashes --only-binary :all: \
            -r "$RUNNER_TEMP/lock/requirements.lock"
          "$RUNNER_TEMP/venv/bin/ansible-playbook" --version
      - name: The lock holds the aarch64 wheels
        run: |
          uv pip install --target "$RUNNER_TEMP/aarch64" --python "$(command -v python)" --python-platform aarch64-manylinux_2_39 \
            --require-hashes --only-binary :all: -r "$RUNNER_TEMP/lock/requirements.lock"
      - name: Compare with the committed lock
        run: |
          if cmp -s "$RUNNER_TEMP/lock/requirements.lock" ansible/requirements.lock; then
            msg="ansible/requirements.lock matches the lock made from versions.yml."
          else
            msg="ansible/requirements.lock differs from the lock made from versions.yml: commit the artifact requirements-lock as it."
            diff -u ansible/requirements.lock "$RUNNER_TEMP/lock/requirements.lock" || true
          fi
          echo "$msg"
          echo "$msg" >>"$GITHUB_STEP_SUMMARY"
