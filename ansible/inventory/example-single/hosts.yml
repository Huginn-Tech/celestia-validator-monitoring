---
# One host runs the validator (local key, Fibre off) and the monitoring stack.
# Install with, on that host: sudo ./install.sh --inventory <this file> --host node-1 --ask-vault-pass
# The address is an example; use the host's private, WireGuard or Tailscale address.
# It must be an address of the host itself: install.sh checks it.
all:
  hosts:
    node-1:
      celestia_mon_private_ip: 10.10.0.11
      # The mount points DiskLow watches (findmnt -T <path> names the one that holds a path):
      # here the node data has a disk of its own.
      celestia_mon_data_mounts:
        - /var/lib/celestia
      # Optional: upgrade signalling (docs/quickstart.md#upgrade-signalling), read through this
      # host's node first, a public RPC while it is down.
      # celestia_mon_signal:
      #   chain_id: celestia
      #   rpc:
      #     - http://127.0.0.1:26657
      #     - https://rpc.celestia.pops.one
      #   validator: celestiavaloper1...
  children:
    validator:
      hosts:
        node-1:
    monitor:
      hosts:
        node-1:
