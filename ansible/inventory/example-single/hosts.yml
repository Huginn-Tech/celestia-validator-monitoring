---
# One host runs the validator (local key, Fibre off) and the monitoring stack.
# Install with, on that host: sudo ./install.sh --inventory <this file> --host node-1 --ask-vault-pass
# The address is an example; use the host's private, WireGuard or Tailscale address.
# It must be an address of the host itself: install.sh checks it.
all:
  hosts:
    node-1:
      celestia_mon_private_ip: 10.10.0.11
      celestia_mon_data_mounts:
        - /var/lib/celestia
  children:
    validator:
      hosts:
        node-1:
    monitor:
      hosts:
        node-1:
