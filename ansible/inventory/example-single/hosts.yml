---
# One host runs the validator (local key, Fibre off) and the monitoring stack.
# Addresses are examples; use your host's private or WireGuard address.
all:
  hosts:
    node-1:
      ansible_host: 10.10.0.11
      celestia_mon_private_ip: 10.10.0.11
      celestia_mon_data_mounts:
        - /var/lib/celestia
  children:
    validator:
      hosts:
        node-1:
    monitor:
      hosts:
        node-1:
