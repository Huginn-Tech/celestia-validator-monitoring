---
# Secrets of the monitor host (Alertmanager receivers, the dead-man URL, the Grafana
# password). Only the monitor host needs this file. Replace the placeholders, then
# encrypt the whole file: ansible-vault encrypt host_vars/node-1/vault.yml
# (install.sh refuses a vault.yml that is not encrypted).
# Receivers: one list. Page alerts go to every receiver, message alerts to every receiver
# except PagerDuty. Types: telegram, discord, slack, pagerduty, webhook (docs/alerts.md).
celestia_mon_receivers:
  - type: telegram
    bot_token: "000000000:REPLACE_ME"
    chat_id: -1000000000000

# Required: the https ping URL of your dead-man check (docs/quickstart.md, step 8).
celestia_mon_deadman_webhook_url: "https://deadman.example.invalid/ping/REPLACE_ME"
# At least 16 characters, for example from: openssl rand -base64 18
celestia_mon_grafana_admin_password: "REPLACE_ME"

# Optional, with celestia_mon_announcements in the inventory (docs/alerts.md#celestiaannouncement):
# the token of the Discord bot that reads Celestia's announcements.
# celestia_mon_discord_bot_token: "REPLACE_ME"
