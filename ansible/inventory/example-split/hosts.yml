---
# Validator, KMS (tmkms) and Fibre on separate hosts, monitoring on a fourth.
# Copy the repository with this inventory to each host and run, on that host:
#   sudo ./install.sh --inventory <this file> --host <its name below>
# (add --ask-vault-pass on mon-1, whose host_vars hold the encrypted secrets).
# Nothing needs to run on kms-1 unless celestia_mon_kms_scrape is true.
# Addresses are examples; use each host's private, WireGuard or Tailscale address.
# Each must be an address of that host itself: install.sh checks it.
all:
  hosts:
    val-1:
      celestia_mon_private_ip: 10.10.0.1
      # The mount points DiskLow watches (findmnt -T <path> names the one that holds a path):
      # here the node data has a disk of its own.
      celestia_mon_data_mounts:
        - /var/lib/celestia
    kms-1:
      celestia_mon_private_ip: 10.10.0.2
      # Installs node_exporter here, which watches this host's disks. Remove this line to leave the
      # KMS host untouched (the default); nothing watches its disks then.
      celestia_mon_kms_scrape: true
      # A mount point (findmnt -T <path>).
      celestia_mon_data_mounts:
        - /
    fibre-1:
      # In this layout fibre-1 runs no node: its Fibre reads val-1's node over the private network
      # and signs through it, which celestia-mon never sets up. On the Celestia side:
      # Fibre's app_grpc_address = "10.10.0.1:9090" and signer_grpc_address = "10.10.0.1:26669"
      # with mTLS; on val-1, [grpc] address = "10.10.0.1:9090" in app.toml and
      # priv_validator_grpc_laddr = "10.10.0.1:26669" with its three TLS files, each port open to
      # fibre-1 only (ufw allow from 10.10.0.3 to any port 9090 proto tcp, and 26669 the same way).
      # docs/security.md#ports-on-the-validator-who-connects-to-what has each setting and ufw rule.
      celestia_mon_private_ip: 10.10.0.3
      celestia_mon_fibre_mount: /var/lib/fibre
      celestia_mon_fibre_public_endpoint: "fibre.example.org:7980"
      # A mount point (findmnt -T <path>); the Fibre store has its own disk.
      celestia_mon_data_mounts:
        - /
      # Optional: the link speed you pay for in Mbit/s, for the dashboard's Network peak.
      # celestia_mon_link_mbps: 1000
    mon-1:
      celestia_mon_private_ip: 10.10.0.4
      # The mount point that holds Prometheus's data (findmnt -T /var/lib/celestia-mon), which
      # DiskLow watches.
      celestia_mon_data_mounts:
        - /
      # Optional: upgrade signalling (docs/quickstart.md#upgrade-signalling). This host runs no
      # node: list a node RPC it can reach first, then a public RPC. val-1's RPC listens on
      # 127.0.0.1 by default: set laddr in the [rpc] section of its config.toml to its private
      # address and let this host reach port 26657 there (firewall, tailnet policy), yourself.
      # Nothing answers on val-1's 127.0.0.1 then: doctor there follows laddr, and celestia-appd
      # commands there need --node http://10.10.0.1:26657 (or node in its client.toml).
      # celestia_mon_signal:
      #   chain_id: celestia
      #   rpc:
      #     - http://10.10.0.1:26657
      #     - https://rpc.celestia.pops.one
      #   validator: celestiavaloper1...
  children:
    validator:
      hosts:
        val-1:
    kms:
      hosts:
        kms-1:
    fibre:
      hosts:
        fibre-1:
    monitor:
      hosts:
        mon-1:
