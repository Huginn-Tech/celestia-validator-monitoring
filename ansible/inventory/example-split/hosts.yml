---
# Validator, KMS (tmkms) and Fibre on separate hosts, monitoring on a fourth.
# Copy the repository with this inventory to each host and run, on that host:
#   sudo ./install.sh --inventory <this file> --host <its name below>
# (add --ask-vault-pass on mon-1, whose host_vars hold the encrypted secrets).
# Nothing needs to run on kms-1 unless celestia_mon_kms_scrape is true.
# Addresses are examples; use each host's private, WireGuard or Tailscale address.
# Each must be an address of that host itself: install.sh checks it.
all:
  hosts:
    val-1:
      celestia_mon_private_ip: 10.10.0.1
      celestia_mon_data_mounts:
        - /var/lib/celestia
    kms-1:
      celestia_mon_private_ip: 10.10.0.2
      celestia_mon_kms_scrape: true
      celestia_mon_data_mounts:
        - /
    fibre-1:
      celestia_mon_private_ip: 10.10.0.3
      celestia_mon_fibre_mount: /var/lib/fibre
      celestia_mon_fibre_public_endpoint: "fibre.example.org:7980"
      celestia_mon_data_mounts:
        - /
      # Optional: the link speed you pay for in Mbit/s, for the Link load panel.
      # celestia_mon_link_mbps: 1000
    mon-1:
      celestia_mon_private_ip: 10.10.0.4
  children:
    validator:
      hosts:
        val-1:
    kms:
      hosts:
        kms-1:
    fibre:
      hosts:
        fibre-1:
    monitor:
      hosts:
        mon-1:
