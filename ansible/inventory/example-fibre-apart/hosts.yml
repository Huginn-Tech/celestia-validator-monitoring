---
# Fibre and the node it reads on separate hosts: three hosts run the Celestia services, a fourth
# holds only the signer and a fifth the monitoring.
#   val-1    the validator node (celestia-appd without a key; tmkms on kms-1 signs through it)
#            and a standby Fibre that reads it: installed, stopped, port 7980 closed
#   fibre-1  the active Fibre, with no node on its host
#   node-1   the node that Fibre reads: a synced celestia-appd node without a key that can also
#            take over signing (backup_node); its unit has another name here (celestia.service)
#   kms-1    tmkms only; celestia-mon installs nothing there
#   mon-1    the monitoring stack, on a host of its own
# In this layout Fibre on fibre-1 reads node-1 over the private network and signs through the node
# tmkms serves. celestia-mon changes none of this; set it on the Celestia side:
#   val-1    priv_validator_grpc_laddr = "10.30.0.1:26669" in its config.toml with its three TLS
#            files, and port 26669 open to fibre-1 only (ufw allow from 10.30.0.2 to any port 26669
#            proto tcp). Its standby Fibre reads the node beside it on 127.0.0.1:9090.
#   node-1   [grpc] address = "10.30.0.3:9090" in its app.toml, and port 9090 open to fibre-1 only
#            (ufw allow from 10.30.0.2 to any port 9090 proto tcp). Ahead of a tmkms repoint,
#            priv_validator_grpc_laddr = "10.30.0.3:26669" in its config.toml with its three TLS
#            files, and port 26669 open to both Fibre hosts, fibre-1 and val-1, only.
#   fibre-1  app_grpc_address = "10.30.0.3:9090", and signer_grpc_address at the node tmkms serves
#            with mTLS: "10.30.0.1:26669" (val-1), node-1's after a repoint.
# docs/security.md#ports-on-the-validator-who-connects-to-what has each setting and ufw rule.
# Fibre starts only while the node it reads and the node it signs through both answer. When you
# stop node-1, silence fibre-1 too: FibreNotServing (not_ready) names fibre-1, and Fibre there
# cannot restart until node-1 is back.
# Four servers and the signer's column make five: the dashboard's first screen shows the Servers
# now table instead of a card per server.
# Which Fibre runs and which node signs are read from systemd and the node metrics, never from
# this file: after a Fibre failover or a tmkms repoint, leave it as it is.
# Put this folder at ~/celestia-mon-inventory on val-1, fibre-1, node-1 and mon-1 and run, on each:
#   sudo ./install.sh
# It finds the host by its celestia_mon_private_ip below. The secrets stay on mon-1: sudo
# ./install.sh --edit-secrets there, or host_vars/mon-1/vault.yml, encrypted, on mon-1 only.
# docs/layouts.md#fibre-and-the-node-it-reads-on-separate-boxes describes this layout.
# Addresses are examples; use each host's WireGuard address (or a private or Tailscale one).
# Each must be an address of that host itself: install.sh checks it.
all:
  hosts:
    val-1:
      celestia_mon_private_ip: 10.30.0.1
      # The mount points DiskLow watches (findmnt -T <path> names the one that holds a path):
      # one RAID1 filesystem holds the node data and the standby Fibre's store.
      celestia_mon_data_mounts:
        - /
      celestia_mon_fibre_mount: /
      # What valaddr set-host registers when this host's Fibre is the active one.
      celestia_mon_fibre_public_endpoint: "val.example.org:7980"
    fibre-1:
      celestia_mon_private_ip: 10.30.0.2
      # A mount point (findmnt -T <path>); the Fibre store has its own disk.
      celestia_mon_data_mounts:
        - /
      celestia_mon_fibre_mount: /var/lib/fibre
      celestia_mon_fibre_public_endpoint: "fibre.example.org:7980"
      # Optional: the link speed you pay for in Mbit/s, for the dashboard's Network peak.
      # celestia_mon_link_mbps: 1000
    node-1:
      celestia_mon_private_ip: 10.30.0.3
      # The mount point of the node's data (findmnt -T <path>).
      celestia_mon_data_mounts:
        - /
      # This host's unit names, without .service: its celestia-appd runs as celestia.service. A map
      # set here replaces the whole default, so it names all three. The alert rules and the
      # dashboard watch each host under its own names.
      celestia_mon_units:
        appd: celestia
        fibre: fibre
        tmkms: tmkms
    kms-1:
    mon-1:
      celestia_mon_private_ip: 10.30.0.4
      # The mount point of Prometheus's data (/var/lib/celestia-mon), which DiskLow watches
      # (findmnt -T /var/lib/celestia-mon).
      celestia_mon_data_mounts:
        - /
  children:
    validator:
      hosts:
        val-1:
    backup_node:
      hosts:
        node-1:
    fibre:
      hosts:
        fibre-1:
        val-1:
    kms:
      hosts:
        kms-1:
    monitor:
      hosts:
        mon-1:
