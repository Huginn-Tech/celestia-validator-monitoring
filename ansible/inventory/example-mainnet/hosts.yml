---
# Two hosts run the Celestia services, a third holds only the signer and a fourth the monitoring.
#   val-1    the validator node (celestia-appd without a key; tmkms on kms-1 signs through it)
#            and a standby Fibre that reads it: installed, stopped, port 7980 closed
#   fibre-1  the active Fibre and the node it reads: a synced celestia-appd node without a key
#            that can also take over signing (backup_node)
# In this layout each Fibre reads the app gRPC of the node on its own host
# (app_grpc_address = 127.0.0.1:9090), so no host opens port 9090 to another; example-fibre-apart
# puts Fibre and the node it reads on separate hosts.
#   kms-1    tmkms only; celestia-mon installs nothing there
#   mon-1    the monitoring stack, on a host of its own; it may sit in another data centre, as
#            long as it reaches the others through WireGuard (docs/security.md#wireguard-only-link)
# Which Fibre runs and which node signs are read from systemd and the node metrics, never from
# this file: after a Fibre failover or a tmkms repoint, leave it as it is.
# Copy the repository with this inventory to val-1, fibre-1 and mon-1 and run, on each:
#   sudo ./install.sh --inventory <this file> --host <its name below>
# (add --ask-vault-pass on mon-1, whose host_vars hold the encrypted secrets).
# Addresses are examples; use each host's WireGuard address (or a private or Tailscale one).
# Each must be an address of that host itself: install.sh checks it.
all:
  hosts:
    val-1:
      celestia_mon_private_ip: 10.20.0.1
      # The mount points DiskLow watches (findmnt -T <path> names the one that holds a path):
      # one RAID1 filesystem holds the node data and the standby Fibre's store.
      celestia_mon_data_mounts:
        - /
      celestia_mon_fibre_mount: /
      # What valaddr set-host registers when this host's Fibre is the active one.
      celestia_mon_fibre_public_endpoint: "val.example.org:7980"
    fibre-1:
      celestia_mon_private_ip: 10.20.0.2
      # The mount point of the backup node's data (findmnt -T <path>); the Fibre store has its own disk.
      celestia_mon_data_mounts:
        - /
      celestia_mon_fibre_mount: /var/lib/fibre
      celestia_mon_fibre_public_endpoint: "fibre.example.org:7980"
      # Optional: the link speed you pay for in Mbit/s, for the dashboard's Network peak.
      # celestia_mon_link_mbps: 1000
    kms-1:
    mon-1:
      celestia_mon_private_ip: 10.20.0.3
      # The mount point that holds Prometheus's data (findmnt -T /var/lib/celestia-mon), which
      # DiskLow watches.
      celestia_mon_data_mounts:
        - /
      # Optional: upgrade signalling (docs/quickstart.md#upgrade-signalling). This host runs no
      # node, so it reads public RPCs over https, and no host opens a port for it. Reading the
      # backup node on fibre-1 first, through WireGuard, needs changes on fibre-1 (the same
      # section of the quickstart).
      # celestia_mon_signal:
      #   chain_id: celestia
      #   rpc:
      #     - https://rpc.celestia.pops.one
      #     - https://public-celestia-rpc.numia.xyz
      #   validator: celestiavaloper1...
  children:
    validator:
      hosts:
        val-1:
    backup_node:
      hosts:
        fibre-1:
    fibre:
      hosts:
        fibre-1:
        val-1:
    kms:
      hosts:
        kms-1:
    monitor:
      hosts:
        mon-1:
