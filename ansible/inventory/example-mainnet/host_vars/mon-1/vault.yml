---
# Secrets of the monitor host (Alertmanager receivers, the dead-man URL). Only mon-1 needs
# this file: keep it off the other hosts. Replace the placeholders, then encrypt the whole
# file (install.sh refuses a vault.yml that is not encrypted):
#   sudo ./install.sh --edit-vault ~/celestia-mon-inventory/host_vars/mon-1/vault.yml
# Or keep these lines on mon-1 instead, outside the inventory: sudo ./install.sh
# --edit-secrets there writes /etc/celestia-mon/secrets.yml (root only), and this file goes;
# the inventory is then the same on every host. Not both.
# Receivers: one list. Page alerts go to every receiver, message alerts to every receiver
# except PagerDuty. Types: telegram, discord, slack, pagerduty, webhook (docs/alerts.md).
celestia_mon_receivers:
  - type: pagerduty
    routing_key: "REPLACE_ME"
  - type: telegram
    bot_token: "000000000:REPLACE_ME"
    chat_id: -1000000000000

# Required: the https ping URL of your dead-man check, which alerts you when the pings stop.
celestia_mon_deadman_webhook_url: "https://deadman.example.invalid/ping/REPLACE_ME"
# Optional: Grafana's admin password, at least 16 characters (for example from: openssl rand -base64 18).
# Without it, the install generates one: sudo cat /etc/celestia-mon/grafana-admin-password
# celestia_mon_grafana_admin_password: "REPLACE_ME"

# Optional, with celestia_mon_announcements in the inventory (docs/alerts.md#celestiaannouncement):
# the token of the Discord bot that reads Celestia's announcements.
# celestia_mon_discord_bot_token: "REPLACE_ME"
