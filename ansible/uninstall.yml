---
# Removes what celestia-mon installed on a host, and nothing else:
#   - the celestia-mon-* systemd units (stopped, disabled, unit files removed),
#   - /opt/celestia-mon (the binaries), /var/cache/celestia-mon and /usr/local/bin/celestia-mon-doctor,
#   - the settings files that hold secrets: Alertmanager's config (receiver tokens, the dead-man
#     URL), Grafana's admin password and datasource, and the API passwords; a reinstall writes
#     them again from the inventory (new API passwords),
#   - the ufw rules the install recorded in /var/lib/celestia-mon/firewall-added.json, each one
#     only while `ufw show added` lists it with the recorded source, port, protocol and the
#     comment celestia-mon. A rule that was there before the install is never recorded.
# It keeps Prometheus's and Grafana's data (/var/lib/celestia-mon), the other settings
# (/etc/celestia-mon) and the celestia-mon-* system users and groups, so a reinstall picks up
# where it left off. With celestia_mon_uninstall_purge=true (install.sh --uninstall --purge)
# it removes those too. It stops before removing a unit file while another service's unit file
# changed on disk and systemd has not loaded it: the systemd reload after the removal would load it.
# celestia-appd, Fibre, tmkms and every other service, user, file and firewall rule stay
# as they are. A second run changes nothing. install.sh --uninstall runs it on the host
# itself for that host only, first as a dry run. It reads no inventory settings, so
# install.sh needs neither the inventory nor the vault password for it. By hand, from ansible/:
#   ansible-playbook -i <inventory> uninstall.yml --limit <host> --check [-e celestia_mon_uninstall_purge=true]
- name: Remove celestia-mon
  hosts: all
  become: true
  gather_facts: false
  vars:
    celestia_mon_uninstall_purge: false
    # celestia_mon_firewall_record of the celestia_mon role.
    celestia_mon_uninstall_record: /var/lib/celestia-mon/firewall-added.json
    # Removed on every uninstall: the binaries, and the settings files that hold secrets
    # (celestia_mon_api_password_file, celestia_mon_api_grafana_password_file and the files of the
    # alertmanager, grafana and announcements roles).
    celestia_mon_uninstall_paths:
      - /opt/celestia-mon
      - /var/cache/celestia-mon
      - /usr/local/bin/celestia-mon-doctor
      - /etc/celestia-mon/alertmanager/alertmanager.yml
      - /etc/celestia-mon/grafana/admin-password
      - /etc/celestia-mon/grafana/provisioning/datasources/celestia-mon.yml
      - /etc/celestia-mon/api-password
      - /etc/celestia-mon/grafana-api-password
      - /etc/celestia-mon/announcements/discord-token
    # Removed only with celestia_mon_uninstall_purge.
    celestia_mon_uninstall_purge_paths:
      - /var/lib/celestia-mon
      - /etc/celestia-mon
      # install.sh keeps the output of the last install there.
      - /var/log/celestia-mon
    # The units celestia-mon installs, plus any other celestia-mon-* unit file or drop-in directory.
    celestia_mon_uninstall_units: >-
      {{ (['celestia-mon-node-exporter.service', 'celestia-mon-otelcol.service', 'celestia-mon-prometheus.service',
           'celestia-mon-alertmanager.service', 'celestia-mon-grafana.service', 'celestia-mon-announcements.service',
           'celestia-mon-tensile.service']
          + (celestia_mon_uninstall_unit_files.files | map(attribute='path') | map('basename') | map('regex_replace', '[.]d$', '')
             | select('match', '.*[.]service$') | list)) | unique }}
    celestia_mon_uninstall_loaded: >-
      {{ celestia_mon_uninstall_unit_state.results | rejectattr('status.LoadState', 'equalto', 'not-found') | list }}
    celestia_mon_uninstall_users: >-
      {{ ansible_facts.getent_passwd | default({}) | dict2items | map(attribute='key') | select('match', 'celestia-mon-') | list }}
    celestia_mon_uninstall_groups: >-
      {{ ansible_facts.getent_group | default({}) | dict2items | map(attribute='key') | select('match', 'celestia-mon-') | list }}
    celestia_mon_uninstall_existing: "{{ celestia_mon_uninstall_found.results | selectattr('stat.exists') | map(attribute='item') | list }}"
    # The recorded rules ({source, port, proto, comment}) with the comment celestia-mon.
    celestia_mon_uninstall_recorded: >-
      {{ (celestia_mon_uninstall_record_file.content | b64decode | from_json | selectattr('comment', 'equalto', 'celestia-mon') | list)
         if celestia_mon_uninstall_record_file.content is defined else [] }}
    # The same rules as [source, port, proto, comment].
    celestia_mon_uninstall_recorded_rules: >-
      {{ celestia_mon_uninstall_recorded | map(attribute='source') | map('string')
         | zip(celestia_mon_uninstall_recorded | map(attribute='port') | map('string'),
               celestia_mon_uninstall_recorded | map(attribute='proto') | map('string'),
               celestia_mon_uninstall_recorded | map(attribute='comment') | map('string'))
         | map('list') | list }}
    # `ufw show added` prints each rule as a command: "ufw allow from <ip> to any port <p> proto tcp comment 'celestia-mon'".
    celestia_mon_uninstall_live_rules: >-
      {{ celestia_mon_uninstall_ufw.stdout | default('')
         | regex_findall("^ufw allow from ([^ ]+) to any port ([0-9]+) proto ([a-z]+) comment '([^']*)'$", multiline=true)
         | map('list') | list }}
    # The rules uninstall deletes: recorded at install, and listed by ufw now with all four the same.
    celestia_mon_uninstall_rules: "{{ celestia_mon_uninstall_recorded_rules | select('in', celestia_mon_uninstall_live_rules) | list }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

  tasks:
    # install.sh runs the playbook on the host itself (ansible_connection=local) for one host,
    # with the inventory "<host>," because nothing here reads inventory settings or secrets.
    - name: Check that a local run targets one inventory host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == (celestia_mon_install_host | default(inventory_hostname))
        fail_msg: >-
          A local run (ansible_connection=local) must be limited to the one inventory host this machine is
          (install.sh --host, or ansible-playbook --limit), named as in the inventory's host list, not by a group.
          This run targets {{ ansible_play_hosts_all | join(', ') }}.
        quiet: true
      when: ansible_connection | default('ssh') == 'local'

    # Unit files, drop-in directories, and the links in *.wants/ that disabling would remove.
    - name: Find celestia-mon's unit files
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: celestia-mon-*
        file_type: any
        recurse: true
        depth: 2
      register: celestia_mon_uninstall_unit_files

    # With only a name the module just reads the unit; a unit systemd does not know has LoadState not-found.
    - name: Read the state of celestia-mon's units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ celestia_mon_uninstall_units }}"
      register: celestia_mon_uninstall_unit_state

    - name: Read the users and groups
      ansible.builtin.getent:
        database: "{{ item }}"
      loop:
        - passwd
        - group

    - name: Look for celestia-mon's files
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop: "{{ celestia_mon_uninstall_paths + celestia_mon_uninstall_purge_paths }}"
      register: celestia_mon_uninstall_found

    # A missing file means the install added no ufw rule here.
    - name: Read the record of the ufw rules the install added
      ansible.builtin.slurp:
        src: "{{ celestia_mon_uninstall_record }}"
      register: celestia_mon_uninstall_record_file
      failed_when: false

    - name: Read the ufw rules
      ansible.builtin.command: ufw show added
      environment:
        LC_ALL: C
      register: celestia_mon_uninstall_ufw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Write the removal plan for this host
      ansible.builtin.copy:
        dest: "{{ celestia_mon_plan_file }}"
        content: |
          Host:      {{ inventory_hostname }}
          Services:  {{ celestia_mon_uninstall_loaded | map(attribute='item') | join(', ') or 'none' }}
          Files:     {{ celestia_mon_uninstall_existing | select('in', celestia_mon_uninstall_paths) | join(', ') or 'none' }}
          ufw rules: {{ celestia_mon_uninstall_rules_text }}
          {% if celestia_mon_uninstall_unmatched %}
          ufw kept:  {{ celestia_mon_uninstall_unmatched_text }}
                     (recorded at install, but ufw lists no such rule with the comment celestia-mon now)
          {% endif %}
          {% if celestia_mon_uninstall_purge | bool %}
          Purge:     {{ (celestia_mon_uninstall_existing | select('in', celestia_mon_uninstall_purge_paths) | list
                         + celestia_mon_uninstall_users + celestia_mon_uninstall_groups) | unique | join(', ') or 'none' }}
          {% else %}
          Kept:      {{ (celestia_mon_uninstall_existing | select('in', celestia_mon_uninstall_purge_paths) | list
                         + celestia_mon_uninstall_users) | join(', ') or 'none' }}
                     (data, settings without the files that hold secrets, and users, so a reinstall picks up
                     where it left off; --purge deletes them)
          {% endif %}
        mode: "0600"
      changed_when: false
      check_mode: false
      diff: false
      when: celestia_mon_plan_file is defined
      vars:
        # Folded: the line break becomes the space before "(comment".
        celestia_mon_uninstall_rules_text: >-
          {% for r in celestia_mon_uninstall_rules %}allow from {{ r[0] }} to port {{ r[1] }}/{{ r[2] }}
          (comment {{ r[3] }}){{ '' if loop.last else '; ' }}{% else %}none{% endfor %}
        # Recorded rules ufw no longer lists as recorded (deleted or changed by hand): left as they are.
        celestia_mon_uninstall_unmatched: "{{ celestia_mon_uninstall_recorded_rules | reject('in', celestia_mon_uninstall_live_rules) | list }}"
        celestia_mon_uninstall_unmatched_text: >-
          {% for r in celestia_mon_uninstall_unmatched %}allow from {{ r[0] }}
          to port {{ r[1] }}/{{ r[2] }}{{ '' if loop.last else '; ' }}{% endfor %}

    # Removing celestia-mon's unit files reloads systemd, which would also load staged edits to
    # the Celestia services' units. This playbook reads no inventory: it takes their names from
    # the doctor settings the install wrote, plus the default names.
    - name: Read the Celestia service names the install recorded
      ansible.builtin.slurp:
        src: /etc/celestia-mon/doctor.conf
      register: celestia_mon_uninstall_doctor_conf
      failed_when: false

    - name: Check that systemd has loaded the Celestia services' unit files
      ansible.builtin.include_tasks: roles/celestia_mon/tasks/reload_check.yml
      vars:
        celestia_mon_reload_check_units: >-
          {{ (['celestia-appd', 'fibre', 'tmkms']
              + (celestia_mon_uninstall_doctor_conf.content | default('') | b64decode
                 | regex_findall('^(?:appd|fibre)_unit=([A-Za-z0-9@._-]+)$', multiline=true)))
             | map('regex_replace', '$', '.service') | unique | list
             if celestia_mon_uninstall_unit_files.files | length > 0 else [] }}

    - name: Stop and disable celestia-mon's units
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
      loop: "{{ celestia_mon_uninstall_loaded }}"
      loop_control:
        label: "{{ item.item }}"

    # A unit that failed keeps that state after a stop, and systemd would list it until a reboot.
    - name: Clear the failed state of celestia-mon's units
      ansible.builtin.command:
        argv: [systemctl, reset-failed, "{{ item.item }}"]
      changed_when: true
      loop: "{{ celestia_mon_uninstall_loaded | selectattr('status.ActiveState', 'equalto', 'failed') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Remove celestia-mon's unit files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ celestia_mon_uninstall_unit_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Reload systemd

    - name: Apply a pending systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Remove celestia-mon's binaries, cache and the settings files that hold secrets
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ celestia_mon_uninstall_paths }}"

    # Deleting by the rule itself, not by number, so other rules and their order stay as they are.
    - name: Remove the ufw rules the install added
      ansible.builtin.command:
        argv: [ufw, delete, allow, from, "{{ item[0] }}", to, any, port, "{{ item[1] }}", proto, "{{ item[2] }}"]
      environment:
        LC_ALL: C
      register: celestia_mon_uninstall_deleted
      changed_when: celestia_mon_uninstall_deleted.stdout is search('Rule deleted|Rules updated')
      loop: "{{ celestia_mon_uninstall_rules }}"
      loop_control:
        label: allow from {{ item[0] }} to any port {{ item[1] }} proto {{ item[2] }}

    - name: List the ufw rules a real run removes
      ansible.builtin.debug:
        msg: ufw delete allow from {{ item[0] }} to any port {{ item[1] }} proto {{ item[2] }}
      changed_when: true
      loop: "{{ celestia_mon_uninstall_rules }}"
      when: ansible_check_mode

    # The recorded rules are deleted now, or were gone already: none of them is celestia-mon's any more.
    - name: Remove the record of the ufw rules
      ansible.builtin.file:
        path: "{{ celestia_mon_uninstall_record }}"
        state: absent

    - name: Remove celestia-mon's data, settings, users and groups (--purge)
      when: celestia_mon_uninstall_purge | bool
      block:
        - name: Remove celestia-mon's users
          ansible.builtin.user:
            name: "{{ item }}"
            state: absent
          loop: "{{ celestia_mon_uninstall_users }}"

        # userdel usually removes a user's own group; this catches the rest.
        - name: Remove celestia-mon's groups
          ansible.builtin.group:
            name: "{{ item }}"
            state: absent
          loop: "{{ celestia_mon_uninstall_groups }}"

        - name: Remove celestia-mon's data and settings
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ celestia_mon_uninstall_purge_paths }}"
