---
# Installs celestia-mon. install.sh runs it on each host for that host only
# (--limit <host> -e ansible_connection=local), first as a dry run (--check --diff).
- name: Check the inventory and this host
  hosts: all
  become: true
  # Facts are read in the preflight, after the skip below, so a KMS host celestia-mon does not manage is never contacted.
  gather_facts: false
  vars_files:
    - ../versions.yml
  roles:
    - role: celestia_mon
  tasks:
    - name: Skip hosts celestia-mon does not manage
      ansible.builtin.meta: end_host
      when: not (celestia_mon_host_managed | bool)

    # Read-only. Includes the local-run guard: a run with ansible_connection=local must target
    # one inventory host, and that host's celestia_mon_private_ip must be an address of this machine.
    - name: Run the preflight checks
      ansible.builtin.include_role:
        name: celestia_mon
        tasks_from: preflight

# hosts: all, not a pattern of the groups: an inventory without backup nodes (or without a kms
# host) would make Ansible warn about each group it does not define. node_exporter runs on every
# host celestia-mon manages, a host that is only the monitor too: its disk, CPU and memory are
# watched like the others'.
- name: Collectors
  hosts: all
  become: true
  # Facts are gathered after the skip below, so a KMS host celestia-mon does not manage is never contacted.
  gather_facts: false
  vars_files:
    - ../versions.yml
  tasks:
    - name: Load the shared settings
      ansible.builtin.include_role:
        name: celestia_mon
        public: true

    - name: Skip hosts celestia-mon does not manage
      ansible.builtin.meta: end_host
      when: not (celestia_mon_host_managed | bool)

    - name: Gather facts on the hosts celestia-mon manages
      ansible.builtin.setup:

    # One host, one install: the monitor this host is installed for, which the preflight of
    # every later run compares with the inventory's. --uninstall keeps it, --purge deletes it.
    - name: Create the directory of the install record
      ansible.builtin.file:
        path: /var/lib/celestia-mon
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record the install this host belongs to
      ansible.builtin.copy:
        dest: /var/lib/celestia-mon/install-id
        content: |
          # The celestia-mon install this host belongs to, by the private address of its monitor host.
          # install.sh stops on an inventory with another monitor. Delete this file only when the monitor moved.
          monitor={{ hostvars[celestia_mon_monitor_host].celestia_mon_private_ip | string | lower }}
        owner: root
        group: root
        mode: "0644"

    - name: Install node_exporter
      ansible.builtin.include_role:
        name: celestia_mon_node_exporter

    # On every Fibre host, active or standby, so metrics flow the moment a standby is started.
    - name: Install the OpenTelemetry collector for Fibre
      ansible.builtin.include_role:
        name: celestia_mon_otelcol
      when: celestia_mon_fibre_enabled and inventory_hostname in groups.get('fibre', [])

    - name: Install doctor
      ansible.builtin.include_role:
        name: celestia_mon
        tasks_from: doctor

- name: Monitoring stack
  hosts: monitor
  become: true
  vars_files:
    - ../versions.yml
  roles:
    # With Fibre on: asks each Fibre host for its upload readiness. Before Prometheus, so the
    # fibre_health job finds it from its first scrape.
    - role: celestia_mon_blackbox
    - role: celestia_mon_prometheus
    - role: celestia_mon_alertmanager
    - role: celestia_mon_announcements
    - role: celestia_mon_tensile
    - role: celestia_mon_signal
    - role: celestia_mon_grafana
  tasks:
    - name: Install doctor
      ansible.builtin.include_role:
        name: celestia_mon
        tasks_from: doctor

- name: Check that nothing celestia-mon installed listens on a public address
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the bind check
      ansible.builtin.include_role:
        name: celestia_mon
        tasks_from: bind_check
