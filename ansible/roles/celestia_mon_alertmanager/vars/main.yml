---
celestia_mon_alertmanager_version: "{{ celestia_mon_versions.alertmanager.version }}"
celestia_mon_alertmanager_arch_map:
  x86_64: amd64
  aarch64: arm64
celestia_mon_alertmanager_arch: "{{ celestia_mon_alertmanager_arch_map[ansible_facts.architecture] }}"
celestia_mon_alertmanager_release: "alertmanager-{{ celestia_mon_alertmanager_version }}.linux-{{ celestia_mon_alertmanager_arch }}"
celestia_mon_alertmanager_download_url: "https://github.com/prometheus/alertmanager/releases/download/v{{ celestia_mon_alertmanager_version }}"
# Pinned in versions.yml from the release's sha256sums.txt; nothing is fetched to check the download.
celestia_mon_alertmanager_sha256: "{{ celestia_mon_versions.alertmanager.sha256[celestia_mon_alertmanager_arch] }}"

# The binaries go to /opt/celestia-mon/alertmanager-<version>/ and the unit runs them from there,
# so nothing else on the host is replaced. An upgrade is a new directory plus a restart.
celestia_mon_alertmanager_home: "/opt/celestia-mon/alertmanager-{{ celestia_mon_alertmanager_version }}"
celestia_mon_alertmanager_binaries:
  - alertmanager
  - amtool
# The sha256 of each binary, recorded at install from the checked release (sha256sum format).
celestia_mon_alertmanager_sums_file: "{{ celestia_mon_alertmanager_home }}/SHA256SUMS"
# A root-only directory the release is unpacked into, removed after the install.
celestia_mon_alertmanager_staging: /var/cache/celestia-mon/alertmanager.staging

celestia_mon_alertmanager_config_dir: /etc/celestia-mon/alertmanager
# The text of Telegram and Discord messages (monitoring/alertmanager-templates.tmpl).
celestia_mon_alertmanager_templates_file: "{{ celestia_mon_alertmanager_config_dir }}/celestia-mon.tmpl"
celestia_mon_alertmanager_data_dir: /var/lib/celestia-mon/alertmanager
# Loopback only: Prometheus runs on the same host. Every request also needs the API password
# (celestia_mon_api_user, celestia_mon_api_password_file), because every account on the host
# can reach loopback.
celestia_mon_alertmanager_listen_address: "127.0.0.1:{{ celestia_mon_ports.alertmanager }}"
