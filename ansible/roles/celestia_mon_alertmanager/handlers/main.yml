---
# Handlers run in the order listed here. Reload comes first so a SIGHUP never
# reaches an Alertmanager that a restart has only just started.
- name: Reload Alertmanager
  ansible.builtin.systemd_service:
    name: celestia-mon-alertmanager
    state: reloaded
  when: celestia_mon_alertmanager_present or not ansible_check_mode

# A new binary restarts the service too; systemd is reloaded only when celestia-mon's unit changed.
- name: Restart Alertmanager
  ansible.builtin.systemd_service:
    name: celestia-mon-alertmanager
    state: restarted
    daemon_reload: "{{ celestia_mon_alertmanager_unit_file is defined and celestia_mon_alertmanager_unit_file is changed }}"
  when: celestia_mon_alertmanager_present or not ansible_check_mode
