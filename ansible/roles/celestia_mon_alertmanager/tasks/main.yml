---
# Before anything is installed, so a wrong receiver list changes nothing.
- name: Check the alert receivers
  ansible.builtin.import_tasks: receivers.yml

# The Watchdog heartbeat is the only thing that reports a monitor host that is down, so a
# missing, misspelled or placeholder URL stops the install instead of dropping the heartbeat.
# https, or http to this host only (a local relay). Here and not in receivers.yml, which CI
# also runs on the example inventories with their placeholder URL. The URL is a secret: the
# message never shows it.
- name: Check the dead-man URL
  ansible.builtin.assert:
    that:
      - celestia_mon_deadman_webhook_url is defined
      - celestia_mon_deadman_webhook_url | string is match(celestia_mon_alertmanager_deadman_pattern)
      - "'REPLACE_ME' not in celestia_mon_deadman_webhook_url | string"
      - celestia_mon_deadman_webhook_url | string is not search(celestia_mon_alertmanager_deadman_placeholder)
    fail_msg: >-
      Set celestia_mon_deadman_webhook_url in the monitor host's vault to the ping URL of your dead-man check
      (an https URL, such as a healthchecks.io check that alerts you when the pings stop). It is empty, misspelled,
      not https, or still the example placeholder. Without it nothing tells you when this monitor host is down.
    quiet: true
  vars:
    celestia_mon_alertmanager_deadman_pattern: '^(https://[^/\s]+|http://(127\.[0-9.]+|localhost|\[::1\])(:[0-9]+)?(/|$))'
    celestia_mon_alertmanager_deadman_placeholder: '^https?://[^/]*\.invalid([:/]|$)'

# celestia-mon's Alertmanager has its own unit, user, paths and port (celestia-mon-alertmanager), so it
# installs next to any other Alertmanager on the host and leaves it alone.
- name: Check that celestia-mon-alertmanager can use port {{ celestia_mon_ports.alertmanager }}
  ansible.builtin.include_role:
    name: celestia_mon
    tasks_from: port_check
  vars:
    celestia_mon_port_check_port: "{{ celestia_mon_ports.alertmanager }}"
    celestia_mon_port_check_unit: celestia-mon-alertmanager

- name: Create the celestia-mon-alertmanager group
  ansible.builtin.group:
    name: celestia-mon-alertmanager
    system: true

- name: Create the celestia-mon-alertmanager user
  ansible.builtin.user:
    name: celestia-mon-alertmanager
    group: celestia-mon-alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: "{{ celestia_mon_alertmanager_data_dir }}"
    create_home: false

- name: Look for the pinned Alertmanager binaries
  ansible.builtin.stat:
    path: "{{ celestia_mon_alertmanager_home }}/{{ item }}"
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ celestia_mon_alertmanager_binaries }}"
  register: celestia_mon_alertmanager_found

# The install below records the sha256 of each binary it copied from the checked release. A
# binary that differs from its record, or an install without one, is installed again.
- name: Read the checksums recorded when Alertmanager was installed
  ansible.builtin.slurp:
    src: "{{ celestia_mon_alertmanager_sums_file }}"
  register: celestia_mon_alertmanager_sums
  failed_when: false

# In check mode nothing is downloaded, so tasks that need the binaries or the unit
# are skipped until the pinned version is installed.
- name: Note whether the pinned Alertmanager binaries are installed and unchanged
  ansible.builtin.set_fact:
    celestia_mon_alertmanager_present: >-
      {{ celestia_mon_alertmanager_found.results | rejectattr('stat.exists') | list | length == 0
         and (celestia_mon_alertmanager_sums.content | default('') | b64decode | trim)
             == (celestia_mon_alertmanager_found.results | map(attribute='stat.checksum', default='')
                 | zip(celestia_mon_alertmanager_binaries) | map('join', '  ') | join(celestia_mon_newline)) }}

- name: Report the pending install of Alertmanager {{ celestia_mon_alertmanager_version }}
  ansible.builtin.debug:
    msg: >-
      Would install {{ celestia_mon_alertmanager_binaries | join(' and ') }} {{ celestia_mon_alertmanager_version }} in {{ celestia_mon_alertmanager_home }}
      and restart celestia-mon-alertmanager.
  changed_when: true
  when: ansible_check_mode and not celestia_mon_alertmanager_present

# The shared parents first, so a service directory below never creates them with its own owner.
- name: Create the Alertmanager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/celestia-mon
    - /etc/celestia-mon
    - /var/lib/celestia-mon
    - "{{ celestia_mon_alertmanager_home }}"

- name: Create the Alertmanager configuration directory
  ansible.builtin.file:
    path: "{{ celestia_mon_alertmanager_config_dir }}"
    state: directory
    owner: root
    group: celestia-mon-alertmanager
    mode: "0750"

- name: Create the Alertmanager data directory
  ansible.builtin.file:
    path: "{{ celestia_mon_alertmanager_data_dir }}"
    state: directory
    owner: celestia-mon-alertmanager
    group: celestia-mon-alertmanager
    mode: "0750"

- name: Install Alertmanager {{ celestia_mon_alertmanager_version }}
  when: not celestia_mon_alertmanager_present and not ansible_check_mode
  block:
    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/celestia-mon
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Alertmanager release and check it against the pinned checksum
      ansible.builtin.get_url:
        url: "{{ celestia_mon_alertmanager_download_url }}/{{ celestia_mon_alertmanager_release }}.tar.gz"
        dest: /var/cache/celestia-mon/{{ celestia_mon_alertmanager_release }}.tar.gz
        checksum: "sha256:{{ celestia_mon_alertmanager_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      # Release hosts sometimes reset a connection; retry before giving up.
      register: celestia_mon_alertmanager_download
      until: celestia_mon_alertmanager_download is succeeded
      retries: 5
      delay: 10

    # The first step clears what an interrupted run left behind.
    - name: Clear the Alertmanager staging directory
      ansible.builtin.file:
        path: "{{ celestia_mon_alertmanager_staging }}"
        state: absent

    - name: Create the Alertmanager staging directory
      ansible.builtin.file:
        path: "{{ celestia_mon_alertmanager_staging }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The release stores its files as uid 1001, and tar running as root keeps stored owners.
    # --no-same-owner makes them root's, and the 0700 staging directory keeps every other
    # account away from the binaries root runs (amtool checks the config below).
    - name: Unpack the Alertmanager binaries
      ansible.builtin.unarchive:
        src: /var/cache/celestia-mon/{{ celestia_mon_alertmanager_release }}.tar.gz
        dest: "{{ celestia_mon_alertmanager_staging }}"
        include: "{{ celestia_mon_alertmanager_binaries | map('regex_replace', '^', celestia_mon_alertmanager_release ~ '/') | list }}"
        extra_opts:
          - --no-same-owner
        remote_src: true

    - name: Install the Alertmanager binaries
      ansible.builtin.copy:
        src: "{{ celestia_mon_alertmanager_staging }}/{{ celestia_mon_alertmanager_release }}/{{ item }}"
        dest: "{{ celestia_mon_alertmanager_home }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop: "{{ celestia_mon_alertmanager_binaries }}"
      notify: Restart Alertmanager

    - name: Read the checksums of the installed Alertmanager binaries
      ansible.builtin.stat:
        path: "{{ celestia_mon_alertmanager_home }}/{{ item }}"
        checksum_algorithm: sha256
        get_mime: false
      loop: "{{ celestia_mon_alertmanager_binaries }}"
      register: celestia_mon_alertmanager_installed

    # In sha256sum's format: cd <dir> && sha256sum -c SHA256SUMS checks them by hand.
    - name: Record the checksums of the installed Alertmanager binaries
      ansible.builtin.copy:
        dest: "{{ celestia_mon_alertmanager_sums_file }}"
        content: >-
          {{ (celestia_mon_alertmanager_installed.results | map(attribute='stat.checksum')
              | zip(celestia_mon_alertmanager_binaries) | map('join', '  ') | join(celestia_mon_newline)) ~ celestia_mon_newline }}
        owner: root
        group: root
        mode: "0644"

  # Also after a failed step, so no unpacked release is left behind.
  always:
    - name: Remove the downloaded Alertmanager release and the staging directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/celestia-mon/{{ celestia_mon_alertmanager_release }}.tar.gz
        - "{{ celestia_mon_alertmanager_staging }}"
        # Where earlier versions of celestia-mon unpacked the release.
        - /var/cache/celestia-mon/{{ celestia_mon_alertmanager_release }}

# Written before the configuration, which names it, so amtool's check of that finds it.
- name: Write the notification templates
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/alertmanager-templates.tmpl"
    dest: "{{ celestia_mon_alertmanager_templates_file }}"
    owner: root
    group: celestia-mon-alertmanager
    mode: "0640"
  notify: Reload Alertmanager

# Read before the render: no configuration yet means a first install, which sends a test
# message (below).
- name: Look for an earlier Alertmanager configuration
  ansible.builtin.stat:
    path: "{{ celestia_mon_alertmanager_config_dir }}/alertmanager.yml"
    get_checksum: false
    get_mime: false
  register: celestia_mon_alertmanager_config_before

# The rendered file holds receiver tokens: never show it or its diff. If this task
# fails, amtool rejected the new file and the old one stays in place: check the
# receivers in celestia_mon_receivers against the keys Alertmanager expects.
- name: Render the Alertmanager configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../monitoring/alertmanager.yml.j2"
    dest: "{{ celestia_mon_alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: celestia-mon-alertmanager
    mode: "0640"
    validate: "{{ celestia_mon_alertmanager_home }}/amtool check-config %s"
  no_log: true
  notify: Reload Alertmanager

- name: Read or create the API password
  ansible.builtin.include_role:
    name: celestia_mon
    tasks_from: api_password
  when: celestia_mon_api_password_hash is not defined

# Every request to Alertmanager (API, UI, /metrics, /-/ready) needs the API password, so no
# other account on this host can silence alerts. Grafana's datasource login is not listed: a
# Grafana that is taken over cannot silence alerts either. Alertmanager reads this file at each
# request.
- name: Write the Alertmanager web configuration
  ansible.builtin.copy:
    dest: "{{ celestia_mon_api_web_configs.alertmanager }}"
    content: |
      # Managed by celestia-mon. Local changes are overwritten on the next playbook run.
      # Basic auth on every request; the password is in {{ celestia_mon_api_password_file }}.
      basic_auth_users:
        {{ celestia_mon_api_user }}: {{ celestia_mon_api_password_hash | to_json }}
    owner: root
    group: celestia-mon-alertmanager
    mode: "0640"
    validate: "/opt/celestia-mon/prometheus-{{ celestia_mon_versions.prometheus.version }}/promtool check web-config %s"

# For amtool as root, for example (9913 is the default celestia_mon_ports.alertmanager):
#   sudo /opt/celestia-mon/alertmanager-<version>/amtool --alertmanager.url=http://127.0.0.1:9913 \
#     --http.config.file=/etc/celestia-mon/alertmanager/amtool-http.yml silence query
- name: Write amtool's HTTP settings
  ansible.builtin.copy:
    dest: "{{ celestia_mon_api_amtool_config }}"
    content: |
      # Managed by celestia-mon. amtool --http.config.file: the API user and password file.
      basic_auth:
        username: {{ celestia_mon_api_user | to_json }}
        password_file: {{ celestia_mon_api_password_file | to_json }}
    owner: root
    group: root
    mode: "0600"

# The unit names the versioned binary, so a new version changes it and restarts the service.
- name: Install the celestia-mon-alertmanager systemd unit
  ansible.builtin.template:
    src: celestia-mon-alertmanager.service.j2
    dest: /etc/systemd/system/celestia-mon-alertmanager.service
    owner: root
    group: root
    mode: "0644"
  register: celestia_mon_alertmanager_unit_file
  notify: Restart Alertmanager

# Reload systemd only when celestia-mon's unit changed: a reload also loads unit files
# that someone else edited on disk and has not reloaded yet.
- name: Start celestia-mon-alertmanager and enable it at boot
  ansible.builtin.systemd_service:
    name: celestia-mon-alertmanager
    enabled: true
    state: started
    daemon_reload: "{{ celestia_mon_alertmanager_unit_file is changed }}"
  when: celestia_mon_alertmanager_present or not ansible_check_mode

# Apply pending reloads and restarts now, so a failure later in the play
# (Grafana) cannot drop them.
- name: Apply pending Alertmanager changes
  ansible.builtin.meta: flush_handlers

# systemctl returns before the service binds, so a crash loop would otherwise go unnoticed.
# Waiting here also lets the bind check at the end of the playbook see the socket.
- name: Wait for Alertmanager on {{ celestia_mon_alertmanager_listen_address }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ celestia_mon_ports.alertmanager }}"
    timeout: 60
    msg: celestia-mon-alertmanager does not listen on {{ celestia_mon_alertmanager_listen_address }}. See journalctl -u celestia-mon-alertmanager.
  when: not ansible_check_mode

# One test message when the receivers changed (the first install, a receiver added or changed),
# so a wrong token or chat id shows now and not at the first real alert. An upgrade that only
# changes the rest of Alertmanager's configuration sends none: the receivers are compared by a
# hash kept in receivers.sha256 (root only), written after the message went out; an install made
# before that file existed records it without a message, unless it is a first install. It is a message
# alert: the chat channels and webhooks get it, PagerDuty does not. Alertmanager resolves it
# after its resolve_timeout (5 minutes); a receiver that cannot deliver it raises
# NotificationsFailing.
- name: Read the hash of the receivers the last test message went to
  ansible.builtin.slurp:
    src: "{{ celestia_mon_alertmanager_config_dir }}/receivers.sha256"
  register: celestia_mon_alertmanager_receivers_tested
  failed_when: false

- name: Note whether the receivers changed since the last test message
  ansible.builtin.set_fact:
    celestia_mon_alertmanager_receivers_hash: "{{ celestia_mon_receivers | to_json | hash('sha256') }}"
    celestia_mon_alertmanager_receivers_new: >-
      {{ (celestia_mon_alertmanager_receivers_tested.content | b64decode | trim) != (celestia_mon_receivers | to_json | hash('sha256'))
         if celestia_mon_alertmanager_receivers_tested.content is defined
         else not celestia_mon_alertmanager_config_before.stat.exists }}
  no_log: true

- name: Send a test notification to the chat receivers
  when: celestia_mon_alertmanager_receivers_new | bool and not ansible_check_mode
  no_log: true
  block:
    - name: Read the API password for the test notification
      ansible.builtin.slurp:
        src: "{{ celestia_mon_api_password_file }}"
      register: celestia_mon_alertmanager_test_login

    - name: Post the test notification to Alertmanager
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ celestia_mon_ports.alertmanager }}/api/v2/alerts"
        method: POST
        url_username: "{{ celestia_mon_api_user }}"
        url_password: "{{ celestia_mon_alertmanager_test_login.content | b64decode | trim }}"
        force_basic_auth: true
        body_format: json
        body:
          - labels:
              alertname: NotificationTest
              severity: message
              host: "{{ inventory_hostname }}"
            annotations:
              summary: "Test from celestia-mon on {{ inventory_hostname }}: notifications reach this channel"
              description: >-
                Sent once because the install changed Alertmanager's receivers. No action needed: it
                resolves in about 5 minutes. PagerDuty gets no test message.
        status_code: 200

- name: Note the receivers the test message went to
  ansible.builtin.copy:
    dest: "{{ celestia_mon_alertmanager_config_dir }}/receivers.sha256"
    content: "{{ celestia_mon_alertmanager_receivers_hash }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

- name: Find older Alertmanager versions
  ansible.builtin.find:
    paths: /opt/celestia-mon
    patterns: alertmanager-*
    excludes: alertmanager-{{ celestia_mon_alertmanager_version }}
    file_type: directory
  register: celestia_mon_alertmanager_old
  when: celestia_mon_alertmanager_present or not ansible_check_mode

- name: Remove older Alertmanager versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ celestia_mon_alertmanager_old.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
