---
# Shared settings for every celestia-mon role. Override them in your inventory.

# Signer in use on the validator: local (key file on the node) or remote (tmkms).
celestia_mon_signer: local

# Install and render everything Fibre-related. Keep false on networks where
# Fibre is not active (mainnet runs app v9 as of 2026-10).
celestia_mon_fibre_enabled: false

# systemd service names, without the .service suffix.
celestia_mon_units:
  appd: celestia-appd
  fibre: fibre
  tmkms: tmkms

# celestia-appd endpoints on the validator and backup_node hosts.
celestia_mon_node_metrics_port: 26660
celestia_mon_node_rpc_port: 26657

# Ports of the services celestia-mon installs: one block that common tools do not use, so
# celestia-mon runs next to an existing node_exporter, Prometheus, Grafana or collector.
# node_exporter and otelcol_prometheus listen on celestia_mon_private_ip, grafana on
# celestia_mon_grafana_listen; prometheus, alertmanager and otelcol_otlp listen on
# 127.0.0.1 only. otelcol_otlp is the collector's OTLP/HTTP receiver, where Fibre pushes
# its metrics (--otel-endpoint http://127.0.0.1:9915 with the default below).
# The playbook stops if another process already listens on one of them.
# Overriding celestia_mon_ports replaces the whole map, so list every key.
celestia_mon_ports:
  node_exporter: 9910
  otelcol_prometheus: 9911
  prometheus: 9912
  alertmanager: 9913
  grafana: 9914
  otelcol_otlp: 9915

# The address Grafana listens on, on the monitor host. The default, 127.0.0.1, keeps it off
# every network: reach it through an SSH tunnel from your machine
# (ssh -N -L 9914:127.0.0.1:9914 <user>@<monitor host>, then open http://localhost:9914).
# You may set a private address of the monitor host instead (Tailscale, WireGuard, a LAN),
# or keep 127.0.0.1 and put a reverse proxy on the monitor host in front of it. The install
# stops when the address is not one of this machine's; Grafana never listens on 0.0.0.0.
celestia_mon_grafana_listen: 127.0.0.1

# Alert thresholds (see docs/alerts.md). The durations (for example ValidatorNotSigning's 2
# minutes, FibreDown's 10) are fixed in the rules.
celestia_mon_thresholds:
  not_signing_blocks: 10
  node_behind_blocks: 20
  signer_median_seconds: 0.010
  fibre_stale_uploads: 10
  fibre_stale_min_seconds: 3600
  disk_page_free_ratio: 0.05
  disk_message_free_ratio: 0.10
  crashloop_restarts: 2

# Alert receivers: one list, any number of entries, several of one type allowed. Each is one of:
#   {type: telegram, bot_token: ..., chat_id: ...}       chat_id is numeric, e.g. -1000000000000
#   {type: discord, webhook_url: ...}
#   {type: slack, api_url: ..., channel: ...}            channel is optional
#   {type: pagerduty, routing_key: ...}                  an Events API v2 integration key
#   {type: webhook, url: ...}
# Page alerts go to every receiver; message alerts go to every receiver except PagerDuty, so
# at least one receiver must be of another type. Keep the list (it holds secrets) in
# ansible-vault on the monitor host. The separate page and message lists of earlier
# versions are refused.
celestia_mon_receivers: []

# Heartbeat URL of an external dead-man service. The Watchdog alert pings it
# every 1-2 minutes; the service alerts you when the pings stop.
celestia_mon_deadman_webhook_url: ""

# How long and how much data Prometheus keeps on the monitor host. Prometheus drops
# the oldest data when either limit is reached. The size uses Prometheus's units
# (B, KB, MB, GB, TB; base 1024). The retention size does not cover the write-ahead log,
# the head chunks or the temporary space compaction needs, so the install requires the
# disk of Prometheus's data directory to hold retention size x 1.5 + 2 GiB (counting what
# Prometheus keeps there already).
celestia_mon_prometheus_retention: 30d
celestia_mon_prometheus_retention_size: 8GB

# Priority and memory of every celestia-mon unit. Nice, CPUWeight and IOWeight lower the
# units' share of CPU and disk below the Celestia services' (systemd's defaults are 0, 100
# and 100), and they matter only when the services compete for them; there is no CPU quota.
# They lower the impact on the validator, they do not guarantee none: IOWeight has no
# effect with the "none" I/O scheduler that NVMe disks often use, unless io.cost is set up.
# MemoryHigh is the soft target: above it the kernel reclaims the service's memory and slows
# it down. MemoryMax, well above it, is the hard limit: there the kernel's OOM killer ends
# the service and systemd restarts it. The defaults are sized from the measured memory of
# these services at this package's scale (a few thousand series). Values use systemd's units
# (K, M, G; base 1024). Overriding celestia_mon_memory replaces the whole map, so list every
# service.
celestia_mon_nice: 10
celestia_mon_cpu_weight: 20
celestia_mon_io_weight: 20
celestia_mon_memory:
  node_exporter: {high: 128M, max: 256M}
  otelcol: {high: 384M, max: 1G}
  prometheus: {high: 2G, max: 4G}
  alertmanager: {high: 128M, max: 256M}
  grafana: {high: 512M, max: 1G}

# Inventory groups (a host may be in several):
#   validator    exactly one host: the celestia-appd node the signer normally connects to
#   backup_node  any number: synced, key-less celestia-appd nodes that can take over signing
#   fibre        every host with a Fibre install, active or standby; systemd says which one runs
#   kms          optional: the tmkms host; nothing is installed there unless celestia_mon_kms_scrape
#   monitor      exactly one host: Prometheus, Alertmanager and Grafana

# Per-host settings (set them in host_vars or the inventory):
#   celestia_mon_private_ip             required on every host celestia-mon touches; an address
#                                       of that host itself (the playbook checks)
#   celestia_mon_data_mounts            list of mount points to watch (node data, tmkms state)
#   celestia_mon_fibre_mount            Fibre store mount point (fibre hosts, active or standby)
#   celestia_mon_fibre_public_endpoint  host:port that valaddr set-host registers while this host's
#                                       Fibre is the active one (fibre hosts)
#   celestia_mon_kms_scrape             install node_exporter on a kms host (default false)
#   celestia_mon_firewall_sources       optional list of addresses ufw lets reach this host's scraped
#                                       ports, when ufw is active (default: the monitor's
#                                       celestia_mon_private_ip)
#   celestia_mon_link_mbps              optional, the link speed you pay for in Mbit/s, for the
#                                       Link load panel (every node_exporter host). Set it when
#                                       the host reports no NIC speed (virtio), has more than one
#                                       physical NIC, or buys less than its port speed
#   celestia_mon_node_home              celestia-appd home for celestia-mon-doctor (validator and
#                                       backup_node hosts).
#                                       Default: the unit's --home, CELESTIA_APP_HOME, DAEMON_HOME,
#                                       or ~/.celestia-app of the unit's User
