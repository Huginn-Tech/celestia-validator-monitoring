---
# The passwords of Prometheus's and Alertmanager's APIs (basic auth). Without them any account on
# the monitor host could reach the APIs on 127.0.0.1, and for example silence every page.
#   celestia_mon_api_user, password in celestia_mon_api_password_file (root and the
#   celestia-mon-prometheus group, which sends it with its scrapes of Prometheus and Alertmanager,
#   its readiness probes and its alerts): Prometheus, Alertmanager and celestia-mon-blackbox take it.
#   celestia_mon_api_grafana_user, password in celestia_mon_api_grafana_password_file (root
#   only): Grafana's datasource; Prometheus takes it, Alertmanager does not.
# Each is generated once; a reinstall after --uninstall generates new ones. Sets
# celestia_mon_api_password_hash and celestia_mon_api_grafana_password_hash (bcrypt, for the web
# configs) and celestia_mon_api_grafana_password (for Grafana's datasource). The
# celestia_mon_blackbox, celestia_mon_prometheus, celestia_mon_alertmanager and
# celestia_mon_grafana roles include it when the facts are not set yet.
- name: Create the celestia-mon-prometheus group
  ansible.builtin.group:
    name: celestia-mon-prometheus
    system: true

- name: Create the celestia-mon settings directory
  ansible.builtin.file:
    path: "{{ celestia_mon_api_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# force: false writes a file only when it is missing, so a password never changes. Letters
# and digits only: Grafana expands $ in the provisioning file that carries its password.
- name: Generate the API passwords once
  ansible.builtin.copy:
    dest: "{{ item.file }}"
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
    force: false
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {file: "{{ celestia_mon_api_password_file }}", group: celestia-mon-prometheus, mode: "0640"}
    - {file: "{{ celestia_mon_api_grafana_password_file }}", group: root, mode: "0600"}
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  diff: false

# Missing only in a dry run on a fresh host, where the step above wrote nothing.
- name: Read the API passwords
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ celestia_mon_api_password_file }}"
    - "{{ celestia_mon_api_grafana_password_file }}"
  register: celestia_mon_api_password_read
  failed_when: false
  no_log: true

# bcrypt from the host's python3 (Ubuntu 24.04's Python 3.12 and its crypt module): Ansible's
# password_hash filter needs passlib, which the install does not bring. A hash already in a web
# config is kept while it matches the password, so a second run changes nothing.
- name: Hash the API passwords for the web configs
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -W
      - ignore
      - -c
      - |
        import crypt, re, sys
        if crypt.METHOD_BLOWFISH not in crypt.methods:
            sys.exit("this python3 cannot make bcrypt hashes")
        password = open(sys.argv[1]).read().strip()
        for path in sys.argv[2:]:
            try:
                text = open(path).read()
            except OSError:
                continue
            for old in re.findall(r"[$]2[aby][$][0-9][0-9][$][./A-Za-z0-9]{53}", text):
                if crypt.crypt(password, old) == old:
                    print(old)
                    sys.exit(0)
        print(crypt.crypt(password, crypt.mksalt(crypt.METHOD_BLOWFISH, rounds=1024)))
      - "{{ item.item }}"
      - "{{ celestia_mon_api_web_configs.prometheus }}"
      - "{{ celestia_mon_api_web_configs.alertmanager }}"
      - "{{ celestia_mon_api_web_configs.blackbox }}"
  loop: "{{ celestia_mon_api_password_read.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: celestia_mon_api_password_bcrypt
  changed_when: false
  check_mode: false
  when: item.content is defined
  no_log: true

- name: Note the API passwords and their hashes
  ansible.builtin.set_fact:
    celestia_mon_api_password_hash: >-
      {{ celestia_mon_api_password_bcrypt.results[0].stdout | default('generated-by-the-first-real-run') | trim }}
    celestia_mon_api_grafana_password_hash: >-
      {{ celestia_mon_api_password_bcrypt.results[1].stdout | default('generated-by-the-first-real-run') | trim }}
    celestia_mon_api_grafana_password: >-
      {{ (celestia_mon_api_password_read.results[1].content | b64decode | trim)
         if celestia_mon_api_password_read.results[1].content is defined else 'generated-by-the-first-real-run' }}
  no_log: true
