---
# Addresses celestia-mon accepts as private: RFC 1918, CGNAT (Tailscale), loopback, IPv6 ULA.
# One string: in double quotes, a backslash at the end of a line joins the next line without a space.
celestia_mon_private_address_regex: "^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|\
  100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.|127\\.|::1$|f[cd][0-9a-fA-F]{2}:)"

# Is this host one celestia-mon installs anything on? A kms host only when celestia_mon_kms_scrape is set.
celestia_mon_host_managed: >-
  {{ inventory_hostname in (groups.get('validator', []) + groups.get('fibre', []) + groups.get('monitor', []))
     or (inventory_hostname in groups.get('kms', []) and (celestia_mon_kms_scrape | default(false) | bool)) }}

# Celestia services running on this host, by systemd unit name (without .service).
celestia_mon_host_units: >-
  {{ ([celestia_mon_units.appd] if inventory_hostname in groups.get('validator', []) else [])
     + ([celestia_mon_units.fibre] if (celestia_mon_fibre_enabled and inventory_hostname in groups.get('fibre', [])) else [])
     + ([celestia_mon_units.tmkms] if (celestia_mon_signer == 'remote' and inventory_hostname in groups.get('kms', [])) else []) }}

# The role label this host's node_exporter target carries.
celestia_mon_host_role: >-
  {{ 'validator' if inventory_hostname in groups.get('validator', [])
     else 'fibre' if inventory_hostname in groups.get('fibre', [])
     else 'kms' if inventory_hostname in groups.get('kms', [])
     else 'monitor' }}

celestia_mon_monitor_host: "{{ groups['monitor'][0] }}"

# The services celestia-mon installs, with their systemd unit, the keys of their ports in
# celestia_mon_ports, their directory under /opt/celestia-mon (<dir>-<version>, version from
# celestia_mon_versions[<version>]) and the disk space an install needs in MiB (download,
# unpacked release and installed binaries, rounded up from the pinned amd64 releases).
celestia_mon_services:
  node_exporter: {unit: celestia-mon-node-exporter, ports: [node_exporter], dir: node_exporter, version: node_exporter, disk_mb: 100}
  otelcol: {unit: celestia-mon-otelcol, ports: [otelcol_prometheus, otelcol_otlp], dir: otelcol-contrib, version: otelcol_contrib, disk_mb: 1100}
  prometheus: {unit: celestia-mon-prometheus, ports: [prometheus], dir: prometheus, version: prometheus, disk_mb: 700}
  alertmanager: {unit: celestia-mon-alertmanager, ports: [alertmanager], dir: alertmanager, version: alertmanager, disk_mb: 250}
  grafana: {unit: celestia-mon-grafana, ports: [grafana], dir: grafana, version: grafana, disk_mb: 1300}

# Ports that listen on 127.0.0.1; grafana listens on celestia_mon_grafana_listen, the others
# on celestia_mon_private_ip.
celestia_mon_loopback_ports: [otelcol_otlp, prometheus, alertmanager]

# The ufw rules firewall.yml added on this host, as a JSON list of {source, port, proto, comment}.
# ansible/uninstall.yml deletes only these (and repeats the path, as it loads no role).
celestia_mon_firewall_record: /var/lib/celestia-mon/firewall-added.json

# The services site.yml installs on this host (keys of celestia_mon_services): node_exporter
# on Celestia hosts, the collector on Fibre hosts, the stack on the monitor.
celestia_mon_host_services: >-
  {{ (['node_exporter'] if inventory_hostname in (groups.get('validator', []) + groups.get('fibre', []) + groups.get('kms', [])) else [])
     + (['otelcol'] if (celestia_mon_fibre_enabled and inventory_hostname in groups.get('fibre', [])) else [])
     + (['prometheus', 'alertmanager', 'grafana'] if inventory_hostname in groups.get('monitor', []) else []) }}
