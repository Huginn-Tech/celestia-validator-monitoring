---
# Grafana OSS from the official tarball; the version is pinned in versions.yml.
# Taut's Grafana runs as its own unit, user, port and paths, next to any other
# Grafana on the host. An upgrade is a new directory under /opt/taut and a restart.
taut_grafana_version: "{{ taut_versions.grafana }}"
taut_grafana_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
taut_grafana_tarball: "grafana-{{ taut_grafana_version }}.linux-{{ taut_grafana_arch }}.tar.gz"
# A .sha256 file next to the tarball holds its bare SHA-256 digest.
taut_grafana_url: "https://dl.grafana.com/oss/release/{{ taut_grafana_tarball }}"
# The tarball's top folder (grafana-<v>/ or grafana-v<v>/, depending on the release) is stripped on unpack.
taut_grafana_home: "/opt/taut/grafana-{{ taut_grafana_version }}"

taut_grafana_config_dir: /etc/taut/grafana
taut_grafana_data_dir: /var/lib/taut/grafana
taut_grafana_dashboard_dir: "{{ taut_grafana_config_dir }}/dashboards"
taut_grafana_admin_password_file: "{{ taut_grafana_config_dir }}/admin-password"

# The repository checkout on the control node (site.yml lives in ansible/).
taut_grafana_repo_dir: "{{ playbook_dir }}/.."
taut_grafana_build_dir: "{{ taut_grafana_repo_dir }}/build/dashboards"
