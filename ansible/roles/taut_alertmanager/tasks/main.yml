---
# Checks the receiver list without printing it: entries carry tokens.
- name: Check the alert receivers
  ansible.builtin.assert:
    that:
      - taut_receivers.page | length > 0
      - taut_receivers.message | length > 0
      - taut_alertmanager_receivers | map(attribute='type', default='') | difference(['telegram', 'pagerduty', 'slack', 'webhook']) | length == 0
      - taut_alertmanager_receivers | selectattr('type', 'equalto', 'telegram') | rejectattr('bot_token', 'defined') | list | length == 0
      - taut_alertmanager_receivers | selectattr('type', 'equalto', 'telegram') | rejectattr('chat_id', 'defined') | list | length == 0
      # Alertmanager needs a non-zero numeric chat_id; a name such as @channel would render as 0.
      - >-
        taut_alertmanager_receivers | selectattr('type', 'equalto', 'telegram') | map(attribute='chat_id') | map('string')
        | reject('match', '^-?[1-9][0-9]*$') | list | length == 0
      - taut_alertmanager_receivers | selectattr('type', 'equalto', 'pagerduty') | rejectattr('routing_key', 'defined') | list | length == 0
      - taut_alertmanager_receivers | selectattr('type', 'equalto', 'slack') | rejectattr('api_url', 'defined') | list | length == 0
      - taut_alertmanager_receivers | selectattr('type', 'equalto', 'webhook') | rejectattr('url', 'defined') | list | length == 0
    fail_msg: >-
      taut_receivers.page and taut_receivers.message each need at least one receiver.
      Each receiver needs a type and its keys: telegram (bot_token, numeric chat_id), pagerduty (routing_key),
      slack (api_url, optional channel) or webhook (url).
    quiet: true
  vars:
    taut_alertmanager_receivers: "{{ taut_receivers.page + taut_receivers.message }}"

# Taut writes these two files. If one exists without Taut's marker, another
# Alertmanager lives here: stop instead of overwriting its configuration.
# grep prints file names only, never the receiver tokens inside.
- name: Look for Alertmanager files that Taut did not write
  ansible.builtin.command:
    argv:
      - grep
      - --files-without-match
      - --no-messages
      - --fixed-strings
      - "# Managed by Taut"
      - "{{ taut_alertmanager_config_dir }}/alertmanager.yml"
      - /etc/systemd/system/alertmanager.service
  register: taut_alertmanager_foreign
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (taut_alertmanager_replace_existing | bool)

- name: Check that no other Alertmanager is installed here
  ansible.builtin.assert:
    that:
      - taut_alertmanager_foreign.stdout_lines | length == 0
    fail_msg: >-
      {{ taut_alertmanager_foreign.stdout_lines | join(', ') }} was not written by Taut, so another Alertmanager
      seems to be installed on this host. Use another monitor host, or set taut_alertmanager_replace_existing: true
      to let Taut overwrite these files.
    quiet: true
  when: not (taut_alertmanager_replace_existing | bool)

- name: Create the alertmanager group
  ansible.builtin.group:
    name: alertmanager
    system: true

- name: Create the alertmanager user
  ansible.builtin.user:
    name: alertmanager
    group: alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: "{{ taut_alertmanager_data_dir }}"
    create_home: false

- name: Look for the pinned Alertmanager binaries
  ansible.builtin.stat:
    path: /usr/local/bin/{{ item }}-{{ taut_alertmanager_version }}
  loop: "{{ taut_alertmanager_binaries }}"
  register: taut_alertmanager_found

# In check mode nothing is downloaded, so tasks that need the binaries or the unit
# are skipped until the pinned version is installed.
- name: Note whether the pinned Alertmanager binaries are installed
  ansible.builtin.set_fact:
    taut_alertmanager_present: "{{ taut_alertmanager_found.results | rejectattr('stat.exists') | list | length == 0 }}"

- name: Report the pending install of Alertmanager {{ taut_alertmanager_version }}
  ansible.builtin.debug:
    msg: Would install {{ taut_alertmanager_binaries | join(' and ') }} {{ taut_alertmanager_version }} in /usr/local/bin and restart Alertmanager.
  changed_when: true
  when: ansible_check_mode and not taut_alertmanager_present

- name: Install Alertmanager {{ taut_alertmanager_version }}
  when: not taut_alertmanager_present and not ansible_check_mode
  block:
    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/taut
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Alertmanager release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ taut_alertmanager_download_url }}/{{ taut_alertmanager_release }}.tar.gz"
        dest: /var/cache/taut/{{ taut_alertmanager_release }}.tar.gz
        checksum: "sha256:{{ taut_alertmanager_download_url }}/sha256sums.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack the Alertmanager release
      ansible.builtin.unarchive:
        src: /var/cache/taut/{{ taut_alertmanager_release }}.tar.gz
        dest: /var/cache/taut
        remote_src: true

    - name: Install the Alertmanager binaries
      ansible.builtin.copy:
        src: /var/cache/taut/{{ taut_alertmanager_release }}/{{ item }}
        dest: /usr/local/bin/{{ item }}-{{ taut_alertmanager_version }}
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop: "{{ taut_alertmanager_binaries }}"

    - name: Remove the downloaded Alertmanager release
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/taut/{{ taut_alertmanager_release }}.tar.gz
        - /var/cache/taut/{{ taut_alertmanager_release }}

- name: Point the Alertmanager binaries at the pinned version
  ansible.builtin.file:
    src: /usr/local/bin/{{ item }}-{{ taut_alertmanager_version }}
    dest: /usr/local/bin/{{ item }}
    state: link
    owner: root
    group: root
  loop: "{{ taut_alertmanager_binaries }}"
  when: taut_alertmanager_present or not ansible_check_mode
  notify: Restart Alertmanager

- name: Create the Alertmanager configuration directory
  ansible.builtin.file:
    path: "{{ taut_alertmanager_config_dir }}"
    state: directory
    owner: root
    group: alertmanager
    mode: "0750"

- name: Create the Alertmanager data directory
  ansible.builtin.file:
    path: "{{ taut_alertmanager_data_dir }}"
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: "0750"

# The rendered file holds receiver tokens: never show it or its diff. If this task
# fails, amtool rejected the new file and the old one stays in place: check the
# receivers in taut_receivers against the keys Alertmanager expects.
- name: Render the Alertmanager configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../monitoring/alertmanager.yml.j2"
    dest: "{{ taut_alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: alertmanager
    mode: "0640"
    validate: /usr/local/bin/amtool check-config %s
  no_log: true
  notify: Reload Alertmanager

- name: Install the Alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alertmanager

- name: Allow the monitor to reach Alertmanager through an active ufw
  ansible.builtin.include_role:
    name: taut
    tasks_from: firewall
  vars:
    taut_firewall_port: "{{ taut_ports.alertmanager }}"

- name: Start Alertmanager and enable it at boot
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
  when: taut_alertmanager_present or not ansible_check_mode

# Apply pending reloads and restarts now, so a failure later in the play
# (Grafana) cannot drop them.
- name: Apply pending Alertmanager changes
  ansible.builtin.meta: flush_handlers
