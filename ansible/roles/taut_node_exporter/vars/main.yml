---
# Derived values. The settings themselves (versions, ports, unit names) live in
# versions.yml and the taut role defaults.
taut_node_exporter_version: "{{ taut_versions.node_exporter }}"
taut_node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
taut_node_exporter_release: "node_exporter-{{ taut_node_exporter_version }}.linux-{{ taut_node_exporter_arch }}"
taut_node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ taut_node_exporter_version }}"
taut_node_exporter_binary: "/usr/local/bin/node_exporter-{{ taut_node_exporter_version }}"

# host:port on the private address (IPv6 addresses go in brackets).
taut_node_exporter_listen_address: >-
  {{ '[' ~ taut_private_ip ~ ']' if ':' in taut_private_ip else taut_private_ip }}:{{ taut_ports.node_exporter }}

# Anchored regex of the Celestia services on this host, for the systemd collector.
taut_node_exporter_unit_include: "^({{ taut_host_units | map('regex_escape') | join('|') }})\\.service$"
