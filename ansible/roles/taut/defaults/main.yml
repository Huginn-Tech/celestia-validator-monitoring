---
# Shared settings for every Taut role. Override them in your inventory.

# Signer in use on the validator: local (key file on the node) or remote (tmkms).
taut_signer: local

# Install and render everything Fibre-related. Keep false on networks where
# Fibre is not active (mainnet runs app v9 as of 2026-10).
taut_fibre_enabled: false

# systemd service names, without the .service suffix.
taut_units:
  appd: celestia-appd
  fibre: fibre
  tmkms: tmkms

# celestia-appd endpoints on the validator host.
taut_node_metrics_port: 26660
taut_node_rpc_port: 26657

# Ports of the services Taut installs. All of them listen on taut_private_ip only,
# except otelcol_otlp: the collector's OTLP/HTTP receiver on 127.0.0.1, where Fibre
# pushes its metrics (--otel-endpoint http://127.0.0.1:<otelcol_otlp>).
# Overriding taut_ports replaces the whole map, so list every key.
taut_ports:
  node_exporter: 9100
  otelcol_prometheus: 8889
  otelcol_otlp: 4318
  prometheus: 9191
  alertmanager: 9093
  grafana: 3000

# Alert thresholds (see docs/alerts.md).
taut_thresholds:
  not_signing_blocks: 50
  signer_median_seconds: 0.010
  fibre_stale_uploads: 10
  fibre_stale_min_seconds: 3600
  disk_page_free_ratio: 0.03
  disk_message_free_ratio: 0.10
  crashloop_restarts: 2

# Alert receivers per severity. Each entry is one of:
#   {type: telegram, bot_token: ..., chat_id: ...}
#   {type: pagerduty, routing_key: ...}
#   {type: slack, api_url: ..., channel: ...}
#   {type: webhook, url: ...}
# Keep secrets in ansible-vault.
taut_receivers:
  page: []
  message: []

# Heartbeat URL of an external dead-man service. The Watchdog alert pings it
# every 1-2 minutes; the service alerts you when the pings stop.
taut_deadman_webhook_url: ""

taut_prometheus_retention: 30d

# Per-host settings (set them in host_vars or the inventory):
#   taut_private_ip            required on every host Taut touches
#   taut_data_mounts           list of mount points to watch (node data, tmkms state)
#   taut_fibre_mount           Fibre store mount point (fibre hosts)
#   taut_fibre_public_endpoint host:port registered with valaddr set-host (fibre hosts)
#   taut_kms_scrape            install node_exporter on a kms host (default false)
#   taut_node_home             celestia-appd home for taut-doctor (validator host). Default: the
#                              unit's --home, CELESTIA_APP_HOME, DAEMON_HOME, or ~/.celestia-app
#                              of the unit's User
