---
# Lets the monitor host reach a port Prometheus scrapes (one of Taut's, or
# celestia-appd's metrics port on the validator host) through ufw, only when ufw
# is already active on this host. Never enables, resets or reorders the firewall.
# A host reaching its own address goes through lo, which ufw already accepts, so
# this host's own address is skipped (the monitor itself, or a single-host setup).
#   taut_firewall_port     required, the TCP port to allow
#   taut_firewall_sources  optional list of addresses (default: the monitor's taut_private_ip)
- name: Read the ufw status
  ansible.builtin.command: ufw status
  environment:
    LC_ALL: C
  register: taut_firewall_ufw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Allow the monitor host through ufw to port {{ taut_firewall_port }}
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "{{ taut_firewall_port | string }}"
    proto: tcp
    comment: taut
  loop: "{{ taut_firewall_sources | default([hostvars[taut_monitor_host].taut_private_ip]) | reject('equalto', taut_private_ip) | list }}"
  when: "taut_firewall_ufw.stdout | default('') is match('Status: active')"
