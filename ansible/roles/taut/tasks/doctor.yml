---
- name: Create the Taut settings directory
  ansible.builtin.file:
    path: /etc/taut
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install taut-doctor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tools/doctor.sh"
    dest: /usr/local/bin/taut-doctor
    owner: root
    group: root
    mode: "0755"

- name: Write the taut-doctor settings
  ansible.builtin.template:
    src: doctor.conf.j2
    dest: /etc/taut/doctor.conf
    owner: root
    group: root
    mode: "0644"
