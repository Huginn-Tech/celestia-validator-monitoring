---
- name: Restart celestia-mon-tensile
  ansible.builtin.systemd_service:
    name: celestia-mon-tensile
    state: restarted
    daemon_reload: "{{ celestia_mon_tensile_unit_file is defined and celestia_mon_tensile_unit_file is changed }}"
  when: celestia_mon_tensile_present or not ansible_check_mode
