---
- name: Restart celestia-mon-blackbox
  ansible.builtin.systemd_service:
    name: celestia-mon-blackbox
    state: restarted
    daemon_reload: "{{ celestia_mon_blackbox_unit_file is defined and celestia_mon_blackbox_unit_file is changed }}"
  when: celestia_mon_blackbox_present or not ansible_check_mode
