---
# Derived values. The settings themselves (version, checksums, port, Fibre's port, resource caps)
# live in versions.yml and the celestia_mon role defaults.

# On the monitor host while Fibre is on: Prometheus asks it for each Fibre host's readiness.
celestia_mon_blackbox_enabled: "{{ celestia_mon_fibre_enabled and groups.get('fibre', []) | length > 0 }}"

celestia_mon_blackbox_version: "{{ celestia_mon_versions.blackbox_exporter.version }}"
celestia_mon_blackbox_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
celestia_mon_blackbox_release: "blackbox_exporter-{{ celestia_mon_blackbox_version }}.linux-{{ celestia_mon_blackbox_arch }}"
celestia_mon_blackbox_url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ celestia_mon_blackbox_version }}"
# The tarball's SHA-256 pinned in versions.yml (from the release's sha256sums.txt).
celestia_mon_blackbox_sha256: "{{ celestia_mon_versions.blackbox_exporter.sha256[celestia_mon_blackbox_arch] }}"

# Each version gets its own directory and the unit runs the binary from there. An upgrade is a
# new directory and a restart.
celestia_mon_blackbox_dir: "/opt/celestia-mon/blackbox_exporter-{{ celestia_mon_blackbox_version }}"
celestia_mon_blackbox_binary: "{{ celestia_mon_blackbox_dir }}/blackbox_exporter"
# The binary's sha256, recorded at install from the checked release (sha256sum format).
celestia_mon_blackbox_sums_file: "{{ celestia_mon_blackbox_dir }}/SHA256SUMS"
# A root-only directory the release is unpacked into, removed after the install.
celestia_mon_blackbox_staging: /var/cache/celestia-mon/blackbox_exporter.staging

celestia_mon_blackbox_config_dir: /etc/celestia-mon/blackbox
celestia_mon_blackbox_config: "{{ celestia_mon_blackbox_config_dir }}/blackbox.yml"
celestia_mon_blackbox_listen_address: "127.0.0.1:{{ celestia_mon_ports.blackbox }}"

# The Fibre hosts' private addresses, the only ones besides 127.0.0.1 the unit may exchange
# traffic with.
celestia_mon_blackbox_fibre_ips: >-
  {{ groups.get('fibre', []) | map('extract', hostvars, 'celestia_mon_private_ip') | map('string') | unique | list }}
