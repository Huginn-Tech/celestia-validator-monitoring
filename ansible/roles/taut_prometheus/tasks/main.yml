---
# Taut writes these two files. If one exists without Taut's marker, another
# Prometheus (a distro package or a hand-made setup) lives here: stop instead
# of overwriting its configuration. grep prints file names only.
- name: Look for Prometheus files that Taut did not write
  ansible.builtin.command:
    argv:
      - grep
      - --files-without-match
      - --no-messages
      - --fixed-strings
      - "# Managed by Taut"
      - "{{ taut_prometheus_config_dir }}/prometheus.yml"
      - /etc/systemd/system/prometheus.service
  register: taut_prometheus_foreign
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (taut_prometheus_replace_existing | bool)

- name: Check that no other Prometheus is installed here
  ansible.builtin.assert:
    that:
      - taut_prometheus_foreign.stdout_lines | length == 0
    fail_msg: >-
      {{ taut_prometheus_foreign.stdout_lines | join(', ') }} was not written by Taut, so another Prometheus
      seems to be installed on this host. Use another monitor host, or set taut_prometheus_replace_existing: true
      to let Taut overwrite these files.
    quiet: true
  when: not (taut_prometheus_replace_existing | bool)

- name: Create the prometheus group
  ansible.builtin.group:
    name: prometheus
    system: true

- name: Create the prometheus user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: "{{ taut_prometheus_data_dir }}"
    create_home: false

- name: Look for the pinned Prometheus binaries
  ansible.builtin.stat:
    path: /usr/local/bin/{{ item }}-{{ taut_prometheus_version }}
  loop: "{{ taut_prometheus_binaries }}"
  register: taut_prometheus_found

# In check mode nothing is downloaded, so tasks that need the binaries or the unit
# are skipped until the pinned version is installed.
- name: Note whether the pinned Prometheus binaries are installed
  ansible.builtin.set_fact:
    taut_prometheus_present: "{{ taut_prometheus_found.results | rejectattr('stat.exists') | list | length == 0 }}"

- name: Report the pending install of Prometheus {{ taut_prometheus_version }}
  ansible.builtin.debug:
    msg: Would install {{ taut_prometheus_binaries | join(' and ') }} {{ taut_prometheus_version }} in /usr/local/bin and restart Prometheus.
  changed_when: true
  when: ansible_check_mode and not taut_prometheus_present

- name: Install Prometheus {{ taut_prometheus_version }}
  when: not taut_prometheus_present and not ansible_check_mode
  block:
    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/taut
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Prometheus release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ taut_prometheus_download_url }}/{{ taut_prometheus_release }}.tar.gz"
        dest: /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        checksum: "sha256:{{ taut_prometheus_download_url }}/sha256sums.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack the Prometheus release
      ansible.builtin.unarchive:
        src: /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        dest: /var/cache/taut
        remote_src: true

    - name: Install the Prometheus binaries
      ansible.builtin.copy:
        src: /var/cache/taut/{{ taut_prometheus_release }}/{{ item }}
        dest: /usr/local/bin/{{ item }}-{{ taut_prometheus_version }}
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop: "{{ taut_prometheus_binaries }}"

    - name: Remove the downloaded Prometheus release
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        - /var/cache/taut/{{ taut_prometheus_release }}

- name: Point the Prometheus binaries at the pinned version
  ansible.builtin.file:
    src: /usr/local/bin/{{ item }}-{{ taut_prometheus_version }}
    dest: /usr/local/bin/{{ item }}
    state: link
    owner: root
    group: root
  loop: "{{ taut_prometheus_binaries }}"
  when: taut_prometheus_present or not ansible_check_mode
  notify: Restart Prometheus

- name: Create the Prometheus configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ taut_prometheus_config_dir }}"
    - "{{ taut_prometheus_rules_dir }}"

- name: Create the Prometheus data directory
  ansible.builtin.file:
    path: "{{ taut_prometheus_data_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Render the Taut alert rules
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../monitoring/rules/taut.rules.yml.j2"
    dest: "{{ taut_prometheus_rules_dir }}/taut.rules.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  notify: Reload Prometheus

- name: Render the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ taut_prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/promtool check config %s
  notify: Reload Prometheus

- name: Install the Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus

- name: Allow the monitor to reach Prometheus through an active ufw
  ansible.builtin.include_role:
    name: taut
    tasks_from: firewall
  vars:
    taut_firewall_port: "{{ taut_ports.prometheus }}"

- name: Start Prometheus and enable it at boot
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
  when: taut_prometheus_present or not ansible_check_mode

# Apply pending reloads and restarts now, so a failure later in the play
# (Alertmanager or Grafana) cannot drop them.
- name: Apply pending Prometheus changes
  ansible.builtin.meta: flush_handlers
