---
# Taut's Prometheus has its own unit, user, paths and port (taut-prometheus), so it
# installs next to any other Prometheus on the host and leaves it alone.
- name: Check that taut-prometheus can use port {{ taut_ports.prometheus }}
  ansible.builtin.include_role:
    name: taut
    tasks_from: port_check
  vars:
    taut_port_check_port: "{{ taut_ports.prometheus }}"
    taut_port_check_unit: taut-prometheus

- name: Create the taut-prometheus group
  ansible.builtin.group:
    name: taut-prometheus
    system: true

- name: Create the taut-prometheus user
  ansible.builtin.user:
    name: taut-prometheus
    group: taut-prometheus
    system: true
    shell: /usr/sbin/nologin
    home: "{{ taut_prometheus_data_dir }}"
    create_home: false

- name: Look for the pinned Prometheus binaries
  ansible.builtin.stat:
    path: "{{ taut_prometheus_home }}/{{ item }}"
  loop: "{{ taut_prometheus_binaries }}"
  register: taut_prometheus_found

# In check mode nothing is downloaded, so tasks that need the binaries or the unit
# are skipped until the pinned version is installed.
- name: Note whether the pinned Prometheus binaries are installed
  ansible.builtin.set_fact:
    taut_prometheus_present: "{{ taut_prometheus_found.results | rejectattr('stat.exists') | list | length == 0 }}"

- name: Report the pending install of Prometheus {{ taut_prometheus_version }}
  ansible.builtin.debug:
    msg: Would install {{ taut_prometheus_binaries | join(' and ') }} {{ taut_prometheus_version }} in {{ taut_prometheus_home }} and restart taut-prometheus.
  changed_when: true
  when: ansible_check_mode and not taut_prometheus_present

# The shared parents first, so a service directory below never creates them with its own owner.
- name: Create the Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/taut
    - /etc/taut
    - /var/lib/taut
    - "{{ taut_prometheus_home }}"
    - "{{ taut_prometheus_config_dir }}"
    - "{{ taut_prometheus_rules_dir }}"

- name: Create the Prometheus data directory
  ansible.builtin.file:
    path: "{{ taut_prometheus_data_dir }}"
    state: directory
    owner: taut-prometheus
    group: taut-prometheus
    mode: "0750"

- name: Install Prometheus {{ taut_prometheus_version }}
  when: not taut_prometheus_present and not ansible_check_mode
  block:
    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/taut
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Prometheus release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ taut_prometheus_download_url }}/{{ taut_prometheus_release }}.tar.gz"
        dest: /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        checksum: "sha256:{{ taut_prometheus_download_url }}/sha256sums.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack the Prometheus release
      ansible.builtin.unarchive:
        src: /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        dest: /var/cache/taut
        remote_src: true

    - name: Install the Prometheus binaries
      ansible.builtin.copy:
        src: /var/cache/taut/{{ taut_prometheus_release }}/{{ item }}
        dest: "{{ taut_prometheus_home }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop: "{{ taut_prometheus_binaries }}"

    - name: Remove the downloaded Prometheus release
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/taut/{{ taut_prometheus_release }}.tar.gz
        - /var/cache/taut/{{ taut_prometheus_release }}

- name: Render the Taut alert rules
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../monitoring/rules/taut.rules.yml.j2"
    dest: "{{ taut_prometheus_rules_dir }}/taut.rules.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ taut_prometheus_home }}/promtool check rules %s"
  notify: Reload Prometheus

- name: Render the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ taut_prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ taut_prometheus_home }}/promtool check config %s"
  notify: Reload Prometheus

# The unit names the versioned binary, so a new version changes it and restarts the service.
- name: Install the taut-prometheus systemd unit
  ansible.builtin.template:
    src: taut-prometheus.service.j2
    dest: /etc/systemd/system/taut-prometheus.service
    owner: root
    group: root
    mode: "0644"
  register: taut_prometheus_unit_file
  notify: Restart Prometheus

# Reload systemd only when Taut's unit changed: a reload also loads unit files
# that someone else edited on disk and has not reloaded yet.
- name: Start taut-prometheus and enable it at boot
  ansible.builtin.systemd_service:
    name: taut-prometheus
    enabled: true
    state: started
    daemon_reload: "{{ taut_prometheus_unit_file is changed }}"
  when: taut_prometheus_present or not ansible_check_mode

# Apply pending reloads and restarts now, so a failure later in the play
# (Alertmanager or Grafana) cannot drop them.
- name: Apply pending Prometheus changes
  ansible.builtin.meta: flush_handlers

# systemctl returns before the service binds, so a crash loop would otherwise go unnoticed.
# Waiting here also lets the bind check at the end of the playbook see the socket.
- name: Wait for Prometheus on {{ taut_prometheus_listen_address }}
  ansible.builtin.wait_for:
    host: "{{ taut_private_ip }}"
    port: "{{ taut_ports.prometheus }}"
    timeout: 60
    msg: taut-prometheus does not listen on {{ taut_prometheus_listen_address }}. See journalctl -u taut-prometheus.
  when: not ansible_check_mode

- name: Find older Prometheus versions
  ansible.builtin.find:
    paths: /opt/taut
    patterns: prometheus-*
    excludes: prometheus-{{ taut_prometheus_version }}
    file_type: directory
  register: taut_prometheus_old
  when: taut_prometheus_present or not ansible_check_mode

- name: Remove older Prometheus versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ taut_prometheus_old.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
