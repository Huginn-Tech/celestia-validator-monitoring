---
# Directory Prometheus loads alert rules from (rule_files: <dir>/*.yml).
# The Taut rules are rendered into it as taut.rules.yml.
taut_prometheus_rules_dir: /etc/prometheus/rules

# Taut stops when /etc/prometheus/prometheus.yml or /etc/systemd/system/prometheus.service
# exists and was not written by Taut (another Prometheus is installed). Set this to true
# to let Taut overwrite both files. The old configuration is lost, and rule files
# already in taut_prometheus_rules_dir are loaded together with Taut's.
taut_prometheus_replace_existing: false
