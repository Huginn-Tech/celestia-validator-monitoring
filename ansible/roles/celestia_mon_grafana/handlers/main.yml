---
# Reload systemd only when celestia-mon's unit changed (see "Enable and start
# celestia-mon-grafana"): settings changes need a restart, not a reload.
- name: Restart celestia-mon-grafana
  ansible.builtin.systemd_service:
    name: celestia-mon-grafana
    state: restarted
    daemon_reload: "{{ celestia_mon_grafana_unit_file is defined and celestia_mon_grafana_unit_file is changed }}"
  when: celestia_mon_grafana_installed.stat.exists or not ansible_check_mode
