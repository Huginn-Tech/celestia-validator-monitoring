---
celestia_mon_prometheus_version: "{{ celestia_mon_versions.prometheus.version }}"
celestia_mon_prometheus_arch_map:
  x86_64: amd64
  aarch64: arm64
celestia_mon_prometheus_arch: "{{ celestia_mon_prometheus_arch_map[ansible_facts.architecture] }}"
celestia_mon_prometheus_release: "prometheus-{{ celestia_mon_prometheus_version }}.linux-{{ celestia_mon_prometheus_arch }}"
celestia_mon_prometheus_download_url: "https://github.com/prometheus/prometheus/releases/download/v{{ celestia_mon_prometheus_version }}"
# Pinned in versions.yml from the release's sha256sums.txt; nothing is fetched to check the download.
celestia_mon_prometheus_sha256: "{{ celestia_mon_versions.prometheus.sha256[celestia_mon_prometheus_arch] }}"

# The binaries go to /opt/celestia-mon/prometheus-<version>/ and the unit runs them from there,
# so nothing else on the host is replaced. An upgrade is a new directory plus a restart.
celestia_mon_prometheus_home: "/opt/celestia-mon/prometheus-{{ celestia_mon_prometheus_version }}"
celestia_mon_prometheus_binaries:
  - prometheus
  - promtool
# The sha256 of each binary, recorded at install from the checked release (sha256sum format).
celestia_mon_prometheus_sums_file: "{{ celestia_mon_prometheus_home }}/SHA256SUMS"
# A root-only directory the release is unpacked into, removed after the install.
celestia_mon_prometheus_staging: /var/cache/celestia-mon/prometheus.staging

celestia_mon_prometheus_config_dir: /etc/celestia-mon/prometheus
celestia_mon_prometheus_data_dir: /var/lib/celestia-mon/prometheus
# Loopback only: Grafana and Alertmanager run on the same host. Every request also needs the
# API password (celestia_mon_api_user, celestia_mon_api_password_file), because every account
# on the host can reach loopback.
celestia_mon_prometheus_listen_address: "127.0.0.1:{{ celestia_mon_ports.prometheus }}"
