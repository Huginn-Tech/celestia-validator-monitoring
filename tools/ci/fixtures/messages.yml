# The text tests of the rules job (tools/ci/check_messages.py SECTION): each renders its template with
# amtool over the alert data of tools/ci/fixtures/<data>, as html (Telegram) or text (the others), and
# wants the output to be "equals" (trailing newlines aside, as the shell's $(...) drops them) or to have
# "line" as one of its lines.
# An alert that fires is its title line (🔴 page, 🟡 message, its name, its host and the label that
# tells it apart, here the mount point), its summary and its description; one that ended is one line.
telegram-discord:
  - data: announcement.json
    type: html
    template: '{{ template "celestia.telegram.message" . }}'
    equals: "📣 <b>Celestia #mainnet-announcements</b>\n\nMainnet upgrades at height 100 &lt;b&gt;&amp;"
  - data: announcement.json
    type: text
    template: '{{ template "celestia.discord.title" . }}'
    equals: "📣 Celestia #mainnet-announcements"
  - data: announcement.json
    type: text
    template: '{{ template "celestia.discord.message" . }}'
    equals: "Mainnet upgrades at height 100 <b>&"
  - data: alerts.json
    type: html
    template: '{{ template "celestia.telegram.message" . }}'
    equals: "🔴 <b>DiskLow</b> · val-1 · /\n/ on val-1 has 4.2% free.\nFree space is falling.\n\n\
      ✅ <b>DiskLow</b> · val-1 · /data resolved"
  - data: alerts.json
    type: text
    template: '{{ template "celestia.discord.title" . }}'
    equals: "🔴 DiskLow · val-1 · /"
  - data: alerts.json
    type: text
    template: '{{ template "celestia.discord.message" . }}'
    equals: "**/ on val-1 has 4.2% free.**\nFree space is falling.\n\n\
      ✅ DiskLow · val-1 · /data resolved"
  # An alert that names no host, as the upgrade alerts: nothing after its name. It ended, so the
  # text under Discord's title is empty.
  - data: upgrade.json
    type: html
    template: '{{ template "celestia.telegram.message" . }}'
    equals: "✅ <b>UpgradeScheduled</b> resolved"
  - data: upgrade.json
    type: text
    template: '{{ template "celestia.discord.title" . }}'
    equals: "✅ UpgradeScheduled resolved"
  - data: upgrade.json
    type: text
    template: '{{ template "celestia.discord.message" . }}'
    equals: ""
  # Two ServiceDown messages of one host, told apart by the unit's name or, without one, by the part
  # of the host it is about; the first ended, so the one that fires opens the text without a blank line.
  - data: ended-first.json
    type: html
    template: '{{ template "celestia.telegram.message" . }}'
    equals: "✅ <b>ServiceDown</b> · val-1 · celestia-appd.service resolved\n\n\
      🟡 <b>ServiceDown</b> · val-1 · node_exporter\nnode_exporter is unreachable.\n\
      The service and disk alerts of this host cannot fire."
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.discord.title" . }}'
    equals: "✅ ServiceDown · val-1 · celestia-appd.service resolved"
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.discord.message" . }}'
    equals: "🟡 ServiceDown · val-1 · node_exporter\n**node_exporter is unreachable.**\n\
      The service and disk alerts of this host cannot fire."
  # An alert without a host that carries a reason and a check, as FibreDown's registration rules:
  # the reason stands after its name.
  - data: registration.json
    type: html
    template: '{{ template "celestia.telegram.message" . }}'
    line: "🔴 <b>FibreDown</b> · wrong_host"
slack-pagerduty:
  - data: text-announcement.json
    type: text
    template: '{{ template "celestia.slack.title" . }}'
    equals: "📣 Celestia #mainnet-announcements"
  - data: text-announcement.json
    type: text
    template: '{{ template "celestia.slack.text" . }}'
    equals: "Mainnet upgrades at height 100 &lt;b&gt;&amp;"
  - data: text-announcement.json
    type: text
    template: '{{ template "celestia.pagerduty.description" . }}'
    equals: "Celestia announcement from Celestia #mainnet-announcements"
  - data: text-alerts.json
    type: text
    template: '{{ template "celestia.slack.title" . }}'
    equals: "🔴 DiskLow · val-1 · /"
  - data: text-alerts.json
    type: text
    template: '{{ template "celestia.slack.text" . }}'
    equals: "*/ on val-1 has 4.2% free.*\nFree space is falling &amp; fast.\n\n\
      ✅ DiskLow · val-1 · /data resolved"
  - data: text-alerts.json
    type: text
    template: '{{ template "celestia.pagerduty.description" . }}'
    equals: "DiskLow · val-1: / on val-1 has 4.2% free. (2 alerts)"
  - data: text-alerts.json
    type: text
    template: '{{ template "celestia.pagerduty.alerts" .Alerts.Firing }}'
    equals: "DiskLow · val-1 · /: / on val-1 has 4.2% free. Free space is falling & fast."
  # A resolved alert's line in PagerDuty's details: without its description.
  - data: text-alerts.json
    type: text
    template: '{{ template "celestia.pagerduty.alerts" .Alerts.Resolved }}'
    equals: "DiskLow · val-1 · /data: /data on val-1 is read-only."
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.slack.title" . }}'
    equals: "✅ ServiceDown · val-1 · celestia-appd.service resolved"
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.slack.text" . }}'
    equals: "🟡 ServiceDown · val-1 · node_exporter\n*node_exporter is unreachable.*\n\
      The service and disk alerts of this host cannot fire."
  # PagerDuty's title takes the first alert that fires, not one that ended before it.
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.pagerduty.description" . }}'
    equals: "ServiceDown · val-1: node_exporter is unreachable. (2 alerts)"
  - data: ended-first.json
    type: text
    template: '{{ template "celestia.pagerduty.alerts" .Alerts.Firing }}'
    equals: "ServiceDown · val-1 · node_exporter: node_exporter is unreachable. \
      The service and disk alerts of this host cannot fire."
  # An alert that ended and names no host: its one line as Slack's title, and no text under it.
  - data: upgrade.json
    type: text
    template: '{{ template "celestia.slack.title" . }}'
    equals: "✅ UpgradeScheduled resolved"
  - data: upgrade.json
    type: text
    template: '{{ template "celestia.slack.text" . }}'
    equals: ""
  - data: registration.json
    type: text
    template: '{{ template "celestia.slack.title" . }}'
    equals: "🔴 FibreDown · wrong_host"
