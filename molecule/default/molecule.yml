---
# One privileged Ubuntu 24.04 container with systemd as PID 1 that plays every role
# celestia-mon has: validator, Fibre host and monitor, with a remote signer and Fibre on.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: celestia-mon-node
    image: ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - validator
      - fibre
      - monitor
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        celestia_mon_signer: remote
        celestia_mon_fibre_enabled: true
        # Dummy receivers on a closed local port: nothing leaves the CI runner. Page and
        # message alerts both go to every receiver that is not PagerDuty. Webhooks only:
        # a failed Slack, Telegram, Discord or PagerDuty notification stops the Watchdog
        # heartbeat by design, and the test alerts here can never be delivered.
        celestia_mon_receivers:
          - type: webhook
            url: http://127.0.0.1:9/message
          - type: webhook
            url: http://127.0.0.1:9/chat
        celestia_mon_deadman_webhook_url: http://127.0.0.1:9/deadman
        celestia_mon_grafana_admin_password: molecule-test-only
        # Small enough for the free disk of a CI runner; verify.yml checks Prometheus applies it.
        celestia_mon_prometheus_retention_size: 1GB
    host_vars:
      celestia-mon-node:
        celestia_mon_private_ip: "{{ ansible_default_ipv4.address }}"
        celestia_mon_data_mounts:
          - /
        celestia_mon_fibre_mount: /
        celestia_mon_fibre_public_endpoint: fibre.example.invalid:7980
        celestia_mon_link_mbps: 1000
verifier:
  name: ansible
# Adds a check-mode run (--check) on the fresh container before the real run, so a
# first install that breaks dry runs fails the test.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
prerun: false
