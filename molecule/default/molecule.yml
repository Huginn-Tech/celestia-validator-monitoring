---
# One privileged Ubuntu 24.04 container with systemd as PID 1 that plays every role
# Taut has: validator, Fibre host and monitor, with a remote signer and Fibre on.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: taut-node
    image: ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - validator
      - fibre
      - monitor
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        taut_signer: remote
        taut_fibre_enabled: true
        # Dummy receivers on a closed local port: nothing leaves the CI runner.
        taut_receivers:
          page:
            - type: webhook
              url: http://127.0.0.1:9/page
            - type: slack
              api_url: http://127.0.0.1:9/slack
              channel: "#taut-test"
          message:
            - type: webhook
              url: http://127.0.0.1:9/message
        taut_deadman_webhook_url: http://127.0.0.1:9/deadman
        taut_grafana_admin_password: molecule-test-only
    host_vars:
      taut-node:
        taut_private_ip: "{{ ansible_default_ipv4.address }}"
        taut_data_mounts:
          - /
        taut_fibre_mount: /
        taut_fibre_public_endpoint: fibre.example.invalid:7980
verifier:
  name: ansible
# Adds a check-mode run (--check) on the fresh container before the real run, so a
# first install that breaks dry runs fails the test.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
prerun: false
