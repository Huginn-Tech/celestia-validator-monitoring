---
- name: Verify the celestia-mon install
  hosts: all
  gather_facts: true
  vars:
    # systemd units of the services celestia-mon installs on this all-in-one host, with the
    # memory targets and limits of the shared defaults as systemd shows them, in bytes.
    celestia_mon_verify_units:
      celestia-mon-node-exporter.service:
        memory_high: 134217728 # 128M
        memory_max: 268435456 # 256M
      celestia-mon-otelcol.service:
        memory_high: 402653184 # 384M
        memory_max: 1073741824 # 1G
      celestia-mon-prometheus.service:
        memory_high: 2147483648 # 2G
        memory_max: 4294967296 # 4G
      celestia-mon-alertmanager.service:
        memory_high: 134217728 # 128M
        memory_max: 268435456 # 256M
      celestia-mon-grafana.service:
        memory_high: 536870912 # 512M
        memory_max: 1073741824 # 1G
      celestia-mon-blackbox.service:
        memory_high: 134217728 # 128M
        memory_max: 268435456 # 256M
    # Unit names and binaries other installs on the host use; celestia-mon must leave them alone.
    celestia_mon_verify_foreign_units:
      - node_exporter.service
      - prometheus-node-exporter.service
      - otelcol-contrib.service
      - prometheus.service
      - alertmanager.service
      - grafana-server.service
      - blackbox_exporter.service
      - prometheus-blackbox-exporter.service
    celestia_mon_verify_foreign_binaries:
      - node_exporter
      - otelcol-contrib
      - prometheus
      - promtool
      - alertmanager
      - amtool
      - grafana
      - grafana-server
      - blackbox_exporter
    # celestia-mon's default ports (celestia_mon_ports).
    celestia_mon_verify_ports:
      node_exporter: 9910
      otelcol_prometheus: 9911
      prometheus: 9912
      alertmanager: 9913
      grafana: 9914
      otelcol_otlp: 9915
      blackbox: 9919
    # Services the monitor reaches on the private address.
    celestia_mon_verify_private_ports:
      - node_exporter
      - otelcol_prometheus
    # Services on loopback: those only this host uses, and Grafana at its default
    # celestia_mon_grafana_listen (the operator reaches it through an SSH tunnel).
    celestia_mon_verify_loopback_ports:
      - prometheus
      - alertmanager
      - otelcol_otlp
      - grafana
      - blackbox
    celestia_mon_verify_grafana: "http://127.0.0.1:{{ celestia_mon_verify_ports.grafana }}"
    # Scrape jobs Prometheus must have, with the role label of this host's target.
    celestia_mon_verify_jobs:
      - job: prometheus
        role: monitor
      - job: alertmanager
        role: monitor
      - job: celestia-app
        role: validator
      - job: node
        role: validator
      - job: otelcol
        role: fibre
      - job: fibre_health
        role: fibre
    celestia_mon_verify_prometheus: "http://127.0.0.1:{{ celestia_mon_verify_ports.prometheus }}"
    celestia_mon_verify_alertmanager: "http://127.0.0.1:{{ celestia_mon_verify_ports.alertmanager }}"
    # Prometheus and Alertmanager take only requests with the API password, which the install
    # generated on the host (celestia_mon_api_user, celestia_mon_api_password_file).
    celestia_mon_verify_api_user: celestia-mon
    celestia_mon_verify_api_password_file: /etc/celestia-mon/api-password
    # Alertmanager labels its notification metrics with the receiver (receiver-name-in-metrics).
    celestia_mon_verify_deadman_query: 'alertmanager_notifications_total{job="alertmanager",receiver_name="deadman"}'
    # molecule.yml sets celestia_mon_prometheus_retention_size: 1GB; Prometheus counts 1GB as 1024^3 bytes.
    celestia_mon_verify_retention_query: 'prometheus_tsdb_retention_limit_bytes{job="prometheus"}'
    celestia_mon_verify_retention_bytes: 1073741824
    # GOMEMLIMIT of Prometheus and Alertmanager: 90% of their default MemoryHigh, in bytes.
    celestia_mon_verify_gomemlimit_query: 'go_gc_gomemlimit_bytes{job=~"prometheus|alertmanager"}'
    celestia_mon_verify_gomemlimit:
      prometheus: 1932735283 # 0.9 * 2G
      alertmanager: 120795955 # 0.9 * 128M
  tasks:
    - name: Collect the service states
      ansible.builtin.service_facts:

    - name: Check that every celestia-mon service is running
      ansible.builtin.assert:
        that:
          - item in ansible_facts.services
          - ansible_facts.services[item].state == 'running'
        fail_msg: "{{ item }} is not running"
        quiet: true
      loop: "{{ celestia_mon_verify_units | list }}"

    - name: Check that celestia-mon took none of the usual unit names
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.services
        fail_msg: "{{ item }} exists; celestia-mon's units are named celestia-mon-*."
        quiet: true
      loop: "{{ celestia_mon_verify_foreign_units }}"

    - name: Look for binaries in /usr/local/bin
      ansible.builtin.stat:
        path: /usr/local/bin/{{ item }}
        get_checksum: false
      loop: "{{ celestia_mon_verify_foreign_binaries }}"
      register: celestia_mon_verify_binaries

    - name: Check that celestia-mon put no binary in /usr/local/bin
      ansible.builtin.assert:
        that:
          - celestia_mon_verify_binaries.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Found {{ celestia_mon_verify_binaries.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }}
          in /usr/local/bin; celestia-mon installs its binaries under /opt/celestia-mon.
        quiet: true

    # With only a name the module just reads the unit's properties.
    - name: Read the resource caps of each celestia-mon service
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ celestia_mon_verify_units | list }}"
      register: celestia_mon_verify_caps

    - name: Check that each celestia-mon service runs with the default resource caps
      ansible.builtin.assert:
        that:
          - item.status.Nice | int == 10
          - item.status.CPUWeight | int == 20
          - item.status.IOWeight | int == 20
          - item.status.MemoryHigh | int == celestia_mon_verify_units[item.item].memory_high
          - item.status.MemoryMax | int == celestia_mon_verify_units[item.item].memory_max
          - item.status.OOMScoreAdjust | int == 500
        fail_msg: >-
          {{ item.item }} has Nice={{ item.status.Nice }} CPUWeight={{ item.status.CPUWeight }} IOWeight={{ item.status.IOWeight }}
          MemoryHigh={{ item.status.MemoryHigh }} MemoryMax={{ item.status.MemoryMax }} OOMScoreAdjust={{ item.status.OOMScoreAdjust }};
          expected Nice=10 CPUWeight=20 IOWeight=20 MemoryHigh={{ celestia_mon_verify_units[item.item].memory_high }}
          MemoryMax={{ celestia_mon_verify_units[item.item].memory_max }} OOMScoreAdjust=500.
        quiet: true
      loop: "{{ celestia_mon_verify_caps.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check that node_exporter and the collector's metrics answer on the private address
      ansible.builtin.wait_for:
        host: "{{ celestia_mon_private_ip }}"
        port: "{{ celestia_mon_verify_ports[item] }}"
        timeout: 60
      loop: "{{ celestia_mon_verify_private_ports }}"

    - name: Check that Prometheus, Alertmanager, the OTLP receiver, Grafana and blackbox_exporter answer on loopback
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ celestia_mon_verify_ports[item] }}"
        timeout: 60
      loop: "{{ celestia_mon_verify_loopback_ports }}"

    # 9094 is Alertmanager's default cluster port, which celestia-mon turns off.
    - name: Check that Prometheus, Alertmanager, Grafana, blackbox_exporter and Alertmanager's cluster port are closed on the private address
      ansible.builtin.wait_for:
        host: "{{ celestia_mon_private_ip }}"
        port: "{{ item }}"
        state: stopped
        timeout: 5
      loop:
        - "{{ celestia_mon_verify_ports.prometheus }}"
        - "{{ celestia_mon_verify_ports.alertmanager }}"
        - "{{ celestia_mon_verify_ports.grafana }}"
        - "{{ celestia_mon_verify_ports.blackbox }}"
        - 9094

    - name: Read the API password
      ansible.builtin.slurp:
        src: "{{ celestia_mon_verify_api_password_file }}"
      register: celestia_mon_verify_api_password_file_content
      no_log: true

    - name: Note the API password
      ansible.builtin.set_fact:
        celestia_mon_verify_api_password: "{{ celestia_mon_verify_api_password_file_content.content | b64decode | trim }}"
      no_log: true

    # Every account on the host can reach loopback, so the password is what keeps others out.
    - name: Check that Prometheus and Alertmanager refuse requests without the API password
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 401
      loop:
        - "{{ celestia_mon_verify_prometheus }}/api/v1/status/buildinfo"
        - "{{ celestia_mon_verify_prometheus }}/metrics"
        - "{{ celestia_mon_verify_alertmanager }}/api/v2/silences"
        - "{{ celestia_mon_verify_alertmanager }}/metrics"

    - name: Read the owner and mode of the API password file
      ansible.builtin.stat:
        path: "{{ celestia_mon_verify_api_password_file }}"
        get_checksum: false
      register: celestia_mon_verify_api_password_stat

    - name: Check the owner and mode of the API password file
      ansible.builtin.assert:
        that:
          - celestia_mon_verify_api_password_stat.stat.pw_name == 'root'
          - celestia_mon_verify_api_password_stat.stat.gr_name == 'celestia-mon-prometheus'
          - celestia_mon_verify_api_password_stat.stat.mode == '0640'
        fail_msg: >-
          {{ celestia_mon_verify_api_password_file }} has owner {{ celestia_mon_verify_api_password_stat.stat.pw_name }},
          group {{ celestia_mon_verify_api_password_stat.stat.gr_name }} and mode {{ celestia_mon_verify_api_password_stat.stat.mode }};
          expected root, celestia-mon-prometheus and 0640.
        quiet: true

    - name: Wait until Prometheus has scraped itself and Alertmanager
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/targets?state=active"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_targets
      until: >-
        celestia_mon_verify_targets.json.data.activeTargets | default([])
        | selectattr('labels.job', 'in', ['prometheus', 'alertmanager']) | selectattr('health', 'equalto', 'up') | list | length == 2
      retries: 12
      delay: 5

    # Their units exchange traffic only with loopback, this host's private address and the
    # monitor's (the same here) and the ufw sources, whatever the firewall: Prometheus scrapes
    # them over the private address, so a unit that refused it would leave them down.
    - name: Wait until Prometheus has scraped node_exporter and the collector on the private address
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/targets?state=active"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_private_targets
      until: >-
        celestia_mon_verify_private_targets.json.data.activeTargets | default([])
        | selectattr('labels.job', 'in', ['node', 'otelcol']) | selectattr('health', 'equalto', 'up') | list | length == 2
      retries: 12
      delay: 5

    - name: Check that node_exporter and the collector refuse every other address
      ansible.builtin.assert:
        that:
          - "'0.0.0.0/0' in item.status.IPAddressDeny | default('') | split"
          - "'::/0' in item.status.IPAddressDeny | default('') | split"
          - >-
            celestia_mon_private_ip in (item.status.IPAddressAllow | default('') | split
            | map('regex_replace', '/[0-9]+$', '') | list)
        fail_msg: >-
          {{ item.item }} has IPAddressDeny={{ item.status.IPAddressDeny | default('') }} and
          IPAddressAllow={{ item.status.IPAddressAllow | default('') }}; expected every address denied but loopback,
          {{ celestia_mon_private_ip }} and the ufw sources.
        quiet: true
      loop: "{{ celestia_mon_verify_caps.results | selectattr('item', 'in', ['celestia-mon-node-exporter.service', 'celestia-mon-otelcol.service']) | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check that Prometheus has exactly the expected jobs
      ansible.builtin.assert:
        that:
          - celestia_mon_verify_targets.json.data.activeTargets | map(attribute='scrapePool') | sort == celestia_mon_verify_jobs | map(attribute='job') | sort
        fail_msg: >-
          Expected one target per job in {{ celestia_mon_verify_jobs | map(attribute='job') | join(', ') }}, got
          {{ celestia_mon_verify_targets.json.data.activeTargets | map(attribute='scrapePool') | join(', ') }}.
        quiet: true

    - name: Check the host and role labels of each job
      ansible.builtin.assert:
        that:
          - >-
            celestia_mon_verify_targets.json.data.activeTargets
            | selectattr('labels.job', 'equalto', item.job)
            | selectattr('labels.role', 'equalto', item.role)
            | selectattr('labels.host', 'equalto', inventory_hostname)
            | list | length == 1
        fail_msg: "Job {{ item.job }} has no target labelled host={{ inventory_hostname }}, role={{ item.role }}."
        quiet: true
      loop: "{{ celestia_mon_verify_jobs }}"
      loop_control:
        label: "{{ item.job }}"

    # Prometheus asks celestia-mon-blackbox on 127.0.0.1 for this host's readiness. No Fibre runs
    # here, so the probe itself fails, but blackbox answers it and the target is up.
    - name: Wait until Prometheus has scraped the readiness probe through celestia-mon-blackbox
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/targets?state=active"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_probe_target
      until: >-
        celestia_mon_verify_probe_target.json.data.activeTargets | default([])
        | selectattr('labels.job', 'equalto', 'fibre_health') | selectattr('health', 'equalto', 'up')
        | selectattr('scrapeUrl', 'match', 'http://127.0.0.1:9919/probe')
        | list | length == 1
      retries: 12
      delay: 5

    # Prometheus reports the retention it applies from prometheus.yml as a metric of its own.
    - name: Read the retention size Prometheus applies
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/query?query={{ celestia_mon_verify_retention_query | urlencode }}"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_retention
      until: celestia_mon_verify_retention.json.data.result | default([]) | length == 1
      retries: 6
      delay: 5

    - name: Check that Prometheus applies the configured retention size
      ansible.builtin.assert:
        that:
          - celestia_mon_verify_retention.json.data.result[0].value[1] | float == celestia_mon_verify_retention_bytes
        fail_msg: >-
          Prometheus keeps up to {{ celestia_mon_verify_retention.json.data.result[0].value[1] }} bytes of blocks,
          expected {{ celestia_mon_verify_retention_bytes }} (celestia_mon_prometheus_retention_size).
        quiet: true

    # Both report the Go memory limit they run with as a metric of their own.
    - name: Read the Go memory limit of Prometheus and Alertmanager
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/query?query={{ celestia_mon_verify_gomemlimit_query | urlencode }}"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_gomemlimit_result
      until: celestia_mon_verify_gomemlimit_result.json.data.result | default([]) | length == 2
      retries: 6
      delay: 5

    - name: Check that Prometheus and Alertmanager run with GOMEMLIMIT below MemoryHigh
      ansible.builtin.assert:
        that:
          - item.value[1] | float == celestia_mon_verify_gomemlimit[item.metric.job]
        fail_msg: >-
          {{ item.metric.job }} runs with a Go memory limit of {{ item.value[1] }} bytes,
          expected {{ celestia_mon_verify_gomemlimit[item.metric.job] }} (90% of its MemoryHigh).
        quiet: true
      loop: "{{ celestia_mon_verify_gomemlimit_result.json.data.result }}"
      loop_control:
        label: "{{ item.metric.job }}"

    - name: Read the loaded Alertmanager configuration
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_alertmanager }}/api/v2/status"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_am_status

    # Page alerts go to every receiver that is not PagerDuty too, so the page receiver must
    # carry the scenario's two webhooks.
    - name: Check that page alerts reach every receiver
      ansible.builtin.assert:
        that:
          - >-
            (celestia_mon_verify_am_status.json.config.original | from_yaml).receivers
            | selectattr('name', 'equalto', 'page') | map(attribute='webhook_configs', default=[]) | first | length == 2
        fail_msg: The page receiver lacks the two webhook configs of celestia_mon_receivers.
        quiet: true

    # Prometheus sends its alerts to Alertmanager with the API password. The Watchdog is not
    # waited for: it stops once a notification to the test receivers (a closed port) has failed,
    # while the alerts of this node-less host (NodeNotAdvancing, ServiceDown) keep firing.
    - name: Wait for Prometheus's alerts to reach Alertmanager
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_alertmanager }}/api/v2/alerts"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_alerts
      until: celestia_mon_verify_alerts.json | default([]) | selectattr('labels.alertname', 'in', celestia_mon_verify_alertnames) | list | length > 0
      retries: 18
      delay: 10
      vars:
        celestia_mon_verify_alertnames: [Watchdog, NodeNotAdvancing, ServiceDown]

    # The dead-man receiver's notifications carry receiver_name="deadman", so the rules can
    # tell its failures apart from the page and message receivers'.
    - name: Check that Prometheus has the dead-man receiver's notification metrics
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_prometheus }}/api/v1/query?query={{ celestia_mon_verify_deadman_query | urlencode }}"
        url_username: "{{ celestia_mon_verify_api_user }}"
        url_password: "{{ celestia_mon_verify_api_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_deadman
      until: celestia_mon_verify_deadman.json.data.result | default([]) | length > 0
      retries: 6
      delay: 5

    # Grafana reaches Prometheus on 127.0.0.1, and listens there itself (celestia_mon_grafana_listen).
    - name: Check that Grafana's Prometheus datasource answers
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_grafana }}/api/datasources/uid/celestia-mon-prometheus/health"
        url_username: admin
        url_password: "{{ celestia_mon_grafana_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_datasource
      until: celestia_mon_verify_datasource.json.status | default('') == 'OK'
      retries: 6
      delay: 5

    # Grafana's datasource has a login of its own: Prometheus takes it, Alertmanager does not, so a
    # Grafana that is taken over cannot silence alerts.
    - name: Read Grafana's API password
      ansible.builtin.slurp:
        src: /etc/celestia-mon/grafana-api-password
      register: celestia_mon_verify_grafana_api_password
      no_log: true

    - name: Check that Prometheus takes Grafana's login and Alertmanager refuses it
      ansible.builtin.uri:
        url: "{{ item.url }}"
        url_username: grafana
        url_password: "{{ celestia_mon_verify_grafana_api_password.content | b64decode | trim }}"
        force_basic_auth: true
        status_code: "{{ item.status }}"
      loop:
        - {url: "{{ celestia_mon_verify_prometheus }}/api/v1/status/buildinfo", status: 200}
        - {url: "{{ celestia_mon_verify_alertmanager }}/api/v2/silences", status: 401}
      loop_control:
        label: "{{ item.url }}"
      no_log: true

    - name: Read Grafana's snapshot sharing options
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_grafana }}/api/snapshot/shared-options/"
        url_username: admin
        url_password: "{{ celestia_mon_grafana_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: celestia_mon_verify_snapshots

    # A snapshot link opens without a login, so snapshots are off altogether.
    - name: Check that Grafana has snapshots off
      ansible.builtin.assert:
        that:
          - not (celestia_mon_verify_snapshots.json.snapshotEnabled | bool)
          - not (celestia_mon_verify_snapshots.json.externalEnabled | bool)
        fail_msg: Grafana offers snapshots; grafana.ini must set [snapshots] enabled = false and external_enabled = false.
        quiet: true

    # Anonymous access is off, so the dashboard needs a login.
    - name: Check that Grafana refuses the dashboard without a login
      ansible.builtin.uri:
        url: "{{ celestia_mon_verify_grafana }}/api/dashboards/uid/celestia-mon-validator"
        status_code: 401
